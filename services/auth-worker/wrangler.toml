name = "sykabelajar-auth-poc"
main = "src/worker.ts"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Dedicated NON-PRODUCTION D1 database created for the Better Auth staging PoC. Do not point this binding at production.
[[d1_databases]]
binding = "DB"
database_name = "sykabelajar-auth-poc"
database_id = "7a4f9008-a1c6-42b6-8a04-abde12699248"
migrations_dir = "migrations"

[vars]
AUTH_EMAIL_PROVIDER = "zeptomail"
BETTER_AUTH_URL = "https://auth.sykabelajar.my.id"
APP_ORIGIN = "https://sykabelajar.my.id"
SUPABASE_RESOURCE_AUDIENCE = "https://sykabelajar.my.id"
OAUTH_CALLBACK_URL = "https://sykabelajar.my.id/auth/oidc/callback"

[observability]
enabled = true
