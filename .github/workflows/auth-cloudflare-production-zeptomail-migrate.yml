name: Auth ZeptoMail Email — Production D1 Schema

on:
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - ".github/auth-ops/APPLY-PRODUCTION-ZEPTOMAIL-0011"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY-PRODUCTION-ZEPTOMAIL-sykabelajar-auth-prod to add ZeptoMail provider support to Production D1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auth-production-zeptomail-d1
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/security/auth-poc-stage-1' && github.actor == 'taufx98' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    name: Add ZeptoMail to Production email routing without touching identities or Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/auth-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout guarded auth branch
        uses: actions/checkout@v7
        with:
          ref: security/auth-poc-stage-1

      - name: Verify exact owner authorization, Production D1 target and immutable migration
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "taufx98"
          test "$GITHUB_REF" = "refs/heads/security/auth-poc-stage-1"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "APPLY-PRODUCTION-ZEPTOMAIL-sykabelajar-auth-prod"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            marker="../../.github/auth-ops/APPLY-PRODUCTION-ZEPTOMAIL-0011"
            test -f "$marker"
            test "$(cat "$marker")" = "APPLY-PRODUCTION-ZEPTOMAIL-sykabelajar-auth-prod"
          else
            exit 1
          fi
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          expected="9a2a886974c0f0ba7e05f7f843edb7803086dd04"
          actual="$(git hash-object migrations-production/0011_zeptomail_email_provider.sql)"
          test "$actual" = "$expected" || {
            echo "Blocked: reviewed Production ZeptoMail migration hash mismatch." >&2
            exit 1
          }
          for pattern in             '^name = "sykabelajar-auth-prod"$'             '^database_name = "sykabelajar-auth-prod"$'             '^database_id = "6d4dc7b5-8e71-4fdc-9cda-3230e49951c7"$'             '^migrations_dir = "migrations-production"$'; do
            grep -Eq "$pattern" wrangler.production.toml || {
              echo "Blocked: Production Wrangler configuration does not match the pinned target." >&2
              exit 1
            }
          done
          ! grep -Eq 'sykabelajar-auth-poc|7a4f9008-a1c6-42b6-8a04-abde12699248|ydamszdfsxqisanazdkb|staging\.sykabelajar\.my\.id' wrangler.production.toml
          echo "Verified owner, exact Production D1 target and immutable ZeptoMail migration."

      - name: Install locked dependencies and run all Worker checks
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/auth-worker/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run check

      - name: Verify Cloudflare confirms the exact Production D1 resource
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const id = "6d4dc7b5-8e71-4fdc-9cda-3230e49951c7";
          const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" +
            encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID) + "/d1/database/" + id, {
              headers: { Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN, Accept: "application/json" },
              redirect: "error",
            });
          const body = await response.json().catch(() => ({}));
          if (!response.ok || body.success !== true || body.result?.name !== "sykabelajar-auth-prod" || body.result?.uuid !== id) {
            throw new Error("Cloudflare did not verify the exact Production D1 resource.");
          }
          console.log("Verified the fixed Production D1 resource.");
          NODE

      - name: Capture Production migration, identity, provider and Worker state before the migration
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT name FROM d1_migrations ORDER BY name;" > "$RUNNER_TEMP/zeptomail-prod-before-migrations.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT (SELECT COUNT(*) FROM \"user\") AS users,(SELECT COUNT(*) FROM \"account\") AS accounts,(SELECT COUNT(*) FROM \"session\") AS sessions,(SELECT COUNT(*) FROM auth_email_provider_accounts) AS email_accounts,(SELECT COUNT(*) FROM auth_email_accounts) AS legacy_email_accounts;" > "$RUNNER_TEMP/zeptomail-prod-before-counts.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT 'user' AS entity,id AS entity_id,NULL AS user_id,NULL AS provider_id,NULL AS account_id FROM \"user\" UNION ALL SELECT 'account',id,\"userId\",\"providerId\",\"accountId\" FROM \"account\" UNION ALL SELECT 'session',id,\"userId\",NULL,NULL FROM \"session\" ORDER BY entity,entity_id;" > "$RUNNER_TEMP/zeptomail-prod-before-identity.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT id,label,provider,sender_address,sender_name,endpoint_url,auth_mode,credentials_ciphertext,enabled,priority,quota_hour_limit,quota_day_limit,quota_month_limit,hour_bucket,hour_used,day_bucket,day_used,month_bucket,month_used,cooldown_until,last_error_code,last_error_at,last_success_at,created_at,updated_at,created_by,updated_by FROM auth_email_provider_accounts ORDER BY id;" > "$RUNNER_TEMP/zeptomail-prod-before-providers.json"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          const root = process.env.RUNNER_TEMP;
          const read = (name) => JSON.parse(readFileSync(root + "/" + name, "utf8"));
          const rows = (value, out = []) => {
            if (Array.isArray(value)) value.forEach((x) => rows(x, out));
            else if (value && typeof value === "object") {
              out.push(value);
              Object.values(value).forEach((x) => { if (x && typeof x === "object") rows(x, out); });
            }
            return out;
          };
          const applied = new Set(rows(read("zeptomail-prod-before-migrations.json")).map((x) => x.name).filter(Boolean));
          const base = [
            "0000_auth_worker_internal_config.sql","0001_better_auth.sql","0002_seed_first_party_oauth_client.sql",
            "0003_zeptomail_agent_settings.sql","0004_better_auth_registration_attributes.sql",
            "0005_telegram_phone_verification.sql","0006_transactional_email_provider.sql",
            "0007_managed_social_login_providers.sql","0008_auth_runtime_settings.sql",
            "0009_multi_provider_email_routing.sql","0010_custom_http_email_provider.sql",
          ];
          for (const name of base) if (!applied.has(name)) throw new Error("Required Production D1 migration is missing: " + name);
          const unexpected = [...applied].filter((name) => ![...base, "0011_zeptomail_email_provider.sql"].includes(name));
          if (unexpected.length) throw new Error("Unexpected Production migration history: " + unexpected.join(", "));
          const counts = rows(read("zeptomail-prod-before-counts.json")).find((x) => Object.hasOwn(x, "users"));
          if (!counts) throw new Error("Production identity/provider counts are unavailable.");
          const identities = rows(read("zeptomail-prod-before-identity.json"))
            .filter((x) => typeof x.entity === "string" && typeof x.entity_id === "string")
            .sort((a, b) => (a.entity + ":" + a.entity_id).localeCompare(b.entity + ":" + b.entity_id));
          const providers = rows(read("zeptomail-prod-before-providers.json"))
            .filter((x) => typeof x.id === "string" && typeof x.provider === "string")
            .sort((a, b) => a.id.localeCompare(b.id));
          writeFileSync(root + "/zeptomail-prod-identity-fingerprint.txt", createHash("sha256").update(JSON.stringify(identities)).digest("hex"));
          writeFileSync(root + "/zeptomail-prod-provider-fingerprint.txt", createHash("sha256").update(JSON.stringify(providers)).digest("hex"));
          console.log(JSON.stringify({
            migration0011AlreadyApplied: applied.has("0011_zeptomail_email_provider.sql"),
            users: Number(counts.users), accounts: Number(counts.accounts), sessions: Number(counts.sessions),
            providerAccounts: Number(counts.email_accounts), legacyEmailAccounts: Number(counts.legacy_email_accounts),
            identityFingerprintRecorded: true, providerAndQuotaFingerprintRecorded: true,
          }));
          NODE

      - name: Apply only the reviewed Production D1 schema migration
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.production.toml d1 migrations apply sykabelajar-auth-prod --remote

      - name: Verify ZeptoMail constraint and prove all existing Production data is unchanged
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT name FROM d1_migrations ORDER BY name;" > "$RUNNER_TEMP/zeptomail-prod-after-migrations.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='auth_email_provider_accounts';" > "$RUNNER_TEMP/zeptomail-prod-after-schema.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT (SELECT COUNT(*) FROM \"user\") AS users,(SELECT COUNT(*) FROM \"account\") AS accounts,(SELECT COUNT(*) FROM \"session\") AS sessions,(SELECT COUNT(*) FROM auth_email_provider_accounts) AS email_accounts,(SELECT COUNT(*) FROM auth_email_accounts) AS legacy_email_accounts;" > "$RUNNER_TEMP/zeptomail-prod-after-counts.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT 'user' AS entity,id AS entity_id,NULL AS user_id,NULL AS provider_id,NULL AS account_id FROM \"user\" UNION ALL SELECT 'account',id,\"userId\",\"providerId\",\"accountId\" FROM \"account\" UNION ALL SELECT 'session',id,\"userId\",NULL,NULL FROM \"session\" ORDER BY entity,entity_id;" > "$RUNNER_TEMP/zeptomail-prod-after-identity.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT id,label,provider,sender_address,sender_name,endpoint_url,auth_mode,credentials_ciphertext,enabled,priority,quota_hour_limit,quota_day_limit,quota_month_limit,hour_bucket,hour_used,day_bucket,day_used,month_bucket,month_used,cooldown_until,last_error_code,last_error_at,last_success_at,created_at,updated_at,created_by,updated_by FROM auth_email_provider_accounts ORDER BY id;" > "$RUNNER_TEMP/zeptomail-prod-after-providers.json"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const root = process.env.RUNNER_TEMP;
          const read = (name) => JSON.parse(readFileSync(root + "/" + name, "utf8"));
          const rows = (value, out = []) => {
            if (Array.isArray(value)) value.forEach((x) => rows(x, out));
            else if (value && typeof value === "object") {
              out.push(value);
              Object.values(value).forEach((x) => { if (x && typeof x === "object") rows(x, out); });
            }
            return out;
          };
          const migrations = rows(read("zeptomail-prod-after-migrations.json")).map((x) => x.name).filter(Boolean).sort();
          const expected = [
            "0000_auth_worker_internal_config.sql","0001_better_auth.sql","0002_seed_first_party_oauth_client.sql",
            "0003_zeptomail_agent_settings.sql","0004_better_auth_registration_attributes.sql",
            "0005_telegram_phone_verification.sql","0006_transactional_email_provider.sql",
            "0007_managed_social_login_providers.sql","0008_auth_runtime_settings.sql",
            "0009_multi_provider_email_routing.sql","0010_custom_http_email_provider.sql","0011_zeptomail_email_provider.sql",
          ].sort();
          if (JSON.stringify(migrations) !== JSON.stringify(expected)) throw new Error("Production D1 migrations must be exactly 0000–0011.");
          const schema = String(rows(read("zeptomail-prod-after-schema.json")).find((x) => typeof x.sql === "string")?.sql ?? "").toLowerCase();
          if (!schema.includes("'zeptomail'") || !schema.includes("'custom_http'")) {
            throw new Error("Production email provider constraint is missing ZeptoMail or the existing custom HTTP provider.");
          }
          const beforeCounts = rows(read("zeptomail-prod-before-counts.json")).find((x) => Object.hasOwn(x, "users"));
          const afterCounts = rows(read("zeptomail-prod-after-counts.json")).find((x) => Object.hasOwn(x, "users"));
          if (!beforeCounts || !afterCounts) throw new Error("Production counts could not be compared.");
          for (const key of ["users","accounts","sessions","email_accounts","legacy_email_accounts"]) {
            if (Number(beforeCounts[key]) !== Number(afterCounts[key])) throw new Error("Production data count changed: " + key);
          }
          const beforeIdentities = rows(read("zeptomail-prod-before-identity.json"))
            .filter((x) => typeof x.entity === "string" && typeof x.entity_id === "string")
            .sort((a, b) => (a.entity + ":" + a.entity_id).localeCompare(b.entity + ":" + b.entity_id));
          const afterIdentities = rows(read("zeptomail-prod-after-identity.json"))
            .filter((x) => typeof x.entity === "string" && typeof x.entity_id === "string")
            .sort((a, b) => (a.entity + ":" + a.entity_id).localeCompare(b.entity + ":" + b.entity_id));
          const beforeProviders = rows(read("zeptomail-prod-before-providers.json"))
            .filter((x) => typeof x.id === "string" && typeof x.provider === "string")
            .sort((a, b) => a.id.localeCompare(b.id));
          const afterProviders = rows(read("zeptomail-prod-after-providers.json"))
            .filter((x) => typeof x.id === "string" && typeof x.provider === "string")
            .sort((a, b) => a.id.localeCompare(b.id));
          const hash = (value) => createHash("sha256").update(JSON.stringify(value)).digest("hex");
          if (hash(beforeIdentities) !== hash(afterIdentities)) throw new Error("Better Auth users/accounts/sessions changed during ZeptoMail schema migration.");
          if (hash(beforeProviders) !== hash(afterProviders)) throw new Error("Existing provider accounts, encrypted credentials, priority, quotas or cooldowns changed.");
          const priorIdentityFingerprint = readFileSync(root + "/zeptomail-prod-identity-fingerprint.txt", "utf8");
          const priorProviderFingerprint = readFileSync(root + "/zeptomail-prod-provider-fingerprint.txt", "utf8");
          if (priorIdentityFingerprint !== hash(afterIdentities) || priorProviderFingerprint !== hash(afterProviders)) {
            throw new Error("Production before/after fingerprint check failed.");
          }
          console.log(JSON.stringify({
            pass: true, productionMigration: "0011 applied",
            zeptomailProviderAllowed: true, customHttpProviderPreserved: true,
            identitiesUnchanged: true, existingProviderCredentialsAndQuotasUnchanged: true,
            WorkerDeploymentAttempted: false, secretsOrDnsChanged: false,
          }));
          NODE

      - name: Remove temporary verification output
        if: always()
        run: rm -f "$RUNNER_TEMP"/zeptomail-prod-*
