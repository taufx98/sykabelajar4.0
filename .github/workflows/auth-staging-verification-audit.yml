name: Read-only Better Auth staging verification audit

on:
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - ".github/workflows/auth-staging-verification-audit.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: auth-staging-verification-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.ref == 'refs/heads/security/auth-poc-stage-1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: services/auth-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/auth-poc-stage-1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/auth-worker/package-lock.json
      - name: Install locked Wrangler
        run: npm ci --no-audit --no-fund
      - name: Verify exact staging D1 target
        run: |
          set -euo pipefail
          grep -q '^database_name = "sykabelajar-auth-poc"$' wrangler.toml
          grep -q '^database_id = "7a4f9008-a1c6-42b6-8a04-abde12699248"$' wrangler.toml
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Confirmed the audit target is the isolated staging D1 only."
      - name: Read-only aggregate audit of verification policy and identities
        run: |
          set -euo pipefail
          npx wrangler d1 execute sykabelajar-auth-poc --remote --json --command "SELECT email_verification_required, updated_at FROM auth_runtime_settings WHERE id=1;" > "$RUNNER_TEMP/policy.json"
          npx wrangler d1 execute sykabelajar-auth-poc --remote --json --command "SELECT COUNT(*) AS total_users, SUM(CASE WHEN emailVerified=1 THEN 1 ELSE 0 END) AS verified_users, SUM(CASE WHEN emailVerified=0 THEN 1 ELSE 0 END) AS unverified_users, (SELECT COUNT(*) FROM session s JOIN user u ON u.id=s.userId WHERE julianday(s.expiresAt)>julianday('now')) AS active_sessions, (SELECT COUNT(*) FROM session s JOIN user u ON u.id=s.userId WHERE u.emailVerified=0 AND julianday(s.expiresAt)>julianday('now')) AS active_unverified_sessions FROM user;" > "$RUNNER_TEMP/identity-counts.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const readRows = (path) => {
            const payload = JSON.parse(readFileSync(path, "utf8"));
            const rows = [];
            const visit = (value) => {
              if (Array.isArray(value)) return value.forEach(visit);
              if (!value || typeof value !== "object") return;
              if (Object.hasOwn(value, "results") && Array.isArray(value.results)) rows.push(...value.results);
              Object.values(value).forEach(visit);
            };
            visit(payload);
            return rows;
          };
          const policy = readRows(process.env.RUNNER_TEMP + "/policy.json")[0];
          const counts = readRows(process.env.RUNNER_TEMP + "/identity-counts.json")[0];
          if (!policy || !counts) throw new Error("Staging audit returned incomplete aggregate data.");
          const result = {
            database: "sykabelajar-auth-poc",
            emailVerificationRequired: Number(policy.email_verification_required) === 1,
            policyUpdatedAt: policy.updated_at ?? null,
            totalUsers: Number(counts.total_users ?? 0),
            verifiedUsers: Number(counts.verified_users ?? 0),
            unverifiedUsers: Number(counts.unverified_users ?? 0),
            activeSessions: Number(counts.active_sessions ?? 0),
            activeUnverifiedSessions: Number(counts.active_unverified_sessions ?? 0),
          };
          console.log("STAGING_VERIFICATION_AUDIT " + JSON.stringify(result));
          if (result.emailVerificationRequired && result.activeUnverifiedSessions !== 0) {
            throw new Error("Security invariant failed: unverified staging accounts have active sessions.");
          }
          NODE
      - name: Verify hosted policy agrees with staging D1
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const response = await fetch("https://auth.sykabelajar.my.id/api/auth/providers", {
            headers: { Origin: "https://staging.sykabelajar.my.id", Accept: "application/json" },
          });
          assert.equal(response.status, 200);
          const payload = await response.json();
          console.log("HOSTED_POLICY " + JSON.stringify({
            emailVerificationRequired: payload.emailVerificationRequired,
            emailVerificationConfigured: payload.emailVerificationConfigured,
            issuer: payload.issuer,
          }));
          assert.equal(payload.emailVerificationRequired, true, "Hosted Worker must require verification.");
          NODE
