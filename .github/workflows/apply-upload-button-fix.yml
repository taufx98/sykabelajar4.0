name: Apply organizer proof upload button fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(payment): render proof upload button explicitly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch organizer proof upload UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()

          old_container = '<div className="order-4 mt-5 overflow-hidden rounded-2xl border-2 border-accent/50 bg-accent/10 shadow-lg shadow-accent/5">'
          new_container = '<div className="order-4 mt-5 rounded-2xl border-2 border-accent/50 bg-accent/10 shadow-lg shadow-accent/5">'
          if old_container not in s:
              raise SystemExit('upload container marker not found')
          s = s.replace(old_container, new_container, 1)

          old = '<Button className="mt-4 w-full sm:w-auto" size="sm" onClick={() => proofInputRef.current?.click()} icon={<UploadCloud size={15}/>}>'
          new = '<button type="button" data-testid="payment-proof-upload-button" className="mt-4 inline-flex min-h-10 w-full items-center justify-center gap-2 rounded-xl bg-accent px-4 py-2.5 text-xs font-semibold text-white shadow-sm transition hover:opacity-90 sm:w-auto" onClick={() => proofInputRef.current?.click()}><UploadCloud size={15}/>'
          if old not in s:
              raise SystemExit('upload button marker not found')
          s = s.replace(old, new, 1)

          old_close = '</Button></div></div>{proofFile &&'
          new_close = '</button></div></div>{proofFile &&'
          if old_close not in s:
              raise SystemExit('upload button closing marker not found')
          s = s.replace(old_close, new_close, 1)

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/OrganizerPlanPageV2.tsx
          git rm -f .github/workflows/apply-upload-button-fix.yml
          git commit -m 'fix(payment): render proof upload button explicitly'
          git push
