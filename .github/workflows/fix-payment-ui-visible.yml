name: Fix payment UI visible
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply visible payment UI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()
          s, n = re.subn(r"  function openPayment\(row: OrganizerPlanCatalogRow\) \{.*?\n  \}", """  function openPayment(row: OrganizerPlanCatalogRow) {
            if (row.plan_code === 'FREE') { toast.info('Paket Gratis tidak memerlukan checkout.'); return; }
            const initial: Record<string, string> = {};
            paymentFields.forEach((field) => { initial[field.field_key] = ''; });
            const preferredMethod = paymentMethods.find((method) => !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(method.payment_type).toUpperCase())) ?? paymentMethods[0] ?? null;
            if (preferredMethod && String(preferredMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(preferredMethod.details?.random_code_enabled)) initial.__payment_random_code = String(Math.floor(Math.random() * 900) + 100);
            setPaymentPlan(row); setSelectedPaymentMethodId(preferredMethod?.id ?? ''); setContactFields(initial); setFieldErrors({}); setVoucherCode(''); setVoucherApplied(null); setVoucherMessage(''); setProofFile(null); if (proofPreviewUrl) URL.revokeObjectURL(proofPreviewUrl); setProofPreviewUrl(''); setSubmittedOrderId(null); setPaymentOpen(true);
          }""", s, count=1, flags=re.S)
          if n != 1: raise SystemExit('openPayment pattern not found')

          lines = s.splitlines()
          method_line = next((i for i, line in enumerate(lines) if '{paymentMethods.length > 0 && <div className="order-3 mt-5">' in line), None)
          if method_line is None: raise SystemExit('payment method render line not found')
          lines[method_line] = '''        {paymentMethods.length > 0 && <div className="order-3 mt-5"><p className="text-xs font-semibold text-fg-muted">Metode pembayaran</p><div className="mt-2 space-y-2">{paymentMethods.map((method) => { const type = String(method.payment_type).toUpperCase(); const manual = !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(type); const bankName = paymentBankName(method); const accountNumber = paymentAccountNumber(method); const accountName = paymentAccountName(method); return <button key={method.id} type="button" onClick={() => { setSelectedPaymentMethodId(method.id); if (type === 'BANK_TRANSFER' && Boolean(method.details?.random_code_enabled) && selectedTotal > 0 && !contactFields.__payment_random_code) setContactFields((current) => ({ ...current, __payment_random_code: String(Math.floor(Math.random() * 900) + 100) })); }} className={`w-full rounded-2xl border p-4 text-left transition ${selectedPaymentMethodId === method.id ? 'border-accent bg-accent/5' : 'border-surface-border bg-surface-elevated/25 hover:bg-surface-elevated/50'}`}><div className="flex items-start justify-between gap-3"><div className="min-w-0"><p className="text-sm font-bold text-fg">{paymentTypeLabel(type)}{bankName ? ` · ${bankName}` : ''}</p>{manual && bankName && <p className="mt-1 text-xs text-fg-muted">Transfer manual ke rekening {bankName}</p>}{accountNumber && <div className="mt-3 flex items-center gap-2"><p className="font-mono text-sm font-bold tracking-wide text-fg">{accountNumber}</p><button type="button" className="rounded-lg border border-surface-border p-1.5 text-fg-muted hover:text-fg" onClick={(event) => { event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success('Nomor rekening disalin.'); }} aria-label="Salin nomor rekening"><Copy size={14}/></button></div>}{accountName && <p className="mt-1 text-xs text-fg-muted">a.n. {accountName}</p>}</div>{selectedPaymentMethodId === method.id && <CheckCircle2 size={17} className="shrink-0 text-accent"/>}</div>{manual && selectedPaymentMethodId === method.id && <p className="mt-3 text-[11px] font-medium text-fg-muted">Setelah transfer, unggah bukti pembayaran di bawah.</p>}</button>; })}</div></div>}'''

          upload_line = next((i for i, line in enumerate(lines) if '{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5' in line), None)
          if upload_line is None: raise SystemExit('upload render line not found')
          lines[upload_line] = '''        {selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5 overflow-hidden rounded-2xl border-2 border-accent/50 bg-accent/10 shadow-lg shadow-accent/5"><div className="p-5"><div className="flex items-start gap-4"><div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-accent/15"><UploadCloud size={22} className="text-accent"/></div><div className="min-w-0 flex-1"><p className="text-base font-bold text-fg">Upload Bukti Transfer</p><p className="mt-1 text-xs leading-5 text-fg-muted">Wajib untuk pembayaran manual. Unggah foto atau screenshot bukti transfer setelah membayar.</p><p className="mt-1 text-[10px] font-medium text-fg-muted">PNG / JPG / WebP · maksimal 5 MB</p><input ref={proofInputRef} className="hidden" type="file" accept="image/png,image/jpeg,image/webp" onChange={(e) => chooseProof(e.target.files?.[0])}/><Button className="mt-4 w-full sm:w-auto" size="sm" onClick={() => proofInputRef.current?.click()} icon={<UploadCloud size={15}/>}>{proofFile ? 'Ganti Bukti Transfer' : 'Pilih Bukti Transfer'}</Button></div></div></div>{proofFile && <div className="mx-5 mb-5 flex items-center gap-3 rounded-xl border border-surface-border bg-surface-elevated/35 p-3"><div className="min-w-0 flex-1"><p className="truncate text-xs font-semibold text-fg">{proofFile.name}</p><p className="mt-1 text-[10px] text-fg-muted">{(proofFile.size / 1024 / 1024).toFixed(2)} MB</p></div><button type="button" onClick={removeProof} className="rounded-lg p-2 text-red-400 hover:bg-red-500/10" aria-label="Hapus bukti transfer"><X size={15}/></button></div>}{proofPreviewUrl && <div className="relative mx-5 mb-5 overflow-hidden rounded-2xl border border-surface-border bg-black/20"><img src={proofPreviewUrl} alt="Preview bukti transfer" className="max-h-64 w-full object-contain"/></div>}</div>}'''

          text = '\n'.join(lines) + '\n'
          text = text.replace("{money(selectedTotal, paymentPlan?.currency || 'IDR')}", "{money(paymentTransferTotal, paymentPlan?.currency || 'IDR')}", 1)
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OrganizerPlanPageV2.tsx
          git commit -m "fix(payment): restore visible transfer proof upload"
          git rm .github/workflows/fix-payment-ui-visible.yml
          git commit -m "chore(ci): remove temporary payment UI fixer"
          git push
