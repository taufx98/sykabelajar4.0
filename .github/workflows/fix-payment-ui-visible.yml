name: Fix payment UI visible
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply visible payment UI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()

          old_open = """  function openPayment(row: OrganizerPlanCatalogRow) {
            if (row.plan_code === 'FREE') { toast.info('Paket Gratis tidak memerlukan checkout.'); return; }
            const initial: Record<string, string> = {}; paymentFields.forEach((field) => { initial[field.field_key] = ''; }); const firstMethod = paymentMethods[0] ?? null; if (firstMethod && String(firstMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(firstMethod.details?.random_code_enabled)) initial.__payment_random_code = String(Math.floor(Math.random() * 900) + 100);
            setPaymentPlan(row); setSelectedPaymentMethodId(paymentMethods[0]?.id ?? ''); setContactFields(initial); setFieldErrors({}); setVoucherCode(''); setVoucherApplied(null); setVoucherMessage(''); setProofFile(null); if (proofPreviewUrl) URL.revokeObjectURL(proofPreviewUrl); setProofPreviewUrl(''); setSubmittedOrderId(null); setPaymentOpen(true);
          }"""
          new_open = """  function openPayment(row: OrganizerPlanCatalogRow) {
            if (row.plan_code === 'FREE') { toast.info('Paket Gratis tidak memerlukan checkout.'); return; }
            const initial: Record<string, string> = {};
            paymentFields.forEach((field) => { initial[field.field_key] = ''; });
            const preferredMethod = paymentMethods.find((method) => !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(method.payment_type).toUpperCase())) ?? paymentMethods[0] ?? null;
            if (preferredMethod && String(preferredMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(preferredMethod.details?.random_code_enabled)) initial.__payment_random_code = String(Math.floor(Math.random() * 900) + 100);
            setPaymentPlan(row); setSelectedPaymentMethodId(preferredMethod?.id ?? ''); setContactFields(initial); setFieldErrors({}); setVoucherCode(''); setVoucherApplied(null); setVoucherMessage(''); setProofFile(null); if (proofPreviewUrl) URL.revokeObjectURL(proofPreviewUrl); setProofPreviewUrl(''); setSubmittedOrderId(null); setPaymentOpen(true);
          }"""
          if old_open not in s:
              raise SystemExit('openPayment block not found')
          s = s.replace(old_open, new_open, 1)

          old_methods = """        {paymentMethods.length > 0 && <div className=\"order-3 mt-5\"><p className=\"text-xs font-semibold text-fg-muted\">Metode pembayaran</p><div className=\"mt-2 space-y-2\">{paymentMethods.map((method) => <button key={method.id} type=\"button\" onClick={() => setSelectedPaymentMethodId(method.id)} className={`w-full rounded-2xl border p-4 text-left transition ${selectedPaymentMethodId === method.id ? 'border-accent bg-accent/5' : 'border-surface-border bg-surface-elevated/25 hover:bg-surface-elevated/50'}`}><div className=\"flex items-start justify-between gap-3\"><div><p className=\"text-sm font-bold text-fg\">{method.name}</p><p className=\"mt-0.5 text-[10px] uppercase tracking-wider text-fg-muted\">{method.payment_type}</p></div>{selectedPaymentMethodId === method.id && <CheckCircle2 size={17} className=\"text-accent\"/>}</div>{paymentDetailText(method) && <p className=\"mt-3 whitespace-pre-wrap text-xs leading-5 text-fg-muted\">{paymentDetailText(method)}</p>}</button>)}</div></div>}"""
          new_methods = """        {paymentMethods.length > 0 && <div className=\"order-3 mt-5\"><p className=\"text-xs font-semibold text-fg-muted\">Metode pembayaran</p><div className=\"mt-2 space-y-2\">{paymentMethods.map((method) => { const type = String(method.payment_type).toUpperCase(); const manual = !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(type); const bankName = paymentBankName(method); const accountNumber = paymentAccountNumber(method); const accountName = paymentAccountName(method); return <button key={method.id} type=\"button\" onClick={() => { setSelectedPaymentMethodId(method.id); if (type === 'BANK_TRANSFER' && Boolean(method.details?.random_code_enabled) && selectedTotal > 0 && !contactFields.__payment_random_code) setContactFields((current) => ({ ...current, __payment_random_code: String(Math.floor(Math.random() * 900) + 100) })); }} className={`w-full rounded-2xl border p-4 text-left transition ${selectedPaymentMethodId === method.id ? 'border-accent bg-accent/5' : 'border-surface-border bg-surface-elevated/25 hover:bg-surface-elevated/50'}`}><div className=\"flex items-start justify-between gap-3\"><div className=\"min-w-0\"><p className=\"text-sm font-bold text-fg\">{paymentTypeLabel(type)}{bankName ? ` · ${bankName}` : ''}</p>{manual && bankName && <p className=\"mt-1 text-xs text-fg-muted\">Transfer manual ke rekening {bankName}</p>}{accountNumber && <div className=\"mt-3 flex items-center gap-2\"><p className=\"font-mono text-sm font-bold tracking-wide text-fg\">{accountNumber}</p><button type=\"button\" className=\"rounded-lg border border-surface-border p-1.5 text-fg-muted hover:text-fg\" onClick={(event) => { event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success('Nomor rekening disalin.'); }} aria-label=\"Salin nomor rekening\"><Copy size={14}/></button></div>}{accountName && <p className=\"mt-1 text-xs text-fg-muted\">a.n. {accountName}</p>}</div>{selectedPaymentMethodId === method.id && <CheckCircle2 size={17} className=\"shrink-0 text-accent\"/>}</div>{manual && selectedPaymentMethodId === method.id && <p className=\"mt-3 text-[11px] font-medium text-fg-muted\">Setelah transfer, unggah bukti pembayaran di bawah.</p>}</button>; })}</div></div>}"""
          if old_methods not in s:
              raise SystemExit('payment method render block not found')
          s = s.replace(old_methods, new_methods, 1)

          old_upload = """        {selectedMethodNeedsProof && selectedTotal > 0 && <div className=\"order-4 mt-5 overflow-hidden rounded-2xl border border-accent/30 bg-accent/5\"><div className=\"flex flex-col gap-4 p-5 sm:flex-row sm:items-center\"><div className=\"flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-accent/10\"><UploadCloud size={20} className=\"text-accent\"/></div><div className=\"min-w-0 flex-1\"><p className=\"text-base font-bold text-fg\">Upload Bukti Transfer</p><p className=\"mt-1 text-xs leading-5 text-fg-muted\">Setelah melakukan transfer sesuai metode di atas, unggah foto atau screenshot bukti transfer.</p><p className=\"mt-1 text-[10px] text-fg-muted\">PNG / JPG / WebP · maksimal 5 MB</p><input ref={proofInputRef} className=\"hidden\" type=\"file\" accept=\"image/png,image/jpeg,image/webp\" onChange={(e) => chooseProof(e.target.files?.[0])}/><Button className=\"mt-3\" size=\"sm\" onClick={() => proofInputRef.current?.click()} icon={<UploadCloud size={14}/>}><..."""
          # Strengthen only by targeting the existing wrapper class; the complete JSX stays intact.
          s = s.replace('className="order-4 mt-5 overflow-hidden rounded-2xl border border-accent/30 bg-accent/5"', 'className="order-4 mt-5 overflow-hidden rounded-2xl border-2 border-accent/50 bg-accent/10 shadow-lg shadow-accent/5"', 1)

          # Make the displayed amount use the actual transfer total when random code is enabled.
          s = s.replace('{money(selectedTotal, paymentPlan?.currency || \'IDR\')}', '{money(paymentTransferTotal, paymentPlan?.currency || \'IDR\')}', 1)

          p.write_text(s)
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OrganizerPlanPageV2.tsx
          git commit -m "fix(payment): make manual proof upload visible"
          git rm .github/workflows/fix-payment-ui-visible.yml
          git commit -m "chore(ci): remove temporary payment UI fixer"
          git push
