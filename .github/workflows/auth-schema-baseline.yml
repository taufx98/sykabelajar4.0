name: Auth Production Schema Baseline
# Triggered by a workflow-file push; production reads remain schema-only and isolated.

on:
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - "scripts/auth-migration/export-schema-baseline.sh"
      - "scripts/auth-migration/export-schema-baseline.contract.test.mjs"
      - "scripts/auth-migration/verify-restored-auth-fk-catalog.mjs"
      - "scripts/auth-migration/verify-restored-auth-fk-catalog.test.mjs"
      - "scripts/auth-migration/stage3-baseline-metadata.sql"
      - "scripts/auth-migration/verify-stage3-baseline-metadata.mjs"
      - "scripts/auth-migration/verify-stage3-baseline-metadata.test.mjs"
      - "scripts/auth-migration/stage3-production-schema-regression.sql"
      - ".github/workflows/auth-schema-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-schema-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schema-only-restore:
    name: Read-only production export and isolated restore
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_PROJECT_REF: mvdczyitbkxkldjughor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set isolated workspace paths
        run: |
          echo "SUPABASE_CLI_WORKDIR=$RUNNER_TEMP/sykabelajar-auth-baseline" >> "$GITHUB_ENV"
          echo "SCHEMA_BASELINE_OUTPUT_DIR=$RUNNER_TEMP/sykabelajar-auth-schema-export" >> "$GITHUB_ENV"

      - name: Check whether the one-time database secret is configured
        id: credentials
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Schema baseline was not run. Add the Supabase session-pooler URI as the repository Actions secret SUPABASE_DB_URL. Do not put it in chat, source code, or workflow logs."
            {
              echo "## Production schema baseline"
              echo ""
              echo "Skipped safely: repository secret \`SUPABASE_DB_URL\` is not configured."
              echo ""
              echo "The only owner action required is to add the production **session pooler** URI (port 5432, username \`postgres.mvdczyitbkxkldjughor\`) in Settings → Secrets and variables → Actions. No CLI command is needed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const ref = process.env.SUPABASE_PROJECT_REF;
          let supplied = (process.env.SUPABASE_DB_URL ?? "").trim();

          // Normalize common copy formats without displaying the secret.
          if (supplied.startsWith("export ")) supplied = supplied.slice(7).trim();
          for (const prefix of ["SUPABASE_DB_URL=", "DATABASE_URL=", "DB_URL="]) {
            if (supplied.startsWith(prefix)) {
              supplied = supplied.slice(prefix.length).trim();
              break;
            }
          }
          if (supplied.startsWith("psql ")) supplied = supplied.slice(5).trim();
          if ((supplied.startsWith("'") && supplied.endsWith("'")) ||
              (supplied.startsWith('"') && supplied.endsWith('"'))) {
            supplied = supplied.slice(1, -1);
          }

          if (!supplied.toLowerCase().startsWith("postgresql://") &&
              !supplied.toLowerCase().startsWith("postgres://")) {
            throw new Error("SUPABASE_DB_URL is not a raw PostgreSQL URI. Store only the connection URI starting with postgresql:// (or postgres://), not the database password alone, an export command, or a surrounding terminal command.");
          }
          const lf = String.fromCharCode(10);
          const cr = String.fromCharCode(13);
          // Dashboard copy/paste can wrap a connection URI with CR/LF.
          // These are not valid URI characters, so join the wrapped lines
          // before parsing; never print or persist the raw secret.
          supplied = supplied.replaceAll(cr, "").replaceAll(lf, "");
          if (supplied.includes("\\t")) {
            throw new Error("SUPABASE_DB_URL contains an unexpected tab character. Save the URI as one continuous line.");
          }

          const url = new URL(supplied);
          const username = decodeURIComponent(url.username);
          const endpointMismatches = [];
          if (!url.hostname.endsWith(".pooler.supabase.com")) endpointMismatches.push("HOST");
          if (username !== "postgres." + ref) endpointMismatches.push("USERNAME");
          if (url.port !== "5432") endpointMismatches.push("PORT");
          if (endpointMismatches.length) {
            throw new Error("Supabase Session Pooler connection details do not match: " + endpointMismatches.join(", ") + ". Correct only the listed fields using the exact URI from Supabase Connect → Session pooler; the secret value is never printed.");
          }
          const decodedPassword = decodeURIComponent(url.password);
          if (!decodedPassword || !url.pathname || url.pathname === "/" ||
              decodedPassword === "[YOUR-PASSWORD]" || decodedPassword === "[DB-PASSWORD]") {
            throw new Error("SUPABASE_DB_URL is incomplete. Replace the password placeholder with the database password before saving the secret.");
          }

          // Normalize the accepted form for following steps without printing it.
          const safeEnvValue = supplied.replaceAll("%", "%25").replaceAll(cr, "%0D").replaceAll(lf, "%0A");
          appendFileSync(process.env.GITHUB_ENV, "SUPABASE_DB_URL=" + safeEnvValue + lf);
          console.log("Secret format verified without printing its value.");
          NODE
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Supabase CLI
        if: steps.credentials.outputs.available == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Test exact restored FK catalog verifier contract
        if: steps.credentials.outputs.available == 'true'
        run: node scripts/auth-migration/verify-restored-auth-fk-catalog.test.mjs

      - name: Test Stage 3 function, trigger, RLS and profile metadata parity contract
        if: steps.credentials.outputs.available == 'true'
        run: node scripts/auth-migration/verify-stage3-baseline-metadata.test.mjs

      - name: Prepare an empty disposable Supabase project
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          rm -rf "$SUPABASE_CLI_WORKDIR" "$SCHEMA_BASELINE_OUTPUT_DIR"
          mkdir -p "$SUPABASE_CLI_WORKDIR/supabase/migrations"
          cat > "$SUPABASE_CLI_WORKDIR/supabase/config.toml" <<'TOML'
          project_id = "sykabelajar-auth-baseline"
          TOML
          test -d "$SUPABASE_CLI_WORKDIR/supabase/migrations"
          test ! -e "$SUPABASE_CLI_WORKDIR/supabase/seed.sql"

      - name: Start isolated local Supabase stack
        if: steps.credentials.outputs.available == 'true'
        id: local_supabase
        run: |
          set -euo pipefail
          cd "$SUPABASE_CLI_WORKDIR"
          supabase start

      - name: Provide a PostgreSQL 17.6 client without installing packages on the runner
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pg17-bin"
          cat > "$RUNNER_TEMP/pg17-bin/psql" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          : "${PGPASSFILE:?The exporter must provide a private PGPASSFILE.}"
          docker run --rm --network host \
            -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGSSLMODE \
            -e PGPASSFILE=/run/secrets/pgpass \
            -v "$PGPASSFILE:/run/secrets/pgpass:ro" \
            postgres:17.6-alpine psql "$@"
          SH
          chmod 700 "$RUNNER_TEMP/pg17-bin/psql"
          echo "$RUNNER_TEMP/pg17-bin" >> "$GITHUB_PATH"

      - name: Export production schema only
        if: steps.credentials.outputs.available == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          set +x
          bash scripts/auth-migration/export-schema-baseline.sh
          test -s "$SCHEMA_BASELINE_OUTPUT_DIR/schema.sql"
          test -s "$SCHEMA_BASELINE_OUTPUT_DIR/auth-storage-custom.sql"
          test -s "$SCHEMA_BASELINE_OUTPUT_DIR/production-catalog-metadata.json"

      - name: Restore schema into the disposable local Supabase database
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$SCHEMA_BASELINE_OUTPUT_DIR:/baseline:ro" \
            postgres:17.6-alpine \
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -X -q --set=ON_ERROR_STOP=1 --file=/baseline/schema.sql

          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$SCHEMA_BASELINE_OUTPUT_DIR:/baseline:ro" \
            postgres:17.6-alpine \
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -X -q --set=ON_ERROR_STOP=1 --file=/baseline/auth-storage-custom.sql

      - name: Verify the restored production schema shape and zero imported user rows
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          SELECT
            (SELECT count(*)
             FROM pg_constraint c
             JOIN pg_class src ON src.oid = c.conrelid
             JOIN pg_namespace src_ns ON src_ns.oid = src.relnamespace
             JOIN pg_class dst ON dst.oid = c.confrelid
             JOIN pg_namespace dst_ns ON dst_ns.oid = dst.relnamespace
             WHERE c.contype = 'f'
               AND src_ns.nspname IN ('public', 'private')
               AND dst_ns.nspname = 'auth'
               AND dst.relname = 'users'),
            (SELECT count(DISTINCT src_ns.nspname || '.' || src.relname)
             FROM pg_constraint c
             JOIN pg_class src ON src.oid = c.conrelid
             JOIN pg_namespace src_ns ON src_ns.oid = src.relnamespace
             JOIN pg_class dst ON dst.oid = c.confrelid
             JOIN pg_namespace dst_ns ON dst_ns.oid = dst.relnamespace
             WHERE c.contype = 'f'
               AND src_ns.nspname IN ('public', 'private')
               AND dst_ns.nspname = 'auth'
               AND dst.relname = 'users'),
            (SELECT count(*)
             FROM pg_trigger t
             JOIN pg_class tbl ON tbl.oid = t.tgrelid
             JOIN pg_namespace ns ON ns.oid = tbl.relnamespace
             WHERE ns.nspname = 'auth' AND tbl.relname = 'users' AND NOT t.tgisinternal),
            (SELECT count(*)
             FROM pg_trigger t
             JOIN pg_class tbl ON tbl.oid = t.tgrelid
             JOIN pg_namespace ns ON ns.oid = tbl.relnamespace
             WHERE ns.nspname = 'public' AND tbl.relname = 'profiles' AND NOT t.tgisinternal),
            (SELECT count(*)
             FROM information_schema.columns
             WHERE table_schema = 'public' AND table_name = 'profiles'),
            (SELECT count(*)
             FROM pg_policies
             WHERE coalesce(qual, '') || coalesce(with_check, '') ILIKE '%auth.uid%'),
            (SELECT count(*)
             FROM pg_proc p
             JOIN pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname IN ('public', 'private')
               AND p.proname IN (
                 'apply_referral_qualification',
                 'capture_signup_referral',
                 'process_referral_email_confirmation',
                 'create_organizer',
                 'get_my_referrals',
                 'get_my_referrals_v2',
                 'get_my_verified_referrals',
                 'handle_new_auth_user',
                 'register_for_competition',
                 'verify_pending_referrals'
               )),
            (SELECT count(*) FROM auth.users),
            (SELECT count(*) FROM public.profiles);
          SQL
          )

          actual="$(docker run --rm --network host -e PGPASSWORD=postgres postgres:17.6-alpine \
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -X -qAt --field-separator='|' --set=ON_ERROR_STOP=1 --command "$SQL")"
          expected="69|62|3|4|36|109|10|0|0"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Disposable schema restore did not match the reviewed production baseline."
            echo "Expected structural metrics: $expected"
            echo "Observed structural metrics: $actual"
            exit 1
          fi

          {
            echo "## Production schema baseline — passed"
            echo ""
            echo "- 69 application foreign keys to \`auth.users\` across 62 tables"
            echo "- 3 non-internal \`auth.users\` triggers"
            echo "- 4 \`profiles\` triggers and 36 profile columns"
            echo "- 109 RLS policies referencing \`auth.uid()\`"
            echo "- All 10 Auth-dependent application functions present"
            echo "- 0 \`auth.users\` rows and 0 \`profiles\` rows imported"
            echo "- Schema restored only into a disposable local Supabase stack"
            echo "- No production DDL/DML, no artifact upload, and no schema files committed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare every restored auth.users FK with the reviewed production catalog
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          FK_SQL=$(cat <<'SQL'
          SELECT COALESCE(
            jsonb_agg(
              jsonb_build_object(
                'name', c.conname,
                'on_delete', CASE c.confdeltype
                  WHEN 'a' THEN 'NO ACTION' WHEN 'r' THEN 'RESTRICT' WHEN 'c' THEN 'CASCADE'
                  WHEN 'n' THEN 'SET NULL' WHEN 'd' THEN 'SET DEFAULT' END,
                'on_update', CASE c.confupdtype
                  WHEN 'a' THEN 'NO ACTION' WHEN 'r' THEN 'RESTRICT' WHEN 'c' THEN 'CASCADE'
                  WHEN 'n' THEN 'SET NULL' WHEN 'd' THEN 'SET DEFAULT' END,
                'validated', c.convalidated,
                'deferrable', c.condeferrable,
                'match_type', CASE c.confmatchtype
                  WHEN 's' THEN 'SIMPLE' WHEN 'f' THEN 'FULL' WHEN 'p' THEN 'PARTIAL' END,
                'source_table', source_table.relname,
                'target_table', target_table.relname,
                'source_schema', source_ns.nspname,
                'target_schema', target_ns.nspname,
                'source_columns', (
                  SELECT COALESCE(jsonb_agg(source_att.attname ORDER BY source_key.ordinality), '[]'::jsonb)
                  FROM unnest(c.conkey) WITH ORDINALITY AS source_key(attnum, ordinality)
                  JOIN pg_attribute source_att
                    ON source_att.attrelid = source_table.oid
                   AND source_att.attnum = source_key.attnum
                ),
                'target_columns', (
                  SELECT COALESCE(jsonb_agg(target_att.attname ORDER BY target_key.ordinality), '[]'::jsonb)
                  FROM unnest(c.confkey) WITH ORDINALITY AS target_key(attnum, ordinality)
                  JOIN pg_attribute target_att
                    ON target_att.attrelid = target_table.oid
                   AND target_att.attnum = target_key.attnum
                ),
                'initially_deferred', c.condeferred
              ) ORDER BY source_ns.nspname, source_table.relname, c.conname
            ), '[]'::jsonb
          )::text
          FROM pg_constraint c
          JOIN pg_class source_table ON source_table.oid = c.conrelid
          JOIN pg_namespace source_ns ON source_ns.oid = source_table.relnamespace
          JOIN pg_class target_table ON target_table.oid = c.confrelid
          JOIN pg_namespace target_ns ON target_ns.oid = target_table.relnamespace
          WHERE c.contype = 'f'
            AND source_ns.nspname IN ('public', 'private')
            AND target_ns.nspname = 'auth'
            AND target_table.relname = 'users';
          SQL
          )

          docker run --rm --network host -e PGPASSWORD=postgres postgres:17.6-alpine \
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -X -qAt --set=ON_ERROR_STOP=1 --command "$FK_SQL" \
              > "$RUNNER_TEMP/restored-auth-users-fks.json"

          node scripts/auth-migration/verify-restored-auth-fk-catalog.mjs \
            --actual "$RUNNER_TEMP/restored-auth-users-fks.json" \
            --expected scripts/auth-migration/live-auth-users-fk-catalog.json

      - name: Compare restored functions, triggers, RLS policies and profile columns
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$GITHUB_WORKSPACE/scripts/auth-migration/stage3-baseline-metadata.sql:/baseline/stage3-baseline-metadata.sql:ro" \
            postgres:17.6-alpine \
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -X -qAt --set=ON_ERROR_STOP=1 \
              --file=/baseline/stage3-baseline-metadata.sql \
              > "$RUNNER_TEMP/restored-stage3-baseline-metadata.json"

          node scripts/auth-migration/verify-stage3-baseline-metadata.mjs \
            --production "$SCHEMA_BASELINE_OUTPUT_DIR/production-catalog-metadata.json" \
            --restored "$RUNNER_TEMP/restored-stage3-baseline-metadata.json"

      - name: Run rollback-only production-shaped Stage 3 behavior and RLS regression
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$GITHUB_WORKSPACE/scripts/auth-migration/stage3-production-schema-regression.sql:/baseline/stage3-production-schema-regression.sql:ro" \
            postgres:17.6-alpine \
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -X -q --set=ON_ERROR_STOP=1 \
              --file=/baseline/stage3-production-schema-regression.sql
          {
            echo ""
            echo "- Production-shaped Auth/referral/organizer/competition and representative RLS behavior fixtures passed"
            echo "- Every synthetic row and mutation was rolled back"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop disposable local Supabase
        if: always() && steps.local_supabase.outcome == 'success'
        run: |
          cd "$SUPABASE_CLI_WORKDIR"
          supabase stop || true

      - name: Remove schema export and temporary local project
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/restored-auth-users-fks.json" "$RUNNER_TEMP/restored-stage3-baseline-metadata.json"
          rm -rf "$SCHEMA_BASELINE_OUTPUT_DIR" "$SUPABASE_CLI_WORKDIR"
