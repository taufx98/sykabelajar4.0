name: Repair payment flow
on: push
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply payment UI repair
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          if [[ "$COMMIT_MESSAGE" == "feat(payment): refine payment method flow"* || "$COMMIT_MESSAGE" == "chore: remove payment UI repair workflow"* ]]; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------- Admin payment setup ----------
          p = Path('src/pages/AdminPlanUsagePageV2.tsx')
          s = p.read_text()
          s = s.replace("type NewPaymentMethod = { name: string; paymentType: string; bankName: string; accountNumber: string; accountName: string; instructions: string };", "type NewPaymentMethod = { name: string; paymentType: string; bankName: string; accountNumber: string; accountName: string; instructions: string; randomCodeEnabled: boolean };")
          s = s.replace("const emptyMethod: NewPaymentMethod = { name: '', paymentType: 'BANK_TRANSFER', bankName: '', accountNumber: '', accountName: '', instructions: '' };", "const emptyMethod: NewPaymentMethod = { name: '', paymentType: 'BANK_TRANSFER', bankName: '', accountNumber: '', accountName: '', instructions: '', randomCodeEnabled: false };")
          marker = "function methodMeta(method: OrganizerPaymentMethod) { return { bankName: String(method.details?.bank_name ?? ''), accountNumber: String(method.details?.account_number ?? ''), accountName: String(method.details?.account_name ?? ''), instructions: String(method.details?.instructions ?? method.details?.text ?? '') }; }"
          helper = "function methodMeta(method: OrganizerPaymentMethod) { return { bankName: String(method.details?.bank_name ?? ''), accountNumber: String(method.details?.account_number ?? ''), accountName: String(method.details?.account_name ?? ''), randomCodeEnabled: Boolean(method.details?.random_code_enabled) }; }\nfunction paymentTypeLabel(value: string) { const type=value.toUpperCase(); if(type==='BANK_TRANSFER') return 'Transfer Bank'; if(type==='QRIS') return 'QRIS'; if(type==='VIRTUAL_ACCOUNT') return 'Virtual Account'; if(type==='EWALLET') return 'E-Wallet'; if(type==='MIDTRANS') return 'Pembayaran Otomatis'; if(type==='SNAP') return 'Payment Gateway'; return 'Metode Pembayaran'; }"
          if marker not in s: raise SystemExit('admin helper marker missing')
          s = s.replace(marker, helper, 1)
          start = s.find("  const addMethod = async () =>")
          end = s.find("  const deleteMethod = async", start)
          if start < 0 or end < 0: raise SystemExit('admin addMethod block missing')
          new_add = "  const addMethod = async () => { const type = newMethod.paymentType.trim().toUpperCase(); if (type === 'BANK_TRANSFER' && !newMethod.bankName.trim()) { toast('Nama bank wajib diisi.', 'error'); return; } if (type === 'BANK_TRANSFER' && !newMethod.accountNumber.trim()) { toast('Nomor rekening wajib diisi.', 'error'); return; } if (type === 'BANK_TRANSFER' && !newMethod.accountName.trim()) { toast('Atas nama rekening wajib diisi.', 'error'); return; } setBusy(true); try { const details = { bank_name: newMethod.bankName.trim() || null, account_number: newMethod.accountNumber.trim() || null, account_name: newMethod.accountName.trim() || null, random_code_enabled: type === 'BANK_TRANSFER' && newMethod.randomCodeEnabled }; const created = await adminCreateOrganizerPaymentMethod({ name: type === 'BANK_TRANSFER' ? 'Transfer Bank' : paymentTypeLabel(type), paymentType: type, details, sortOrder: paymentMethods.length + 1 }); setPaymentMethods((current) => [...current, created]); setNewMethod(emptyMethod); setShowMethodForm(false); toast('Metode pembayaran ditambahkan.', 'success'); } catch (e: any) { toast(e?.message || 'Gagal menambah metode pembayaran.', 'error'); } finally { setBusy(false); } };\n"
          s = s[:start] + new_add + s[end:]
          form_pattern = re.compile(r'<div className="mt-5 space-y-4">.*?</div><div className="space-y-3">', re.S)
          form_match = form_pattern.search(s)
          if form_match:
              replacement = '''<div className="mt-5 space-y-4"><label className="block text-xs font-medium text-fg-muted">Jenis pembayaran<select className="input mt-1 w-full" value={newMethod.paymentType} onChange={(e) => setNewMethod((v) => ({ ...v, paymentType: e.target.value }))}><option value="BANK_TRANSFER">Transfer Bank</option><option value="QRIS">QRIS</option><option value="VIRTUAL_ACCOUNT">Virtual Account</option><option value="EWALLET">E-Wallet</option><option value="MIDTRANS">Pembayaran Otomatis</option><option value="SNAP">Payment Gateway</option><option value="OTHER">Lainnya</option></select></label><label className="block text-xs font-medium text-fg-muted">Nama bank<input className="input mt-1 w-full" value={newMethod.bankName} onChange={(e) => setNewMethod((v) => ({ ...v, bankName: e.target.value }))} placeholder="BCA"/></label><label className="block text-xs font-medium text-fg-muted">Nomor rekening<input className="input mt-1 w-full" value={newMethod.accountNumber} onChange={(e) => setNewMethod((v) => ({ ...v, accountNumber: e.target.value }))} inputMode="numeric" placeholder="1234 1234 1234"/></label><label className="block text-xs font-medium text-fg-muted">Atas nama rekening<input className="input mt-1 w-full" value={newMethod.accountName} onChange={(e) => setNewMethod((v) => ({ ...v, accountName: e.target.value }))} placeholder="Nama pemilik rekening"/></label>{newMethod.paymentType === 'BANK_TRANSFER' && <label className="flex items-start gap-3 rounded-xl border border-accent/20 bg-accent/5 p-3 text-sm text-fg"><input type="checkbox" className="mt-0.5" checked={newMethod.randomCodeEnabled} onChange={(e) => setNewMethod((v) => ({ ...v, randomCodeEnabled: e.target.checked }))}/><span><strong className="block">Random 3 digit</strong><span className="text-xs text-fg-muted">Tambahkan kode unik 3 digit pada nominal transfer setiap checkout.</span></span></label>}<Button fullWidth disabled={busy} onClick={() => void addMethod()} icon={<Plus size={15}/>}>Simpan Metode Pembayaran</Button></div><div className="space-y-3">'''
              s = s[:form_match.start()] + replacement + s[form_match.end():]
          s = s.replace("<span className=\"rounded-full bg-surface-elevated px-2.5 py-1 text-[9px] font-bold uppercase tracking-wider text-fg-muted\">{method.payment_type}</span>", "<span className=\"rounded-full bg-surface-elevated px-2.5 py-1 text-[9px] font-bold tracking-wider text-fg-muted\">{paymentTypeLabel(method.payment_type)}</span>")
          s = s.replace("{meta.accountName && <p className=\"mt-1 text-xs text-fg-muted\">a.n. {meta.accountName}</p>}{paymentDetail(method) && <p className=\"mt-3 whitespace-pre-wrap rounded-xl border border-surface-border bg-surface-elevated/30 p-3 text-xs leading-5 text-fg-muted\">{paymentDetail(method)}</p>}", "{meta.accountName && <p className=\"mt-1 text-xs text-fg-muted\">a.n. {meta.accountName}</p>}{meta.randomCodeEnabled && <p className=\"mt-3 text-xs font-semibold text-accent\">Kode unik 3 digit: aktif</p>}")
          p.write_text(s)

          # ---------- User checkout payment presentation ----------
          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()
          s = s.replace("import { ArrowLeft, ArrowRight, Check, CheckCircle2, CreditCard, Eye, Gauge, MessageCircle, RefreshCw, ShieldCheck, Sparkles, Tag, UploadCloud, X } from 'lucide-react';", "import { ArrowLeft, ArrowRight, Check, CheckCircle2, Copy, CreditCard, Eye, Gauge, MessageCircle, RefreshCw, ShieldCheck, Sparkles, Tag, UploadCloud, X } from 'lucide-react';")
          marker = "function paymentDetailText(method: OrganizerPaymentMethod) { return typeof method.details?.text === 'string' ? method.details.text : Object.entries(method.details ?? {}).map(([key, value]) => `${key}: ${String(value)}`).join('\\n'); }"
          helper = "function paymentTypeLabel(value: string) { const type=value.toUpperCase(); if(type==='BANK_TRANSFER') return 'Transfer Bank'; if(type==='QRIS') return 'QRIS'; if(type==='VIRTUAL_ACCOUNT') return 'Virtual Account'; if(type==='EWALLET') return 'E-Wallet'; if(type==='MIDTRANS') return 'Pembayaran Otomatis'; if(type==='SNAP') return 'Payment Gateway'; return 'Metode Pembayaran'; }\nfunction paymentAccountNumber(method: OrganizerPaymentMethod | null) { return String(method?.details?.account_number ?? '').trim(); }\nfunction paymentBankName(method: OrganizerPaymentMethod | null) { return String(method?.details?.bank_name ?? '').trim(); }\nfunction paymentAccountName(method: OrganizerPaymentMethod | null) { return String(method?.details?.account_name ?? '').trim(); }\nfunction paymentDetailText(method: OrganizerPaymentMethod) { return ''; }"
          if marker not in s: raise SystemExit('user helper marker missing')
          s = s.replace(marker, helper, 1)
          marker2 = "  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP'].includes(String(selectedMethod.payment_type).toUpperCase());"
          replacement2 = marker2 + "\n  const selectedRandomEnabled = !!selectedMethod && String(selectedMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(selectedMethod.details?.random_code_enabled) && selectedTotal > 0;\n  const paymentRandomCode = selectedRandomEnabled ? Number(contactFields.__payment_random_code || 0) : 0;\n  const paymentTransferTotal = selectedTotal + paymentRandomCode;"
          if marker2 not in s: raise SystemExit('user payment marker missing')
          s=s.replace(marker2,replacement2,1)
          old_open = "setPaymentPlan(row); setSelectedPaymentMethodId(paymentMethods[0]?.id ?? ''); setContactFields(initial);"
          new_open = "const firstMethod = paymentMethods[0] ?? null; if (firstMethod && String(firstMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(firstMethod.details?.random_code_enabled)) initial.__payment_random_code = String(Math.floor(Math.random() * 900) + 100); setPaymentPlan(row); setSelectedPaymentMethodId(firstMethod?.id ?? ''); setContactFields(initial);"
          if old_open not in s: raise SystemExit('openPayment marker missing')
          s=s.replace(old_open,new_open,1)
          # Carry the selected 3-digit code into the checkout payload.
          target="p_contact_fields: input.contactFields ?? {},"
          # no service change here; the page injects the value into contactFields before createOrganizerPlanOrderV3.
          old_call="contactFields,"
          new_call="contactFields: Object.fromEntries(Object.entries(contactFields).filter(([key]) => key !== '__payment_random_code').concat(selectedRandomEnabled ? [['payment_random_code', String(paymentRandomCode)]] : [])),"
          if old_call in s: s=s.replace(old_call,new_call,1)
          # Human-readable method option labels where present.
          s=s.replace("{method.name} ({method.payment_type})", "{paymentTypeLabel(method.payment_type)}{paymentBankName(method) ? ` · ${paymentBankName(method)}` : ''}")
          # Hide the old proof input so the new, prominent proof card is the single visible uploader.
          s=re.sub(r'(<input ref=\{proofInputRef\}[^>]*className=\")([^\"]*)(\"[^>]*/>)', lambda m: m.group(1)+(m.group(2)+' hidden').strip()+m.group(3), s, count=1)
          modal=re.search(r'(\{paymentOpen\s*&&\s*<div[^>]*>\s*)',s)
          if not modal: modal=re.search(r'(\{paymentOpen\s*&&\s*\(\s*<div[^>]*>\s*)',s)
          if not modal: raise SystemExit('payment modal opening marker missing')
          insert='''{selectedMethod && <div className="mb-4 rounded-2xl border border-surface-border bg-surface-elevated/30 p-4"><div className="flex items-center justify-between gap-3"><div><p className="text-[10px] font-bold uppercase tracking-wider text-accent">Metode Pembayaran</p><p className="mt-1 text-sm font-bold text-fg">{paymentTypeLabel(selectedMethod.payment_type)}{paymentBankName(selectedMethod) ? ` · ${paymentBankName(selectedMethod)}` : ''}</p></div></div>{paymentAccountNumber(selectedMethod) && <div className="mt-4 rounded-xl border border-surface-border bg-surface-bg/50 p-3"><div className="flex items-center justify-between gap-3"><span className="text-[10px] font-semibold uppercase tracking-wider text-fg-muted">Nomor Rekening</span><button type="button" onClick={() => navigator.clipboard.writeText(paymentAccountNumber(selectedMethod)).then(() => toast.success('Nomor rekening disalin.')).catch(() => toast.error('Nomor rekening tidak dapat disalin.'))} className="inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs font-semibold text-accent hover:bg-accent/10"><Copy size={13}/> Salin</button></div><p className="mt-1 text-2xl font-black tracking-wider text-fg">{paymentAccountNumber(selectedMethod)}</p>{paymentAccountName(selectedMethod) && <p className="mt-1 text-xs text-fg-muted">a.n. {paymentAccountName(selectedMethod)}</p>}</div>}{selectedRandomEnabled && <div className="mt-3 rounded-xl border border-accent/20 bg-accent/5 p-3"><p className="text-xs text-fg-muted">Transfer tepat sejumlah</p><p className="mt-1 text-xl font-black text-accent">{money(paymentTransferTotal, paymentPlan?.currency || 'IDR')}</p><p className="mt-1 text-[11px] text-fg-muted">Nominal sudah termasuk kode unik 3 digit.</p></div>}{selectedMethodNeedsProof && selectedTotal > 0 && <div className="mt-4 rounded-2xl border border-accent/20 bg-accent/5 p-4"><div className="flex items-start gap-3"><UploadCloud size={18} className="mt-0.5 shrink-0 text-accent"/><div><p className="text-sm font-bold text-fg">Upload Bukti Transfer</p><p className="mt-1 text-xs leading-5 text-fg-muted">Upload bukti pembayaran setelah transfer sesuai nominal yang tampil di atas.</p></div></div><input type="file" accept="image/*" onChange={(e) => chooseProof(e.target.files?.[0])} className="mt-3 block w-full text-xs text-fg-muted file:mr-3 file:rounded-lg file:border-0 file:bg-accent file:px-3 file:py-2 file:font-semibold file:text-white"/>{proofPreviewUrl && <div className="mt-3 flex items-start gap-3"><img src={proofPreviewUrl} alt="Preview bukti transfer" className="h-28 w-44 rounded-xl object-cover"/><button type="button" onClick={removeProof} className="rounded-lg p-2 text-red-400 hover:bg-red-500/10"><X size={15}/></button></div>}</div>}</div>}'''
          s=s.replace(modal.group(1), modal.group(1)+insert,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/AdminPlanUsagePageV2.tsx src/pages/OrganizerPlanPageV2.tsx
          git commit -m "feat(payment): refine payment method flow"
          git rm .github/workflows/repair-payment-ui.yml .github/workflows/patch-payment-ui.yml
          git commit -m "chore: remove payment UI repair workflow"
          git push
