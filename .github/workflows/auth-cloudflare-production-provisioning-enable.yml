name: Enable Better Auth Production identity provisioning (owner gated)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ENABLE-PRODUCTION-PROVISIONING-sykabelajar-auth-prod-DB2-IDENTITY-ROOT-SENDPULSE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auth-production-provisioning-enable
  cancel-in-progress: false

jobs:
  enable:
    if: ${{ github.ref == 'refs/heads/security/auth-poc-stage-1' && github.actor == 'taufx98' && github.event_name == 'workflow_dispatch' }}
    name: Enable only the gated Production provisioning flag
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/auth-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout exact reviewed auth branch
        uses: actions/checkout@v7
        with:
          ref: security/auth-poc-stage-1

      - name: Verify owner dispatch and immutable clean-start target
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "taufx98"
          test "$GITHUB_REF" = "refs/heads/security/auth-poc-stage-1"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$CONFIRMATION" = "ENABLE-PRODUCTION-PROVISIONING-sykabelajar-auth-prod-DB2-IDENTITY-ROOT-SENDPULSE"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SUPABASE_DB_URL"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const production = readFileSync("wrangler.production.toml", "utf8");
          const staging = readFileSync("wrangler.toml", "utf8");
          const exact = [
            /^name = "sykabelajar-auth-prod"$/m,
            /^database_name = "sykabelajar-auth-prod"$/m,
            /^database_id = "6d4dc7b5-8e71-4fdc-9cda-3230e49951c7"$/m,
            /^pattern = "auth-prod\.sykabelajar\.my\.id"$/m,
            /^AUTH_SIGNUP_DISABLED = "true"$/m,
            /^SUPABASE_PROVISIONING_ENABLED = "false"$/m,
            /^SUPABASE_PROVISIONING_ENV = "production"$/m,
            /^SUPABASE_PROVISIONING_URL = "https:\/\/mvdczyitbkxkldjughor\.supabase\.co"$/m,
          ];
          if (!exact.every((pattern) => pattern.test(production))) {
            throw new Error("Production baseline is not the exact closed-signup/disabled-provisioning target.");
          }
          if (/staging\.sykabelajar\.my\.id|ydamszdfsxqisanazdkb|auth\.sykabelajar\.my\.id/.test(production)) {
            throw new Error("Production Wrangler config contains a staging hostname or project.");
          }
          if (!/^name = "sykabelajar-auth-poc"$/m.test(staging) ||
              !/^database_id = "7a4f9008-a1c6-42b6-8a04-abde12699248"$/m.test(staging) ||
              !/^pattern = "auth\.sykabelajar\.my\.id"$/m.test(staging)) {
            throw new Error("Accepted staging Worker/D1/hostname config changed.");
          }
          const allowlistPath = "../../docs/security/AUTH-STAGE-7-SECURITY-DEFINER-ALLOWLIST-2026-11-21.json";
          let manifest;
          try { manifest = JSON.parse(readFileSync(allowlistPath, "utf8")); }
          catch { throw new Error("Production SECURITY DEFINER review manifest is missing or invalid; provisioning must remain disabled."); }
          const inventoryPath = "../../docs/security/AUTH-STAGE-7-SECURITY-DEFINER-INVENTORY-2026-11-21.json";
          let inventory;
          try { inventory = JSON.parse(readFileSync(inventoryPath, "utf8")); }
          catch { throw new Error("Fresh Production SECURITY DEFINER inventory snapshot is missing; provisioning must remain disabled."); }
          if (inventory.status !== "inventory_only_unreviewed" ||
              inventory.project_ref !== "mvdczyitbkxkldjughor" ||
              inventory.count !== 202 ||
              !Array.isArray(inventory.functions) ||
              inventory.functions.length !== 202) {
            throw new Error("Production SECURITY DEFINER inventory snapshot is not the reviewed 202-function scope.");
          }
          if (manifest.status !== "complete" ||
              manifest.projectRef !== "mvdczyitbkxkldjughor" ||
              manifest.authenticatedSecurityDefinerCount !== 202 ||
              manifest.reviewedAuthenticatedFunctionCount !== 202 ||
              !Array.isArray(manifest.functions) ||
              manifest.functions.length !== 202) {
            throw new Error("Production SECURITY DEFINER audit is not complete for the reviewed 202-function inventory.");
          }
          const manifestAnonCount = manifest.functions.filter((item) => item?.anonExecute === true).length;
          const manifestAuthenticatedCount = manifest.functions.filter((item) => item?.authenticatedExecute === true).length;
          if (manifest.anonSecurityDefinerCount !== manifestAnonCount ||
              manifestAuthenticatedCount !== 202) {
            throw new Error("SECURITY DEFINER allowlist execute counts do not match its per-function expected ACL fingerprints.");
          }
          const inventorySignatures = new Set(inventory.functions.map((item) => item.signature));
          const manifestSignatures = new Set(manifest.functions.map((item) => item?.signature));
          if (inventorySignatures.size !== 202 || manifestSignatures.size !== 202 ||
              [...inventorySignatures].some((signature) => !manifestSignatures.has(signature))) {
            throw new Error("SECURITY DEFINER allowlist does not cover the exact current inventory signatures.");
          }
          const signatures = new Set();
          const allowedClasses = new Set([
            "better_auth_user", "admin_organizer", "public_read",
            "participant_portal_token", "worker_internal", "scheduler_trigger", "deprecated_unused", "public_event", "public_state_sync",
          ]);
          for (const item of manifest.functions) {
            if (!item || typeof item.signature !== "string" || !item.signature.includes("(") ||
                signatures.has(item.signature) || !allowedClasses.has(item.classification) ||
                typeof item.rationale !== "string" || item.rationale.trim().length < 20 ||
                typeof item.sourceMd5 !== "string" || !/^[a-f0-9]{32}$/i.test(item.sourceMd5) ||
                typeof item.owner !== "string" || item.owner.length === 0 ||
                typeof item.identityArguments !== "string" ||
                typeof item.returns !== "string" ||
                typeof item.language !== "string" ||
                !Array.isArray(item.config) || !Array.isArray(item.acl) ||
                typeof item.anonExecute !== "boolean" ||
                typeof item.authenticatedExecute !== "boolean" ||
                typeof item.serviceRoleExecute !== "boolean" ||
                !item.tests || item.tests.legacySupabaseAuth !== "pass" ||
                item.tests.validBetterAuthOrExplicitPublic !== "pass" ||
                item.tests.idorOrTokenBoundary !== "pass") {
              throw new Error("SECURITY DEFINER allowlist contains an incomplete, duplicate, unpinned or untested function classification.");
            }
            signatures.add(item.signature);
          }
          console.log("PASS: exact Production target, unchanged staging config and full SECURITY DEFINER audit manifest structure. No legacy account/data backup is part of the clean-start release gate.");
          NODE
          echo "No secret value was read or printed."

      - name: Install pinned Worker toolchain and checks
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/auth-worker/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run check

      - name: Install PostgreSQL client for read-only DB2 catalog verification
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
          psql --version

      - name: Prepare private Production DB2 connection without printing credentials
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import { writeFileSync, appendFileSync } from "node:fs";
          const raw = process.env.SUPABASE_DB_URL ?? "";
          const ref = "mvdczyitbkxkldjughor";
          let url;
          try { url = new URL(raw); } catch { throw new Error("SUPABASE_DB_URL is not a valid PostgreSQL URI."); }
          const username = decodeURIComponent(url.username);
          const password = decodeURIComponent(url.password);
          const database = decodeURIComponent(url.pathname.replace(/^\//, ""));
          const port = url.port || "5432";
          const sslmode = url.searchParams.get("sslmode") || "require";
          if ((url.protocol !== "postgres:" && url.protocol !== "postgresql:") ||
              !url.hostname.endsWith(".pooler.supabase.com") ||
              username !== "postgres." + ref || port !== "5432" ||
              !password || !database ||
              !["require", "verify-ca", "verify-full"].includes(sslmode)) {
            throw new Error("SUPABASE_DB_URL must be the exact Production Session Pooler target with TLS; no connection was attempted.");
          }
          const escape = (value) => value.replaceAll("\\", "\\\\").replaceAll(":", "\\:");
          const passfile = process.env.RUNNER_TEMP + "/production-db2.pgpass";
          writeFileSync(passfile, [url.hostname, port, database, username, password].map(escape).join(":") + "\n", { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, [
            "PGHOST=" + url.hostname,
            "PGPORT=" + port,
            "PGDATABASE=" + database,
            "PGUSER=" + username,
            "PGSSLMODE=" + sslmode,
            "PGPASSFILE=" + passfile,
          ].join("\n") + "\n");
          NODE
          test -s "$RUNNER_TEMP/production-db2.pgpass"
          chmod 600 "$RUNNER_TEMP/production-db2.pgpass"
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select 1" >/dev/null

      - name: Capture live SECURITY DEFINER catalog and compare against the reviewed inventory snapshot
        run: |
          set -euo pipefail
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "
            SELECT coalesce(jsonb_agg(jsonb_build_object(
              'signature',p.oid::regprocedure::text,
              'identity_arguments',pg_get_function_identity_arguments(p.oid),
              'returns',pg_get_function_result(p.oid),
              'language',l.lanname,
              'owner',pg_get_userbyid(p.proowner),
              'config',coalesce(to_jsonb(p.proconfig),'[]'::jsonb),
              'acl',coalesce(to_jsonb(p.proacl::text[]),'[]'::jsonb),
              'anon_execute',has_function_privilege('anon',p.oid,'EXECUTE'),
              'authenticated_execute',has_function_privilege('authenticated',p.oid,'EXECUTE'),
              'service_role_execute',has_function_privilege('service_role',p.oid,'EXECUTE'),
              'source_md5',md5(p.prosrc),
              'mentions_auth_uid',position('auth.uid' in p.prosrc)>0,
              'mentions_auth_jwt',position('auth.jwt' in p.prosrc)>0,
              'mentions_admin_helper',position('private.current_user_is_admin' in p.prosrc)>0,
              'mentions_role_helper',position('private.current_user_has_role' in p.prosrc)>0,
              'mentions_better_auth_helper',position('private.current_user_is_better_auth' in p.prosrc)>0,
              'mentions_user_roles',position('user_roles' in p.prosrc)>0,
              'mentions_token_parameter',(position('p_access_token' in p.prosrc)>0 OR position('p_portal_token' in p.prosrc)>0)
            ) ORDER BY p.oid),'[]'::jsonb)
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid=p.pronamespace
            JOIN pg_language l ON l.oid=p.prolang
            WHERE n.nspname='public'
              AND p.prosecdef
              AND has_function_privilege('authenticated',p.oid,'EXECUTE')
          " > "$RUNNER_TEMP/production-definer-live.json"

          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const expected = JSON.parse(readFileSync("../../docs/security/AUTH-STAGE-7-SECURITY-DEFINER-INVENTORY-2026-11-21.json","utf8"));
          const live = JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/production-definer-live.json","utf8"));
          const fields = [
            "signature","identity_arguments","returns","language","owner","config","acl",
            "anon_execute","authenticated_execute","service_role_execute","source_md5",
            "mentions_auth_uid","mentions_auth_jwt","mentions_admin_helper","mentions_role_helper",
            "mentions_better_auth_helper","mentions_user_roles","mentions_token_parameter"
          ];
          const normalize = (rows) => rows.map((row) => Object.fromEntries(fields.map((key) => [
            key,
            Array.isArray(row[key]) ? [...row[key]].sort() : row[key]
          ]))).sort((a,b) => a.signature.localeCompare(b.signature));
          const expectedSignatures = new Set(expected.functions.map((item) => item.signature));
          const manifestBySignature = new Map(manifest.functions.map((item) => [item.signature,item]));
          const liveRows = normalize(live);
          assert.equal(expectedSignatures.size,202,"The baseline catalogue must contain 202 unique function signatures.");
          assert.equal(manifestBySignature.size,202,"The reviewed allowlist must contain 202 unique function signatures.");
          assert.equal(liveRows.length,202,"Production currently exposes a different SECURITY DEFINER function count.");
          assert.deepEqual(
            liveRows.map((row) => row.signature).sort(),
            [...expectedSignatures].sort(),
            "Production SECURITY DEFINER signature set changed; re-inventory before enabling provisioning."
          );
          const liveBySignature = new Map(liveRows.map((row) => [row.signature,row]));
          for (const item of manifest.functions) {
            const actual = liveBySignature.get(item.signature);
            assert.ok(actual, "Reviewed function disappeared from Production: " + item.signature);
            assert.equal(actual.source_md5,item.sourceMd5,"Reviewed source changed: " + item.signature);
            assert.equal(actual.identity_arguments,item.identityArguments,"Reviewed function argument names/default identity changed: " + item.signature);
            assert.equal(actual.returns,item.returns,"Reviewed return type changed: " + item.signature);
            assert.equal(actual.language,item.language,"Reviewed function language changed: " + item.signature);
            assert.equal(actual.owner,item.owner,"Reviewed owner changed: " + item.signature);
            assert.deepEqual(actual.config,[...item.config].sort(),"Reviewed search_path/config changed: " + item.signature);
            assert.deepEqual(actual.acl,[...item.acl].sort(),"Reviewed function ACL changed: " + item.signature);
            assert.equal(actual.anon_execute,item.anonExecute,"Reviewed anon EXECUTE state changed: " + item.signature);
            assert.equal(actual.authenticated_execute,item.authenticatedExecute,"Reviewed authenticated EXECUTE state changed: " + item.signature);
            assert.equal(actual.service_role_execute,item.serviceRoleExecute,"Reviewed service_role EXECUTE state changed: " + item.signature);
          }
          console.log("PASS: live Production SECURITY DEFINER functions match the individually reviewed source/owner/search_path/ACL fingerprint for all 202 signatures.");
          NODE

      - name: Verify DB2 identity root, 69 application FKs, legacy trigger retirement and server-only RPC wrappers
        run: |
          set -euo pipefail
          APP_USERS_EXISTS="$(psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select (to_regclass('private.app_users') is not null)::int")"
          test "$APP_USERS_EXISTS" = "1" || {
            echo "Blocked: private.app_users is not installed. Do not activate provisioning before Stage 3 core DDL."
            exit 1
          }

          DB2_STATE="$(psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --field-separator='|' --command "
            WITH expected(signature) AS (
              VALUES
                ('public.better_auth_provision_user(uuid,text,text,text,text,boolean,date,text,text,text)'),
                ('public.better_auth_complete_email_verification(uuid,timestamp with time zone)')
            ),
            wrappers AS (
              SELECT e.signature, p.oid, p.prosecdef, p.proowner, p.proconfig, p.proacl
              FROM expected e
              LEFT JOIN LATERAL (SELECT to_regprocedure(e.signature) AS oid) resolved ON true
              LEFT JOIN pg_proc p ON p.oid = resolved.oid
            )
            SELECT
              (SELECT count(*) FROM pg_constraint c
                JOIN pg_class r ON r.oid=c.conrelid
                JOIN pg_namespace n ON n.oid=r.relnamespace
                WHERE c.contype='f' AND c.confrelid='auth.users'::regclass
                  AND n.nspname IN ('public','private'))::int,
              (SELECT count(*) FROM pg_constraint c
                JOIN pg_class r ON r.oid=c.conrelid
                JOIN pg_namespace n ON n.oid=r.relnamespace
                WHERE c.contype='f' AND c.confrelid='private.app_users'::regclass
                  AND n.nspname IN ('public','private'))::int,
              (SELECT count(*) FROM pg_trigger
                WHERE tgrelid='auth.users'::regclass AND NOT tgisinternal)::int,
              (SELECT count(*) FROM pg_trigger
                WHERE tgrelid='auth.users'::regclass AND NOT tgisinternal
                  AND tgname IN ('on_auth_user_created','trg_referral_email_confirmed','trg_referral_signup_attribution'))::int,
              (SELECT count(*) FROM private.app_users WHERE identity_origin='better_auth')::int,
              (SELECT count(*) FROM private.app_users)::int,
              (SELECT count(*) FROM private.app_users WHERE identity_origin IS DISTINCT FROM 'better_auth')::int,
              (SELECT count(*) FROM wrappers WHERE oid IS NOT NULL)::int,
              (SELECT count(*) FROM wrappers w
                WHERE w.oid IS NOT NULL
                  AND w.prosecdef
                  AND pg_catalog.pg_get_userbyid(w.proowner)='postgres'
                  AND w.proconfig @> ARRAY['search_path=""']::text[]
                  AND pg_catalog.has_function_privilege('service_role',w.oid,'EXECUTE')
                  AND NOT pg_catalog.has_function_privilege('anon',w.oid,'EXECUTE')
                  AND NOT pg_catalog.has_function_privilege('authenticated',w.oid,'EXECUTE')
                  AND NOT EXISTS (
                    SELECT 1 FROM pg_catalog.aclexplode(
                      coalesce(w.proacl,pg_catalog.acldefault('f',w.proowner))
                    ) acl
                    WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE'
                  ))::int,
              (SELECT count(*) FROM pg_proc
                WHERE oid IN (
                  to_regprocedure('private.provision_better_auth_user(uuid,text,text,text,text,boolean,date,text,text,text)'),
                  to_regprocedure('private.complete_better_auth_email_verification(uuid,timestamp with time zone)')
                ))::int,
              (SELECT count(*) FROM pg_proc p
                WHERE p.oid IN (
                  to_regprocedure('private.provision_better_auth_user(uuid,text,text,text,text,boolean,date,text,text,text)'),
                  to_regprocedure('private.complete_better_auth_email_verification(uuid,timestamp with time zone)')
                )
                  AND p.prosecdef
                  AND pg_catalog.pg_get_userbyid(p.proowner)='postgres'
                  AND p.proconfig @> ARRAY['search_path=""']::text[]
                  AND NOT pg_catalog.has_function_privilege('anon',p.oid,'EXECUTE')
                  AND NOT pg_catalog.has_function_privilege('authenticated',p.oid,'EXECUTE')
                  AND NOT pg_catalog.has_function_privilege('service_role',p.oid,'EXECUTE')
                  AND NOT EXISTS (
                    SELECT 1 FROM pg_catalog.aclexplode(
                      coalesce(p.proacl,pg_catalog.acldefault('f',p.proowner))
                    ) acl
                    WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE'
                  ))::int,
              (SELECT count(*) FROM private.app_users WHERE identity_origin IS DISTINCT FROM 'better_auth')::int
          " )"
          IFS='|' read -r AUTH_FKS APP_USERS_FKS USER_TRIGGERS NAMED_LEGACY_TRIGGERS BETTER_AUTH_ROWS APP_USERS_ROWS NON_BETTER_AUTH_ROWS WRAPPERS WRAPPERS_SECURE INNER_FUNCTIONS INNER_FUNCTIONS_SECURE NON_BETTER_AUTH_ROWS_CHECK <<< "$DB2_STATE"

          test "$AUTH_FKS" = "0" || { echo "Blocked: application FKs still reference auth.users."; exit 1; }
          test "$APP_USERS_FKS" = "69" || { echo "Blocked: expected exactly 69 application FKs to private.app_users."; exit 1; }
          test "$USER_TRIGGERS" = "0" || { echo "Blocked: auth.users custom lifecycle triggers have not all been retired."; exit 1; }
          test "$NAMED_LEGACY_TRIGGERS" = "0" || { echo "Blocked: legacy Supabase Auth triggers remain."; exit 1; }
          test "$BETTER_AUTH_ROWS" = "0" || { echo "Blocked: a Better Auth identity already exists; first-owner sequencing requires manual reconciliation."; exit 1; }
          test "$APP_USERS_ROWS" = "0" || { echo "Blocked: private.app_users must be empty before the first fresh Better Auth owner is created."; exit 1; }
          test "$NON_BETTER_AUTH_ROWS" = "0" || { echo "Blocked: identity root contains a non-Better Auth origin; legacy/tombstone identities are forbidden."; exit 1; }
          test "$WRAPPERS" = "2" || { echo "Blocked: required Better Auth provisioning wrappers are missing."; exit 1; }
          test "$WRAPPERS_SECURE" = "2" || { echo "Blocked: wrapper ownership, search_path or execute grants are not the reviewed server-only contract."; exit 1; }
          test "$INNER_FUNCTIONS" = "2" || { echo "Blocked: trusted private provisioning helpers are missing."; exit 1; }
          test "$INNER_FUNCTIONS_SECURE" = "2" || { echo "Blocked: private provisioning helpers must remain postgres-owned, empty-search-path and non-executable by browser/server API roles."; exit 1; }

          ZERO_START_STATE="$(psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "
            DO \$zero_start_provisioning_preflight\$
            DECLARE r record; v_count bigint; v_fk_count integer := 0;
            BEGIN
              IF EXISTS (SELECT 1 FROM private.app_users) THEN
                RAISE EXCEPTION 'ZERO_START_IDENTITY_ROOT_NOT_EMPTY';
              END IF;
              FOR r IN
                SELECT ns.nspname AS schema_name, tbl.relname AS table_name,
                       att.attname AS column_name, con.conname
                FROM pg_catalog.pg_constraint con
                JOIN pg_catalog.pg_class tbl ON tbl.oid=con.conrelid
                JOIN pg_catalog.pg_namespace ns ON ns.oid=tbl.relnamespace
                JOIN pg_catalog.pg_attribute att ON att.attrelid=tbl.oid AND att.attnum=con.conkey[1]
                WHERE con.contype='f'
                  AND con.confrelid='private.app_users'::regclass
                  AND ns.nspname IN ('public','private')
                ORDER BY ns.nspname,tbl.relname,con.conname
              LOOP
                v_fk_count := v_fk_count + 1;
                EXECUTE pg_catalog.format(
                  'SELECT count(*) FROM %I.%I WHERE %I IS NOT NULL',
                  r.schema_name,r.table_name,r.column_name
                ) INTO v_count;
                IF v_count <> 0 THEN
                  RAISE EXCEPTION 'ZERO_START_FK_COLUMN_NOT_EMPTY:%:%:%:%',
                    r.schema_name,r.table_name,r.column_name,v_count;
                END IF;
              END LOOP;
              IF v_fk_count <> 69 THEN
                RAISE EXCEPTION 'ZERO_START_FK_COUNT_DRIFT:%',v_fk_count;
              END IF;
            END;
            \$zero_start_provisioning_preflight\$;
          " )"
          test -n "$ZERO_START_STATE"
          echo "PASS: Production identity root is empty and all 69 application FK source columns contain zero legacy UUID references."
          echo "PASS: Stage 3 FK structure and service_role-only provisioning wrappers are ready for a fresh owner identity."

      - name: Verify exact Production Worker, D1, SendPulse and secret bindings before activation
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.production.toml d1 migrations list sykabelajar-auth-prod --remote
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT
            (SELECT COUNT(*) FROM d1_migrations) AS migration_count,
            (SELECT COUNT(*) FROM \"user\") AS users,
            (SELECT COUNT(*) FROM \"account\") AS accounts,
            (SELECT COUNT(*) FROM \"session\") AS sessions,
            (SELECT COUNT(*) FROM \"verification\") AS verifications,
            (SELECT COUNT(*) FROM oauthAccessToken) AS access_tokens,
            (SELECT COUNT(*) FROM oauthRefreshToken) AS refresh_tokens,
            (SELECT COUNT(*) FROM auth_email_provider_accounts WHERE provider='sendpulse' AND enabled=1 AND credentials_ciphertext IS NOT NULL AND length(trim(credentials_ciphertext))>0) AS active_sendpulse,
            (SELECT COUNT(*) FROM auth_email_provider_accounts WHERE enabled=1) AS active_providers,
            (SELECT COUNT(*) FROM auth_worker_internal_config WHERE key='production_email_bootstrap' AND value='consumed') AS sendpulse_bootstrap_consumed,
            (SELECT COUNT(*) FROM auth_worker_internal_config WHERE key='production_first_account_bootstrap') AS first_account_marker,
            (SELECT email_verification_required FROM auth_runtime_settings WHERE id=1) AS email_verification_required,
            (SELECT auto_failover_enabled FROM auth_email_provider_settings WHERE id=1) AS auto_failover_enabled;" > "$RUNNER_TEMP/production-provisioning-d1-before.json"

          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT id,label,provider,sender_address,sender_name,endpoint_url,auth_mode,credentials_ciphertext,enabled,priority,quota_hour_limit,quota_day_limit,quota_month_limit,hour_bucket,hour_used,day_bucket,day_used,month_bucket,month_used,cooldown_until,last_error_code,last_error_at,last_success_at,created_at,updated_at,created_by,updated_by FROM auth_email_provider_accounts ORDER BY id;" > "$RUNNER_TEMP/production-provisioning-provider-before.json"

          node --input-type=module <<'NODE'
          import { readFileSync as read, writeFileSync } from "node:fs";
          import {createHash} from "node:crypto";
          const root=process.env.RUNNER_TEMP;
          const walk=(v,out=[])=>{if(Array.isArray(v))v.forEach(x=>walk(x,out));else if(v&&typeof v==="object"){if(Array.isArray(v.results))v.results.forEach(x=>{if(x&&typeof x==="object")out.push(x);});else Object.values(v).forEach(x=>{if(x&&typeof x==="object")walk(x,out);});}return out;};
          const parsed=JSON.parse(read(root+"/production-provisioning-d1-before.json","utf8"));
          const rows=walk(parsed).filter(x=>Object.hasOwn(x,"migration_count"));
          if(rows.length!==1)throw new Error("Could not read exactly one Production D1 pre-activation summary.");
          const s=rows[0];
          for(const key of ["users","accounts","sessions","verifications","access_tokens","refresh_tokens","first_account_marker"]) {
            if(Number(s[key])!==0)throw new Error("Production D1 is not at the empty first-owner state: "+key);
          }
          if(Number(s.migration_count)!==11 ||
             Number(s.active_sendpulse)!==1 ||
             Number(s.active_providers)!==1 ||
             Number(s.sendpulse_bootstrap_consumed)!==1 ||
             Number(s.email_verification_required)!==1 ||
             Number(s.auto_failover_enabled)!==1) {
            throw new Error("Production D1 does not meet the reviewed SendPulse/verification/0000-0010 preconditions.");
          }
          writeFileSync(root+"/production-provisioning-d1-summary.json",JSON.stringify(s));
          const providerRows=walk(JSON.parse(read(root+"/production-provisioning-provider-before.json","utf8")))
            .filter(x=>typeof x.id==="string"&&typeof x.provider==="string")
            .sort((a,b)=>a.id.localeCompare(b.id));
          if(providerRows.length!==1||providerRows[0].provider!=="sendpulse"||Number(providerRows[0].enabled)!==1) {
            throw new Error("Production SendPulse provider snapshot does not contain exactly one active SendPulse account.");
          }
          writeFileSync(root+"/production-provisioning-provider-before-normalized.json",JSON.stringify(providerRows));
          writeFileSync(root+"/production-provisioning-provider-before.sha256",createHash("sha256").update(JSON.stringify(providerRows)).digest("hex"));
          console.log("PASS: Production D1 is still identity-empty; one active encrypted SendPulse account, mandatory verification and default failover are present.");
          NODE

          node --input-type=module <<'NODE'
          import {createHash} from "node:crypto";
          import {writeFileSync} from "node:fs";
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID);
          const headers={Authorization:"Bearer "+token,Accept:"application/json"};
          const base="https://api.cloudflare.com/client/v4";
          async function get(path){const r=await fetch(base+path,{headers,redirect:"error"});const b=await r.json().catch(()=>({}));if(!r.ok||b.success!==true)throw new Error("Cloudflare metadata request failed: "+r.status);return b.result;}
          const [scripts,stageDomains,prodDomains,stageSettings,prodSettings,secretRows]=await Promise.all([
            get("/accounts/"+account+"/workers/scripts"),
            get("/accounts/"+account+"/workers/domains?hostname=auth.sykabelajar.my.id"),
            get("/accounts/"+account+"/workers/domains?hostname=auth-prod.sykabelajar.my.id"),
            get("/accounts/"+account+"/workers/scripts/sykabelajar-auth-poc/settings"),
            get("/accounts/"+account+"/workers/scripts/sykabelajar-auth-prod/settings"),
            get("/accounts/"+account+"/workers/scripts/sykabelajar-auth-prod/secrets"),
          ]);
          if(!scripts.some(x=>x?.id==="sykabelajar-auth-poc")||!scripts.some(x=>x?.id==="sykabelajar-auth-prod"))throw new Error("Expected existing staging and Production Workers.");
          if(!stageDomains.some(x=>x?.hostname==="auth.sykabelajar.my.id"&&x?.service==="sykabelajar-auth-poc"&&x?.enabled===true))throw new Error("Accepted staging hostname drift.");
          if(!prodDomains.some(x=>x?.hostname==="auth-prod.sykabelajar.my.id"&&x?.service==="sykabelajar-auth-prod"&&x?.enabled===true))throw new Error("Production hostname drift.");
          const d1=(s)=>((s?.bindings??[]).filter(x=>x?.type==="d1"&&x?.name==="DB"));
          if(d1(stageSettings).length!==1||(d1(stageSettings)[0].database_id??d1(stageSettings)[0].id)!=="7a4f9008-a1c6-42b6-8a04-abde12699248")throw new Error("Staging D1 binding drift.");
          if(d1(prodSettings).length!==1||(d1(prodSettings)[0].database_id??d1(prodSettings)[0].id)!=="6d4dc7b5-8e71-4fdc-9cda-3230e49951c7")throw new Error("Production D1 binding drift.");
          const names=secretRows.map(x=>x?.name).filter(Boolean).sort();
          writeFileSync(process.env.RUNNER_TEMP+"/production-provisioning-secret-names-before.json",JSON.stringify(names));
          const varEntries=(settings)=>{
            const values={...(settings.vars??{})};
            for(const binding of (settings.bindings??[]).filter(x=>x?.type==="plain_text"))values[binding.name]=binding.text;
            delete values.SUPABASE_PROVISIONING_ENABLED;
            return Object.entries(values).sort(([a],[b])=>a.localeCompare(b));
          };
          const varsHash=createHash("sha256").update(JSON.stringify(varEntries(prodSettings))).digest("hex");
          writeFileSync(process.env.RUNNER_TEMP+"/production-provisioning-vars-before.sha256",varsHash);
          for(const required of ["BETTER_AUTH_SECRET","AUTH_PROVIDER_ENCRYPTION_KEY","AUTH_EMAIL_ENCRYPTION_KEY","SUPABASE_PROVISIONING_API_KEY"])if(names.filter(x=>x===required).length!==1)throw new Error("Missing required Production secret binding: "+required);
          for(const forbidden of ["SUPABASE_SERVICE_ROLE_KEY","AUTH_EMAIL_BOOTSTRAP_TOKEN","AUTH_FIRST_ACCOUNT_BOOTSTRAP_TOKEN"])if(names.includes(forbidden))throw new Error("Remove conflicting/temporary secret binding before provisioning activation: "+forbidden);
          const bindingMap=new Map((prodSettings.bindings??[]).filter(x=>x?.type==="plain_text").map(x=>[x.name,x.text]));
          const vars=prodSettings.vars??{};
          const getVar=(key)=>vars[key]??bindingMap.get(key);
          if(getVar("AUTH_SIGNUP_DISABLED")!=="true"||getVar("SUPABASE_PROVISIONING_ENABLED")!=="false"||
             getVar("SUPABASE_PROVISIONING_ENV")!=="production"||
             getVar("SUPABASE_PROVISIONING_URL")!=="https://mvdczyitbkxkldjughor.supabase.co") {
            throw new Error("Live Production runtime flags do not match the closed baseline.");
          }
          for(const name of ["AUTH_FIRST_ACCOUNT_EMAIL"])if(getVar(name))throw new Error("First-owner allowlist must not be installed before provisioning activation.");
          console.log("PASS: exact Worker/D1/domain pairing, server-only provisioning binding, no temporary bootstrap secrets, closed signup and disabled provisioning verified. Secret values were not read.");
          NODE

      - name: Build a temporary Production config with only provisioning enabled
        run: |
          set -euo pipefail
          temp_config=".wrangler.production.provisioning-enabled.toml"
          test ! -e "$temp_config"
          cp wrangler.production.toml "$temp_config"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path=".wrangler.production.provisioning-enabled.toml";
          const original=readFileSync("wrangler.production.toml","utf8");
          const temp=readFileSync(path,"utf8");
          const match='SUPABASE_PROVISIONING_ENABLED = "false"';
          if(original.split(match).length!==2||temp!==original)throw new Error("Expected exactly one disabled provisioning flag in the reviewed Production config.");
          const enabled=temp.replace(match,'SUPABASE_PROVISIONING_ENABLED = "true"');
          if(enabled.replace('SUPABASE_PROVISIONING_ENABLED = "true"',match)!==original)throw new Error("Temporary config changed more than the provisioning flag.");
          if(!/^AUTH_SIGNUP_DISABLED = "true"$/m.test(enabled))throw new Error("Public signup must remain closed.");
          writeFileSync(path,enabled);
          NODE
          npx wrangler --config "$temp_config" deploy --dry-run --outdir "$RUNNER_TEMP/production-provisioning-enable-dry-run"

      - name: Record and verify closed-signup state, deploy only the gated Production flag, then postflight
        run: |
          set -euo pipefail
          temp_config=".wrangler.production.provisioning-enabled.toml"
          trap 'rm -f "$temp_config"' EXIT
          npx wrangler --config "$temp_config" deploy --message "Enable gated Production identity provisioning; public signup remains closed ($GITHUB_SHA)"

          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {createHash} from "node:crypto";
          import {readFileSync} from "node:fs";
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID);
          const headers={Authorization:"Bearer "+token,Accept:"application/json"};
          const base="https://api.cloudflare.com/client/v4";
          async function get(path){const r=await fetch(base+path,{headers,redirect:"error"});const b=await r.json().catch(()=>({}));if(!r.ok||b.success!==true)throw new Error("Cloudflare postflight failed: "+r.status);return b.result;}
          const [stageDomains,prodDomains,stageSettings,prodSettings,secretRows]=await Promise.all([
            get("/accounts/"+account+"/workers/domains?hostname=auth.sykabelajar.my.id"),
            get("/accounts/"+account+"/workers/domains?hostname=auth-prod.sykabelajar.my.id"),
            get("/accounts/"+account+"/workers/scripts/sykabelajar-auth-poc/settings"),
            get("/accounts/"+account+"/workers/scripts/sykabelajar-auth-prod/settings"),
            get("/accounts/"+account+"/workers/scripts/sykabelajar-auth-prod/secrets"),
          ]);
          assert.ok(stageDomains.some(x=>x?.hostname==="auth.sykabelajar.my.id"&&x?.service==="sykabelajar-auth-poc"&&x?.enabled===true));
          assert.ok(prodDomains.some(x=>x?.hostname==="auth-prod.sykabelajar.my.id"&&x?.service==="sykabelajar-auth-prod"&&x?.enabled===true));
          const binding=(s)=>((s?.bindings??[]).filter(x=>x?.type==="d1"&&x?.name==="DB"));
          assert.equal(binding(stageSettings).length,1);
          assert.equal(binding(stageSettings)[0].database_id??binding(stageSettings)[0].id,"7a4f9008-a1c6-42b6-8a04-abde12699248");
          assert.equal(binding(prodSettings).length,1);
          assert.equal(binding(prodSettings)[0].database_id??binding(prodSettings)[0].id,"6d4dc7b5-8e71-4fdc-9cda-3230e49951c7");
          const vars=prodSettings.vars??{};
          const bindings=new Map((prodSettings.bindings??[]).filter(x=>x?.type==="plain_text").map(x=>[x.name,x.text]));
          const val=(key)=>vars[key]??bindings.get(key);
          assert.equal(val("AUTH_SIGNUP_DISABLED"),"true");
          assert.equal(val("SUPABASE_PROVISIONING_ENABLED"),"true");
          assert.equal(val("SUPABASE_PROVISIONING_ENV"),"production");
          assert.equal(val("SUPABASE_PROVISIONING_URL"),"https://mvdczyitbkxkldjughor.supabase.co");
          const names=secretRows.map(x=>x?.name).filter(Boolean).sort();
          const beforeNames=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/production-provisioning-secret-names-before.json","utf8"));
          assert.deepEqual(names,beforeNames,"Production secret-name inventory changed during flag-only activation.");
          const required=["BETTER_AUTH_SECRET","AUTH_PROVIDER_ENCRYPTION_KEY","AUTH_EMAIL_ENCRYPTION_KEY","SUPABASE_PROVISIONING_API_KEY"];
          for(const key of required)assert.equal(names.filter(x=>x===key).length,1);
          for(const key of ["SUPABASE_SERVICE_ROLE_KEY","AUTH_EMAIL_BOOTSTRAP_TOKEN","AUTH_FIRST_ACCOUNT_BOOTSTRAP_TOKEN"])assert.ok(!names.includes(key));
          const varEntries=(settings)=>{
            const values={...(settings.vars??{})};
            for(const binding of (settings.bindings??[]).filter(x=>x?.type==="plain_text"))values[binding.name]=binding.text;
            delete values.SUPABASE_PROVISIONING_ENABLED;
            return Object.entries(values).sort(([a],[b])=>a.localeCompare(b));
          };
          const beforeVars=readFileSync(process.env.RUNNER_TEMP+"/production-provisioning-vars-before.sha256","utf8");
          const afterVars=createHash("sha256").update(JSON.stringify(varEntries(prodSettings))).digest("hex");
          assert.equal(afterVars,beforeVars,"A Production Worker variable other than SUPABASE_PROVISIONING_ENABLED changed.");
          assert.equal(val("AUTH_FIRST_ACCOUNT_EMAIL"),undefined,"First-owner allowlist must remain absent until its separate bootstrap step.");
          console.log("PASS: Production provisioning enabled, public signup still disabled, exact Production D1 and secret names preserved; staging Worker/D1/hostname unchanged.");
          NODE

          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const origin="https://auth-prod.sykabelajar.my.id";
          const appOrigin="https://sykabelajar.my.id";
          const providers=await fetch(origin+"/api/auth/providers",{headers:{Origin:appOrigin},redirect:"error"});
          assert.equal(providers.status,200);
          const policy=await providers.json();
          assert.equal(policy.emailVerificationRequired,true);
          assert.equal(providers.headers.get("Access-Control-Allow-Origin"),appOrigin);
          const denied=await fetch(origin+"/api/auth/providers",{headers:{Origin:"https://attacker.example"},redirect:"error"});
          assert.equal(denied.headers.get("Access-Control-Allow-Origin"),null);
          const signup=await fetch(origin+"/api/auth/sign-up/email",{
            method:"POST",
            headers:{Origin:appOrigin,"Content-Type":"application/json"},
            body:JSON.stringify({name:"Blocked provisioning activation probe",email:"blocked-provisioning-activation@example.invalid",password:"Never-Create-This-Account-1"}),
            redirect:"error",
          });
          assert.equal(signup.status,503,"Public signup must remain disabled after provisioning activation.");
          console.log("PASS: Production email verification policy and CORS verified; untrusted Origin rejected; public signup still returns HTTP 503.");
          NODE

          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT
            (SELECT COUNT(*) FROM \"user\") AS users,
            (SELECT COUNT(*) FROM \"account\") AS accounts,
            (SELECT COUNT(*) FROM \"session\") AS sessions,
            (SELECT COUNT(*) FROM \"verification\") AS verifications,
            (SELECT COUNT(*) FROM oauthAccessToken) AS access_tokens,
            (SELECT COUNT(*) FROM oauthRefreshToken) AS refresh_tokens,
            (SELECT COUNT(*) FROM auth_email_provider_accounts WHERE provider='sendpulse' AND enabled=1) AS active_sendpulse;" > "$RUNNER_TEMP/production-provisioning-d1-after.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT id,label,provider,sender_address,sender_name,endpoint_url,auth_mode,credentials_ciphertext,enabled,priority,quota_hour_limit,quota_day_limit,quota_month_limit,hour_bucket,hour_used,day_bucket,day_used,month_bucket,month_used,cooldown_until,last_error_code,last_error_at,last_success_at,created_at,updated_at,created_by,updated_by FROM auth_email_provider_accounts ORDER BY id;" > "$RUNNER_TEMP/production-provisioning-provider-after.json"

          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          import {createHash} from "node:crypto";
          const walk=(v,out=[])=>{if(Array.isArray(v))v.forEach(x=>walk(x,out));else if(v&&typeof v==="object"){if(Array.isArray(v.results))v.results.forEach(x=>{if(x&&typeof x==="object")out.push(x);});else Object.values(v).forEach(x=>{if(x&&typeof x==="object")walk(x,out);});}return out;};
          const before=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/production-provisioning-d1-summary.json","utf8"));
          const afterRows=walk(JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/production-provisioning-d1-after.json","utf8"))).filter(x=>Object.hasOwn(x,"users"));
          if(afterRows.length!==1)throw new Error("Could not verify Production D1 post-activation identity state.");
          const after=afterRows[0];
          for(const key of ["users","accounts","sessions","verifications","access_tokens","refresh_tokens"])if(Number(after[key])!==Number(before[key]))throw new Error("Production D1 identity state changed during flag-only activation: "+key);
          if(Number(after.active_sendpulse)!==1)throw new Error("The active SendPulse provider row changed during flag-only activation.");
          const beforeProvider=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/production-provisioning-provider-before-normalized.json","utf8"));
          const afterProvider=walk(JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/production-provisioning-provider-after.json","utf8")))
            .filter(x=>typeof x.id==="string"&&typeof x.provider==="string")
            .sort((a,b)=>a.id.localeCompare(b.id));
          const beforeProviderHash=readFileSync(process.env.RUNNER_TEMP+"/production-provisioning-provider-before.sha256","utf8");
          const afterProviderHash=createHash("sha256").update(JSON.stringify(afterProvider)).digest("hex");
          if(beforeProviderHash!==afterProviderHash)throw new Error("Encrypted SendPulse credentials, routing/quota/delivery state changed during flag-only activation.");
          console.log("PASS: no Better Auth identity/session state or SendPulse provider configuration was altered by the flag-only activation.");
          NODE

      - name: Remove temporary files and private DB connection material
        if: always()
        run: |
          rm -f .wrangler.production.provisioning-enabled.toml
          rm -f "$RUNNER_TEMP"/production-db2.pgpass
          rm -f "$RUNNER_TEMP"/production-provisioning-*.json
          rm -f "$RUNNER_TEMP"/production-provisioning-*.sha256
          rm -f "$RUNNER_TEMP"/production-provisioning-vars-before.sha256
          rm -f "$RUNNER_TEMP"/production-definer-live.json
          rm -rf "$RUNNER_TEMP"/production-provisioning-enable-dry-run
