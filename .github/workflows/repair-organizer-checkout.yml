name: One-shot Organizer Checkout Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'one-shot organizer checkout repair') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply checkout repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()

          # Voucher validation: when the package is correct but the voucher is for
          # the other billing period, automatically switch MONTHLY <-> YEARLY.
          pattern = re.compile(r"  async function checkVoucher\(\) \{.*?\n  \}\n\n  async function sendOrder\(\)", re.S)
          replacement = '''  async function checkVoucher() {
    const code = voucherCode.trim().toUpperCase();
    if (!code) { setVoucherApplied(null); setVoucherMessage('Masukkan kode voucher terlebih dahulu.'); return; }
    if (!paymentPlan) return;
    setVoucherChecking(true); setVoucherApplied(null); setVoucherMessage('Memeriksa voucher…');
    try {
      let result = await validateOrganizerVoucher(code, paymentPlan.plan_code, billing);
      if (!result.isValid && /^Voucher hanya bisa digunakan untuk periode/i.test(result.message || '')) {
        const alternateBilling: Billing = billing === 'MONTHLY' ? 'YEARLY' : 'MONTHLY';
        const alternateResult = await validateOrganizerVoucher(code, paymentPlan.plan_code, alternateBilling);
        if (alternateResult.isValid) {
          setBilling(alternateBilling);
          setView(alternateBilling);
          result = alternateResult;
        }
      }
      if (!result.isValid) { setVoucherMessage(result.message || 'Voucher tidak dapat digunakan.'); return; }
      setVoucherApplied(result); setVoucherMessage('Voucher bisa digunakan.'); toast.success('Voucher bisa digunakan.');
    } catch (error: any) { setVoucherMessage(error?.message || 'Gagal memeriksa voucher.'); }
    finally { setVoucherChecking(false); }
  }

  async function sendOrder()'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('checkVoucher block not found')
          s = s2

          # Keep the checkout popup compact.
          s = s.replace('w-full max-w-xl max-h-[84vh] flex-col overflow-auto rounded-3xl', 'w-full max-w-lg max-h-[78vh] flex-col overflow-auto rounded-3xl', 1)
          s = s.replace('bg-surface p-5 shadow-2xl md:p-6', 'bg-surface p-4 shadow-2xl md:p-5', 1)

          # Add billing selector inside the checkout popup so users do not need to close it.
          anchor = '<p className="mt-1 text-xs text-fg-muted">Lengkapi data pemesan, pilih pembayaran, lihat total, lalu gunakan voucher bila ada.</p></div><button'
          insert = '<p className="mt-1 text-xs text-fg-muted">Lengkapi data pemesan, pilih pembayaran, lihat total, lalu gunakan voucher bila ada.</p><div className="mt-3 inline-flex w-full rounded-xl border border-surface-border bg-surface-elevated/35 p-1"><button type="button" onClick={() => { setBilling(\'MONTHLY\'); setView(\'MONTHLY\'); setVoucherApplied(null); setVoucherMessage(\'\'); }} className={`flex-1 rounded-lg px-3 py-2 text-xs font-semibold transition ${billing === \'MONTHLY\' ? \'bg-accent text-white shadow\' : \'text-fg-muted hover:text-fg\'}`}>Bulanan</button><button type="button" onClick={() => { setBilling(\'YEARLY\'); setView(\'YEARLY\'); setVoucherApplied(null); setVoucherMessage(\'\'); }} className={`flex-1 rounded-lg px-3 py-2 text-xs font-semibold transition ${billing === \'YEARLY\' ? \'bg-accent text-white shadow\' : \'text-fg-muted hover:text-fg\'}`}>Tahunan</button></div></div><button'
          if anchor not in s:
              raise SystemExit('checkout header anchor not found')
          s = s.replace(anchor, insert, 1)

          # Make account number / owner easier to read.
          s = s.replace('text-lg font-black tracking-wider text-fg sm:text-xl', 'text-xl font-black tracking-wider text-fg sm:text-2xl', 1)
          s = s.replace('text-sm font-semibold text-fg-muted sm:text-base', 'text-base font-semibold text-fg sm:text-lg', 1)

          # Replace nested copy button with a span so it does not create invalid nested buttons.
          old_copy = '<button type="button" className="rounded-lg border border-surface-border p-1.5 text-fg-muted hover:text-fg" onClick={(event) => { event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); }} aria-label="Salin nomor rekening"><Copy size={14}/></button>'
          new_copy = '<span role="button" tabIndex={0} className="rounded-lg border border-surface-border p-1.5 text-fg-muted hover:text-fg" onClick={(event) => { event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); }} onKeyDown={(event) => { if (event.key === \'Enter\' || event.key === \' \') { event.preventDefault(); event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); } }} aria-label="Salin nomor rekening"><Copy size={14}/></span>'
          if old_copy not in s:
              raise SystemExit('copy button block not found')
          s = s.replace(old_copy, new_copy, 1)

          # Show the unique three-digit code and the final payable total.
          old_total = '<div className="mt-4 flex items-end justify-between border-t border-surface-border pt-4"><span className="font-semibold text-fg">Total pembayaran</span><span className={`text-3xl font-black ${selectedTotal === 0 ? \'text-emerald-300\' : \'text-fg\'}`}>{selectedTotal === 0 ? \'GRATIS\' : money(selectedTotal, paymentPlan.currency)}</span></div>'
          new_total = '<div className="mt-4 border-t border-surface-border pt-4">{selectedRandomEnabled && <div className="mb-2 flex items-center justify-between text-sm"><span className="text-fg-muted">Kode unik</span><span className="font-black tracking-wider text-emerald-300">{String(paymentRandomCode).padStart(3, \'0\')}</span></div>}<div className="flex items-end justify-between"><span className="font-semibold text-fg">Total pembayaran</span><span className={`text-3xl font-black ${selectedTotal === 0 ? \'text-emerald-300\' : \'text-fg\'}`}>{selectedTotal === 0 ? \'GRATIS\' : money(paymentTransferTotal, paymentPlan.currency)}</span></div></div>'
          if old_total not in s:
              raise SystemExit('total payment block not found')
          s = s.replace(old_total, new_total, 1)

          p.write_text(s)

          # Ensure CI can be manually dispatched for the post-patch commit.
          d = Path('.github/workflows/deploy.yml')
          ds = d.read_text()
          if 'workflow_dispatch:' not in ds:
              ds = ds.replace('on:\n  push:', 'on:\n  workflow_dispatch:\n  push:', 1)
              d.write_text(ds)
          PY

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/OrganizerPlanPageV2.tsx .github/workflows/deploy.yml
          git diff --cached --quiet && { echo 'NO_CHANGES'; exit 0; }
          git commit -m "fix: organizer checkout voucher period and payment total"
          git push origin HEAD:main

      - name: Validate patched source
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run lint
          npm run typecheck

      - name: Dispatch main CI for patched commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          gh workflow run deploy.yml --ref main
          for i in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow deploy.yml --branch main --limit 10 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n 1)"
            if [ -n "$RUN_ID" ]; then
              echo "CI run: $RUN_ID"
              gh run watch "$RUN_ID" --exit-status
              exit $?
            fi
            sleep 5
          done
          echo 'Unable to locate dispatched CI run for patched commit.' >&2
          exit 1

      - name: Cleanup one-shot workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy.yml')
          s = p.read_text()
          s = s.replace('on:\n  workflow_dispatch:\n  push:', 'on:\n  push:', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy.yml
          git commit -m "chore: restore ci workflow trigger" || true
          git push origin HEAD:main || true
          gh api --method DELETE "repos/${{ github.repository }}/contents/.github/workflows/repair-organizer-checkout.yml" -f message="chore: remove one-shot checkout repair workflow" -f sha="$(gh api repos/${{ github.repository }}/contents/.github/workflows/repair-organizer-checkout.yml?ref=main --jq .sha)" -f branch="main" || true