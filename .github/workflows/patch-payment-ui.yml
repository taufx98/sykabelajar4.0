name: One-time payment UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'feat(payment): refine payment method flow') && !startsWith(github.event.head_commit.message, 'chore: remove payment UI patch workflow') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # service: pass the display/random payment code through contact_fields
          p=Path('src/services/commerce.service.ts'); s=p.read_text()

          # admin payment labels/helpers + form model
          p=Path('src/pages/AdminPlanUsagePageV2.tsx'); s=p.read_text()
          s=s.replace("import { Banknote, CheckCircle2, ClipboardList, CreditCard, Gauge, MessageCircle, Plus, Save, Settings2, ShieldCheck, TicketPercent, Trash2, X } from 'lucide-react';", "import { Banknote, CheckCircle2, ClipboardList, Copy, CreditCard, Gauge, MessageCircle, Plus, Save, Settings2, ShieldCheck, TicketPercent, Trash2, X } from 'lucide-react';")
          s=s.replace("type NewPaymentMethod = { name: string; paymentType: string; bankName: string; accountNumber: string; accountName: string; instructions: string };", "type NewPaymentMethod = { paymentType: string; bankName: string; accountNumber: string; accountName: string; randomCodeEnabled: boolean };")
          s=s.replace("const emptyMethod: NewPaymentMethod = { name: '', paymentType: 'BANK_TRANSFER', bankName: '', accountNumber: '', accountName: '', instructions: '' };", "const emptyMethod: NewPaymentMethod = { paymentType: 'BANK_TRANSFER', bankName: '', accountNumber: '', accountName: '', randomCodeEnabled: false };")
          marker="function methodMeta(method: OrganizerPaymentMethod) { return { bankName: String(method.details?.bank_name ?? ''), accountNumber: String(method.details?.account_number ?? ''), accountName: String(method.details?.account_name ?? ''), instructions: String(method.details?.instructions ?? method.details?.text ?? '') }; }"
          repl="function methodMeta(method: OrganizerPaymentMethod) { return { bankName: String(method.details?.bank_name ?? ''), accountNumber: String(method.details?.account_number ?? ''), accountName: String(method.details?.account_name ?? ''), randomCodeEnabled: Boolean(method.details?.random_code_enabled) }; }\nfunction paymentTypeLabel(value: string) { const type=value.toUpperCase(); if(type==='BANK_TRANSFER') return 'Transfer Bank'; if(type==='QRIS') return 'QRIS'; if(type==='VIRTUAL_ACCOUNT') return 'Virtual Account'; if(type==='EWALLET') return 'E-Wallet'; if(type==='MIDTRANS') return 'Pembayaran Otomatis'; if(type==='SNAP') return 'Payment Gateway'; return 'Metode Pembayaran'; }"
          if marker not in s: raise SystemExit('admin helper marker missing')
          s=s.replace(marker,repl,1)
          # replace addMethod function
          start=s.find("  const addMethod = async () =>")
          end=s.find("  const deleteMethod = async",start)
          if start<0 or end<0: raise SystemExit('admin addMethod block missing')
          new_add="  const addMethod = async () => { const type = newMethod.paymentType.trim().toUpperCase(); if (type === 'BANK_TRANSFER' && !newMethod.bankName.trim()) { toast('Nama bank wajib diisi.', 'error'); return; } if (type === 'BANK_TRANSFER' && !newMethod.accountNumber.trim()) { toast('Nomor rekening wajib diisi.', 'error'); return; } if (type === 'BANK_TRANSFER' && !newMethod.accountName.trim()) { toast('Atas nama rekening wajib diisi.', 'error'); return; } setBusy(true); try { const details = { bank_name: newMethod.bankName.trim() || null, account_number: newMethod.accountNumber.trim() || null, account_name: newMethod.accountName.trim() || null, random_code_enabled: type === 'BANK_TRANSFER' && newMethod.randomCodeEnabled }; const created = await adminCreateOrganizerPaymentMethod({ name: type === 'BANK_TRANSFER' ? 'Transfer Bank' : paymentTypeLabel(type), paymentType: type, details, sortOrder: paymentMethods.length + 1 }); setPaymentMethods((current) => [...current, created]); setNewMethod(emptyMethod); setShowMethodForm(false); toast('Metode pembayaran ditambahkan.', 'success'); } catch (e: any) { toast(e?.message || 'Gagal menambah metode pembayaran.', 'error'); } finally { setBusy(false); } };\n"
          s=s[:start]+new_add+s[end:]
          # replace payment form body between class wrappers
          old="""<div className=\"mt-5 space-y-4\"><label className=\"block text-xs font-medium text-fg-muted\">Nama metode<input className=\"input mt-1 w-full\" value={newMethod.name} onChange={(e) => setNewMethod((v) => ({ ...v, name: e.target.value }))} placeholder=\"BCA Transfer\"/></label><label className=\"block text-xs font-medium text-fg-muted\">Jenis pembayaran<select className=\"input mt-1 w-full\" value={newMethod.paymentType} onChange={(e) => setNewMethod((v) => ({ ...v, paymentType: e.target.value }))}><option value=\"BANK_TRANSFER\">Bank Transfer</option><option value=\"QRIS\">QRIS</option><option value=\"EWALLET\">E-Wallet</option><option value=\"MIDTRANS\">Midtrans</option><option value=\"SNAP\">Snap / Payment Gateway</option><option value=\"OTHER\">Lainnya</option></select></label>{newMethod.paymentType === 'BANK_TRANSFER' && <div className=\"grid gap-3 sm:grid-cols-2\"><label className=\"text-xs font-medium text-fg-muted\">Nama bank<input className=\"input mt-1 w-full\" value={newMethod.bankName} onChange={(e) => setNewMethod((v) => ({ ...v, bankName: e.target.value }))} placeholder=\"Bank BCA\"/></label><label className=\"text-xs font-medium text-fg-muted\">Nomor rekening<input className=\"input mt-1 w-full\" value={newMethod.accountNumber} onChange={(e) => setNewMethod((v) => ({ ...v, accountNumber: e.target.value }))} inputMode=\"numeric\" placeholder=\"1234567890\"/></label><label className=\"text-xs font-medium text-fg-muted sm:col-span-2\">Atas nama<input className=\"input mt-1 w-full\" value={newMethod.accountName} onChange={(e) => setNewMethod((v) => ({ ...v, accountName: e.target.value }))} placeholder=\"PT SykaBelajar Indonesia\"/></label></div>}{newMethod.paymentType !== 'BANK_TRANSFER' && <div className=\"rounded-xl border border-surface-border bg-surface-elevated/30 p-3 text-xs leading-5 text-fg-muted\">Detail khusus metode ini dapat dijelaskan pada instruksi di bawah. Untuk Midtrans/Snap, user tidak perlu upload bukti transfer manual.</div>}<label className=\"block text-xs font-medium text-fg-muted\">Instruksi untuk organizer<textarea className=\"input mt-1 min-h-28 w-full\" value={newMethod.instructions} onChange={(e) => setNewMethod((v) => ({ ...v, instructions: e.target.value }))} placeholder=\"Transfer sesuai nominal. Setelah transfer selesai, upload bukti transfer pada checkout.\"/></label><Button fullWidth disabled={busy} onClick={() => void addMethod()} icon={<Plus size={15}/>}>Simpan Metode Pembayaran</Button></div>"""
          new="""<div className=\"mt-5 space-y-4\"><label className=\"block text-xs font-medium text-fg-muted\">Jenis pembayaran<select className=\"input mt-1 w-full\" value={newMethod.paymentType} onChange={(e) => setNewMethod((v) => ({ ...v, paymentType: e.target.value }))}><option value=\"BANK_TRANSFER\">Transfer Bank</option><option value=\"QRIS\">QRIS</option><option value=\"VIRTUAL_ACCOUNT\">Virtual Account</option><option value=\"EWALLET\">E-Wallet</option><option value=\"MIDTRANS\">Pembayaran Otomatis</option><option value=\"SNAP\">Payment Gateway</option><option value=\"OTHER\">Lainnya</option></select></label><label className=\"block text-xs font-medium text-fg-muted\">Nama bank<input className=\"input mt-1 w-full\" value={newMethod.bankName} onChange={(e) => setNewMethod((v) => ({ ...v, bankName: e.target.value }))} placeholder=\"BCA\"/></label><label className=\"block text-xs font-medium text-fg-muted\">Nomor rekening<input className=\"input mt-1 w-full\" value={newMethod.accountNumber} onChange={(e) => setNewMethod((v) => ({ ...v, accountNumber: e.target.value }))} inputMode=\"numeric\" placeholder=\"1234 1234 1234\"/></label><label className=\"block text-xs font-medium text-fg-muted\">Atas nama rekening<input className=\"input mt-1 w-full\" value={newMethod.accountName} onChange={(e) => setNewMethod((v) => ({ ...v, accountName: e.target.value }))} placeholder=\"Nama pemilik rekening\"/></label>{newMethod.paymentType === 'BANK_TRANSFER' && <label className=\"flex items-start gap-3 rounded-xl border border-accent/20 bg-accent/5 p-3 text-sm text-fg\"><input type=\"checkbox\" className=\"mt-0.5\" checked={newMethod.randomCodeEnabled} onChange={(e) => setNewMethod((v) => ({ ...v, randomCodeEnabled: e.target.checked }))}/><span><strong className=\"block\">Random 3 digit</strong><span className=\"text-xs text-fg-muted\">Tambahkan kode unik 3 digit pada nominal transfer setiap checkout.</span></span></label>}<Button fullWidth disabled={busy} onClick={() => void addMethod()} icon={<Plus size={15}/>}>Simpan Metode Pembayaran</Button></div>"""
          if old not in s: raise SystemExit('admin form marker missing')
          s=s.replace(old,new,1)
          # replace method listing payload display
          s=s.replace("const meta = methodMeta(method); return <Card key={method.id} className=\"p-5 md:p-6\">", "const meta = methodMeta(method); return <Card key={method.id} className=\"p-5 md:p-6\">")
          s=s.replace("<span className=\"rounded-full bg-surface-elevated px-2.5 py-1 text-[9px] font-bold uppercase tracking-wider text-fg-muted\">{method.payment_type}</span>", "<span className=\"rounded-full bg-surface-elevated px-2.5 py-1 text-[9px] font-bold tracking-wider text-fg-muted\">{paymentTypeLabel(method.payment_type)}</span>")
          s=s.replace("{meta.accountName && <p className=\"mt-1 text-xs text-fg-muted\">a.n. {meta.accountName}</p>}{paymentDetail(method) && <p className=\"mt-3 whitespace-pre-wrap rounded-xl border border-surface-border bg-surface-elevated/30 p-3 text-xs leading-5 text-fg-muted\">{paymentDetail(method)}</p>}", "{meta.accountName && <p className=\"mt-1 text-xs text-fg-muted\">a.n. {meta.accountName}</p>}{meta.randomCodeEnabled && <p className=\"mt-3 text-xs font-semibold text-accent\">Kode unik 3 digit: aktif</p>}")
          p.write_text(s)

          # user page: labels, random code, payment detail + proof box injection
          p=Path('src/pages/OrganizerPlanPageV2.tsx'); s=p.read_text()
          s=s.replace("import { ArrowLeft, ArrowRight, Check, CheckCircle2, CreditCard, Eye, Gauge, MessageCircle, RefreshCw, ShieldCheck, Sparkles, Tag, UploadCloud, X } from 'lucide-react';", "import { ArrowLeft, ArrowRight, Check, CheckCircle2, Copy, CreditCard, Eye, Gauge, MessageCircle, RefreshCw, ShieldCheck, Sparkles, Tag, UploadCloud, X } from 'lucide-react';")
          marker="function paymentDetailText(method: OrganizerPaymentMethod) { return typeof method.details?.text === 'string' ? method.details.text : Object.entries(method.details ?? {}).map(([key, value]) => `${key}: ${String(value)}`).join('\\n'); }"
          repl="function paymentTypeLabel(value: string) { const type=value.toUpperCase(); if(type==='BANK_TRANSFER') return 'Transfer Bank'; if(type==='QRIS') return 'QRIS'; if(type==='VIRTUAL_ACCOUNT') return 'Virtual Account'; if(type==='EWALLET') return 'E-Wallet'; if(type==='MIDTRANS') return 'Pembayaran Otomatis'; if(type==='SNAP') return 'Payment Gateway'; return 'Metode Pembayaran'; }\nfunction accountNumber(method: OrganizerPaymentMethod | null) { return String(method?.details?.account_number ?? '').trim(); }\nfunction bankName(method: OrganizerPaymentMethod | null) { return String(method?.details?.bank_name ?? '').trim(); }\nfunction accountName(method: OrganizerPaymentMethod | null) { return String(method?.details?.account_name ?? '').trim(); }\nfunction paymentDetailText(method: OrganizerPaymentMethod) { return ''; }"
          if marker not in s: raise SystemExit('user helper marker missing')
          s=s.replace(marker,repl,1)
          s=s.replace("  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP'].includes(String(selectedMethod.payment_type).toUpperCase());", "  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(selectedMethod.payment_type).toUpperCase());\n  const selectedRandomEnabled = !!selectedMethod && String(selectedMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(selectedMethod.details?.random_code_enabled) && selectedTotal > 0;\n  const paymentRandomCode = selectedRandomEnabled ? Number(contactFields.__payment_random_code || 0) : 0;\n  const paymentTransferTotal = selectedTotal + paymentRandomCode;\n  function refreshPaymentRandomCode() { if (!selectedRandomEnabled) { setContactFields((current) => ({ ...current, __payment_random_code: '' })); return; } setContactFields((current) => ({ ...current, __payment_random_code: String(Math.floor(Math.random() * 900) + 100) })); }")
          # regenerate when method changes/open
          s=s.replace("  function openPayment(row: OrganizerPlanCatalogRow) {", "  function openPayment(row: OrganizerPlanCatalogRow) {")
          s=s.replace("setPaymentPlan(row); setSelectedPaymentMethodId(paymentMethods[0]?.id ?? ''); setContactFields(initial);", "const firstMethod = paymentMethods[0] ?? null; if (firstMethod && String(firstMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(firstMethod.details?.random_code_enabled)) initial.__payment_random_code = String(Math.floor(Math.random() * 900) + 100); setPaymentPlan(row); setSelectedPaymentMethodId(firstMethod?.id ?? ''); setContactFields(initial);")
          # sendOrder: strip internal field from contact fields while forwarding proof
          s=s.replace("contactFields,", "contactFields: Object.fromEntries(Object.entries(contactFields).filter(([key]) => key !== '__payment_random_code').concat(selectedRandomEnabled ? [['payment_random_code', String(paymentRandomCode)]] : [])),", 1)
          # inject visible payment info/proof block after modal begins
          modal=re.search(r"(\{paymentOpen\s*&&\s*<div[^>]*>\s*)",s)
          if not modal:
             modal=re.search(r"(\{paymentOpen\s*&&\s*\(\s*<div[^>]*>\s*)",s)
          if not modal: raise SystemExit('user payment modal marker missing')
          block="""{paymentOpen && <></>}"""
          # Use insertion only once: insert after the first modal opening tag a reusable conditional card.
          insert="""{selectedMethod && <div className=\"mb-4 rounded-2xl border border-surface-border bg-surface-elevated/30 p-4\"><div className=\"flex items-center justify-between gap-3\"><div><p className=\"text-[10px] font-bold uppercase tracking-wider text-accent\">Metode Pembayaran</p><p className=\"mt-1 text-sm font-bold text-fg\">{paymentTypeLabel(selectedMethod.payment_type)}{bankName(selectedMethod) ? ` · ${bankName(selectedMethod)}` : ''}</p></div></div>{accountNumber(selectedMethod) && <div className=\"mt-4 rounded-xl border border-surface-border bg-surface-bg/50 p-3\"><div className=\"flex items-center justify-between gap-3\"><span className=\"text-[10px] font-semibold uppercase tracking-wider text-fg-muted\">Nomor Rekening</span><button type=\"button\" onClick={() => navigator.clipboard.writeText(accountNumber(selectedMethod)).then(() => toast.success('Nomor rekening disalin.')).catch(() => toast.error('Nomor rekening tidak dapat disalin.'))} className=\"inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs font-semibold text-accent hover:bg-accent/10\"><Copy size={13}/> Salin</button></div><p className=\"mt-1 text-2xl font-black tracking-wider text-fg\">{accountNumber(selectedMethod)}</p>{accountName(selectedMethod) && <p className=\"mt-1 text-xs text-fg-muted\">a.n. {accountName(selectedMethod)}</p>}</div>}{selectedRandomEnabled && <div className=\"mt-3 rounded-xl border border-accent/20 bg-accent/5 p-3\"><p className=\"text-xs text-fg-muted\">Transfer tepat sejumlah</p><p className=\"mt-1 text-xl font-black text-accent\">{money(paymentTransferTotal, paymentPlan.currency)}</p><p className=\"mt-1 text-[11px] text-fg-muted\">Sudah termasuk kode unik 3 digit.</p></div>}{selectedMethodNeedsProof && selectedTotal > 0 && <div className=\"mt-4 rounded-2xl border border-accent/20 bg-accent/5 p-4\"><div className=\"flex items-start gap-3\"><UploadCloud size={18} className=\"mt-0.5 shrink-0 text-accent\"/><div><p className=\"text-sm font-bold text-fg\">Upload Bukti Transfer</p><p className=\"mt-1 text-xs leading-5 text-fg-muted\">Upload bukti pembayaran setelah melakukan transfer sesuai nominal di atas.</p></div></div><input ref={proofInputRef} type=\"file\" accept=\"image/*\" onChange={(e) => chooseProof(e.target.files?.[0])} className=\"mt-3 block w-full text-xs text-fg-muted file:mr-3 file:rounded-lg file:border-0 file:bg-accent file:px-3 file:py-2 file:font-semibold file:text-white\"/>{proofPreviewUrl && <div className=\"mt-3 flex items-start gap-3\"><img src={proofPreviewUrl} alt=\"Preview bukti transfer\" className=\"h-28 w-44 rounded-xl object-cover\"/><button type=\"button\" onClick={removeProof} className=\"rounded-lg p-2 text-red-400 hover:bg-red-500/10\"><X size={15}/></button></div>}</div>}</div>}"""
          # Only inject the card contents by replacing the opening modal with itself + block.
          opening=modal.group(1)
          s=s.replace(opening, opening+insert, 1)
          # Make method selection human-readable: options currently likely rendered from methods.
          s=s.replace("{method.name} ({method.payment_type})", "{paymentTypeLabel(method.payment_type)}{bankName(method) ? ` · ${bankName(method)}` : ''}")
          p.write_text(s)

          # backend already uses random_code_enabled, ensure client value is read as integer safely in create RPC payload via contactFields
          print('payment UI patch complete')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OrganizerPlanPageV2.tsx src/pages/AdminPlanUsagePageV2.tsx src/services/commerce.service.ts .github/workflows/patch-payment-ui.yml
          git commit -m "feat(payment): refine payment method flow"
          git rm .github/workflows/patch-payment-ui.yml
          git commit -m "chore: remove payment UI patch workflow"
          git push