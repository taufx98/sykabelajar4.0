name: Payment flow v6 patch
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply robust payment flow patch
        shell: bash
        run: |
          MSG="$(git log -1 --pretty=%B)"
          if [[ "$MSG" == "feat(payment): v6 final"* || "$MSG" == "chore: remove payment flow v6 patch"* ]]; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          import re

          # User checkout page.
          p=Path('src/pages/OrganizerPlanPageV2.tsx'); s=p.read_text()
          if 'Copy' not in s.splitlines()[1] and 'Copy' not in s.splitlines()[2]:
              s=s.replace("import { ArrowLeft, ArrowRight, Check, CheckCircle2, CreditCard, Eye, Gauge, MessageCircle, RefreshCw, ShieldCheck, Sparkles, Tag, UploadCloud, X } from 'lucide-react';", "import { ArrowLeft, ArrowRight, Check, CheckCircle2, Copy, CreditCard, Eye, Gauge, MessageCircle, RefreshCw, ShieldCheck, Sparkles, Tag, UploadCloud, X } from 'lucide-react';")
          if 'function paymentTypeLabel(value: string)' not in s:
              anchor='function paymentDetailText(method: OrganizerPaymentMethod)'
              if anchor not in s: raise SystemExit('user helper missing')
              helper="function paymentTypeLabel(value: string) { const type=value.toUpperCase(); if(type==='BANK_TRANSFER') return 'Transfer Bank'; if(type==='QRIS') return 'QRIS'; if(type==='VIRTUAL_ACCOUNT') return 'Virtual Account'; if(type==='EWALLET') return 'E-Wallet'; if(type==='MIDTRANS') return 'Pembayaran Otomatis'; if(type==='SNAP') return 'Payment Gateway'; return 'Metode Pembayaran'; }\nfunction paymentBankName(method: OrganizerPaymentMethod | null) { return String(method?.details?.bank_name ?? '').trim(); }\nfunction paymentAccountNumber(method: OrganizerPaymentMethod | null) { return String(method?.details?.account_number ?? '').trim(); }\nfunction paymentAccountName(method: OrganizerPaymentMethod | null) { return String(method?.details?.account_name ?? '').trim(); }\n"
              s=s.replace(anchor,helper+anchor,1)
          # Normalize exactly one current proof-rule line, regardless of its old exclusions.
          s=re.sub(r"\n\s*const selectedMethodNeedsProof\s*=.*?;", "\n  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(selectedMethod.payment_type).toUpperCase());", s, count=1)
          if 'const selectedMethodNeedsProof' not in s: raise SystemExit('proof rule missing')
          if 'const selectedRandomEnabled' not in s:
              s=s.replace("  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(selectedMethod.payment_type).toUpperCase());", "  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(selectedMethod.payment_type).toUpperCase());\n  const selectedRandomEnabled = !!selectedMethod && String(selectedMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(selectedMethod.details?.random_code_enabled) && selectedTotal > 0;\n  const paymentRandomCode = selectedRandomEnabled ? Number(contactFields.__payment_random_code || 0) : 0;\n  const paymentTransferTotal = selectedTotal + paymentRandomCode;",1)
          open_marker="const initial: Record<string, string> = {}; paymentFields.forEach((field) => { initial[field.field_key] = ''; });"
          if open_marker not in s: raise SystemExit('openPayment marker missing')
          if 'initial.__payment_random_code' not in s:
              s=s.replace(open_marker, open_marker+" const firstMethod = paymentMethods[0] ?? null; if (firstMethod && String(firstMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(firstMethod.details?.random_code_enabled)) initial.__payment_random_code = String(Math.floor(Math.random() * 900) + 100);",1)
          # Replace method selector block based on explicit order marker.
          start=s.find('{paymentMethods.length > 0 && <div className="order-3 mt-5">')
          end=s.find('{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5',start)
          if start<0 or end<0: raise SystemExit('payment selector bounds missing')
          selector='''{paymentMethods.length > 0 && <div className="order-3 mt-5"><p className="text-xs font-semibold text-fg-muted">Metode pembayaran</p><div className="mt-2 space-y-2">{paymentMethods.map((method) => <button key={method.id} type="button" onClick={() => { setSelectedPaymentMethodId(method.id); setContactFields((current) => ({ ...current, __payment_random_code: String(method.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(method.details?.random_code_enabled) && selectedTotal > 0 ? String(Math.floor(Math.random() * 900) + 100) : '' })); }} className={`w-full rounded-2xl border p-4 text-left transition ${selectedPaymentMethodId === method.id ? 'border-accent bg-accent/5' : 'border-surface-border bg-surface-elevated/25 hover:bg-surface-elevated/50'}`}><div className="flex items-start justify-between gap-3"><div className="min-w-0 flex-1"><p className="text-sm font-bold text-fg">{paymentTypeLabel(method.payment_type)}{paymentBankName(method) ? ` · ${paymentBankName(method)}` : ''}</p>{paymentAccountNumber(method) && <div className="mt-3 rounded-xl border border-surface-border bg-surface-elevated/35 p-3"><div className="flex items-center justify-between gap-2"><span className="text-[10px] font-semibold uppercase tracking-wider text-fg-muted">Nomor Rekening</span><button type="button" onClick={(e) => { e.stopPropagation(); navigator.clipboard.writeText(paymentAccountNumber(method)).then(() => toast.success('Nomor rekening disalin.')).catch(() => toast.error('Nomor rekening tidak dapat disalin.')); }} className="inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs font-semibold text-accent hover:bg-accent/10"><Copy size={13}/> Salin</button></div><p className="mt-1 text-3xl font-black tracking-wider text-fg">{paymentAccountNumber(method)}</p>{paymentAccountName(method) && <p className="mt-1 text-xs text-fg-muted">a.n. {paymentAccountName(method)}</p>}</div>}</div>{selectedPaymentMethodId === method.id && <CheckCircle2 size={17} className="mt-1 shrink-0 text-accent"/>}</div></button>)}</div></div>}
        '''
          s=s[:start]+selector+s[end:]
          # Replace uploader block, which is bounded by paymentFields after it.
          up_start=s.find('{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5')
          up_end=s.find('{paymentFields.filter',up_start)
          if up_start<0 or up_end<0: raise SystemExit('upload bounds missing')
          upload='''{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5 overflow-hidden rounded-2xl border-2 border-accent/40 bg-accent/5"><div className="p-5"><div className="flex items-start gap-3"><div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-accent/10"><UploadCloud size={21} className="text-accent"/></div><div><p className="text-base font-bold text-fg">Upload Bukti Transfer</p><p className="mt-1 text-xs leading-5 text-fg-muted">Unggah bukti pembayaran setelah transfer.</p></div></div><Button className="mt-4 w-full" onClick={() => proofInputRef.current?.click()} icon={<UploadCloud size={15}/>}>{proofFile ? 'Ganti Bukti Transfer' : 'Pilih Bukti Transfer'}</Button><input ref={proofInputRef} className="hidden" type="file" accept="image/png,image/jpeg,image/webp" onChange={(e) => chooseProof(e.target.files?.[0])}/>{proofFile && <div className="mt-3 flex items-center gap-3 rounded-xl border border-surface-border bg-surface-elevated/35 p-3"><div className="min-w-0 flex-1"><p className="truncate text-xs font-semibold text-fg">{proofFile.name}</p><p className="mt-1 text-[10px] text-fg-muted">Bukti pembayaran siap dikirim.</p></div><button type="button" onClick={removeProof} className="rounded-lg p-2 text-red-400 hover:bg-red-500/10"><X size={15}/></button></div>}{proofPreviewUrl && <div className="relative mt-3 overflow-hidden rounded-2xl border border-surface-border bg-black/20"><img src={proofPreviewUrl} alt="Preview bukti transfer" className="max-h-64 w-full object-contain"/></div>}</div></div>}
        '''
          s=s[:up_start]+upload+s[up_end:]
          p.write_text(s)

          # Admin payment setup: no visible method name/instructions, friendly type, random toggle.
          p=Path('src/pages/AdminPlanUsagePageV2.tsx'); a=p.read_text()
          a=re.sub(r'type NewPaymentMethod = \{[^}]+\};', "type NewPaymentMethod = { name: string; paymentType: string; bankName: string; accountNumber: string; accountName: string; instructions: string; randomCodeEnabled: boolean };", a, count=1)
          a=re.sub(r'const emptyMethod: NewPaymentMethod = \{[^}]+\};', "const emptyMethod: NewPaymentMethod = { name: '', paymentType: 'BANK_TRANSFER', bankName: '', accountNumber: '', accountName: '', instructions: '', randomCodeEnabled: false };", a, count=1)
          if 'function paymentTypeLabel(value: string)' not in a:
              a=a.replace('function methodMeta(method: OrganizerPaymentMethod) {', "function paymentTypeLabel(value: string) { const type=value.toUpperCase(); if(type==='BANK_TRANSFER') return 'Transfer Bank'; if(type==='QRIS') return 'QRIS'; if(type==='VIRTUAL_ACCOUNT') return 'Virtual Account'; if(type==='EWALLET') return 'E-Wallet'; if(type==='MIDTRANS') return 'Pembayaran Otomatis'; if(type==='SNAP') return 'Payment Gateway'; return 'Metode Pembayaran'; }\nfunction methodMeta(method: OrganizerPaymentMethod) {",1)
          a=re.sub(r'function methodMeta\(method: OrganizerPaymentMethod\) \{.*?\}\n', "function methodMeta(method: OrganizerPaymentMethod) { return { bankName: String(method.details?.bank_name ?? ''), accountNumber: String(method.details?.account_number ?? ''), accountName: String(method.details?.account_name ?? ''), randomCodeEnabled: Boolean(method.details?.random_code_enabled) }; }\n", a, count=1, flags=re.S)
          start=a.find('  const addMethod = async () =>'); end=a.find('  const deleteMethod = async',start)
          if start<0 or end<0: raise SystemExit('admin addMethod missing')
          a=a[:start]+"  const addMethod = async () => { const type = newMethod.paymentType.trim().toUpperCase(); if (!type) { toast('Jenis pembayaran wajib dipilih.', 'error'); return; } if (!newMethod.bankName.trim() || !newMethod.accountNumber.trim() || !newMethod.accountName.trim()) { toast('Nama bank, nomor rekening, dan atas nama rekening wajib diisi.', 'error'); return; } setBusy(true); try { const details = { bank_name: newMethod.bankName.trim(), account_number: newMethod.accountNumber.trim(), account_name: newMethod.accountName.trim(), random_code_enabled: type === 'BANK_TRANSFER' && newMethod.randomCodeEnabled }; const created = await adminCreateOrganizerPaymentMethod({ name: paymentTypeLabel(type), paymentType: type, details, sortOrder: paymentMethods.length + 1 }); setPaymentMethods((current) => [...current, created]); setNewMethod(emptyMethod); setShowMethodForm(false); toast('Metode pembayaran ditambahkan.', 'success'); } catch (e: any) { toast(e?.message || 'Gagal menambah metode pembayaran.', 'error'); } finally { setBusy(false); } };\n"+a[end:]
          a=re.sub(r'<label className="text-xs font-medium text-fg-muted">Nama metode.*?</label>', '', a, count=1, flags=re.S)
          a=re.sub(r'<label className="block text-xs font-medium text-fg-muted">Instruksi untuk organizer.*?</label>', '', a, count=1, flags=re.S)
          save='<Button fullWidth disabled={busy} onClick={() => void addMethod()} icon={<Plus size={15}/>}>Simpan Metode Pembayaran</Button>'
          if 'checked={newMethod.randomCodeEnabled}' not in a:
              toggle='<label className="flex items-start gap-3 rounded-xl border border-accent/20 bg-accent/5 p-3 text-sm text-fg"><input type="checkbox" className="mt-0.5" checked={newMethod.randomCodeEnabled} onChange={(e) => setNewMethod((v) => ({ ...v, randomCodeEnabled: e.target.checked }))}/><span><strong className="block">Random 3 digit</strong><span className="text-xs text-fg-muted">Tambahkan kode unik 3 digit pada nominal Transfer Bank.</span></span></label>'
              a=a.replace(save,toggle+save,1)
          a=a.replace('<span className="rounded-full bg-surface-elevated px-2.5 py-1 text-[9px] font-bold uppercase tracking-wider text-fg-muted">{method.payment_type}</span>', '<span className="rounded-full bg-surface-elevated px-2.5 py-1 text-[9px] font-bold tracking-wider text-fg-muted">{paymentTypeLabel(method.payment_type)}</span>')
          a=a.replace('{paymentDetail(method) && <p className="mt-3 whitespace-pre-wrap rounded-xl border border-surface-border bg-surface-elevated/30 p-3 text-xs leading-5 text-fg-muted">{paymentDetail(method)}</p>}', '')
          p.write_text(a)
          PY
          npm ci --silent
          npm run lint
          npx tsc -p tsconfig.app.json --noEmit
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OrganizerPlanPageV2.tsx src/pages/AdminPlanUsagePageV2.tsx
          git diff --cached --check
          git commit -m "feat(payment): v6 final"
          git rm .github/workflows/payment-flow-v6.yml
          git commit -m "chore: remove payment flow v6 patch"
          git push