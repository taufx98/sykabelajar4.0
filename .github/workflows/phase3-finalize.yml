name: Phase 3 Finalize

on:
  push:
    branches: [main]

jobs:
  finalize:
    if: github.event.head_commit.message == 'chore: phase3 runner'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Remove legacy organizer route and page
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace("import { OrganizerPage } from '@/pages/OrganizerPage';\n", '')
          s = s.replace('<Route path="/organizer/legacy" element={<OrganizerShellRoute><OrganizerPage /></OrganizerShellRoute>} />', '')
          p.write_text(s)
          Path('src/pages/OrganizerPage.tsx').unlink()
      - name: Clean legacy Vite favicon reference
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text().replace('<link rel="icon" type="image/svg+xml" href="/vite.svg" />', '<link rel="icon" type="image/svg+xml" href="/favicon.svg" />')
          p.write_text(s)
      - name: Add project favicon
        run: |
          mkdir -p public
          cat > public/favicon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="16" fill="#0b1220"/>
            <path d="M17 17h30v8H25v7h18v8H25v7h22v8H17z" fill="#65d26e"/>
            <circle cx="46" cy="21" r="4" fill="#d7f9db"/>
          </svg>
          SVG
      - name: Remove obviously obsolete Phase 1 eslint comments
        shell: python
        run: |
          from pathlib import Path
          p = Path('eslint.config.js')
          s = p.read_text()
          s = s.replace("      // These two files currently contain legacy conditional-hook patterns.\n      // Keep them visible but do not block the repository-wide lint gate until\n      // their behavior-preserving hook refactor is completed.\n", "")
          p.write_text(s)
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_CLOUDINARY_PROFILE_PRESET: ${{ secrets.VITE_CLOUDINARY_PROFILE_PRESET }}
          VITE_EDGE_FUNCTION_URL: ${{ secrets.VITE_EDGE_FUNCTION_URL }}
      - name: Production smoke test
        run: node scripts/rpd-smoke.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Audit legacy route and static references
        run: |
          ! grep -R -n "organizer/legacy\|OrganizerPage" src index.html
          test -f public/favicon.svg
          ! grep -R -n "/vite.svg" src index.html public || true
          echo '--- tracked public assets ---'
          find public -maxdepth 2 -type f | sort
          echo '--- lint warnings summary ---'
          npm run lint 2>&1 | tee /tmp/lint.log || true
          echo "warnings=$(grep -c 'warning' /tmp/lint.log || true)"
          echo '--- build output ---'
          du -sh dist
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .github/workflows/phase3-finalize.yml
          git commit -m 'refactor(phase3): remove legacy organizer path and polish assets'
          git push origin HEAD:main
