name: Supabase Local Auth Claims CI

on:
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - "services/auth-worker/supabase-test/**"
      - "scripts/auth-migration/**"
      - "supabase/functions/_shared/**"
      - "supabase/functions/get-cloudinary-signature/**"
      - "supabase/functions/cloudinary-delete-asset/**"
      - "supabase/functions/cloudinary-profile-upload/**"
      - "supabase/functions/cloudinary-delete-profile/**"
      - "supabase/functions/payment-gateway-admin/**"
      - "supabase/functions/payment-gateway-create/**"
      - "supabase/functions/payment-gateway-reconcile/**"
      - "supabase/functions/midtrans-create-payment/**"
      - "supabase/functions/payment-gateway-webhook/**"
      - "supabase/functions/_shared/cloudinary-ownership.mjs"
      - "supabase/config.toml"
      - ".github/workflows/auth-supabase-local-ci.yml"
  pull_request:
    paths:
      - "services/auth-worker/supabase-test/**"
      - "scripts/auth-migration/**"
      - "supabase/functions/_shared/**"
      - "supabase/functions/get-cloudinary-signature/**"
      - "supabase/functions/payment-gateway-admin/**"
      - "supabase/functions/payment-gateway-create/**"
      - "supabase/functions/payment-gateway-reconcile/**"
      - "supabase/functions/midtrans-create-payment/**"
      - "supabase/functions/payment-gateway-webhook/**"
      - "supabase/config.toml"
      - ".github/workflows/auth-supabase-local-ci.yml"

permissions:
  contents: read

concurrency:
  group: supabase-local-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-auth-claims:
    name: Local Supabase JWT claims and RLS contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/auth-worker/supabase-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate schema-only baseline exporter
        run: |
          bash -n ../../../scripts/auth-migration/export-schema-baseline.sh
          node ../../../scripts/auth-migration/export-schema-baseline.contract.test.mjs
          node ../../../scripts/auth-migration/verify-restored-auth-fk-catalog.test.mjs
          node ../../../scripts/auth-migration/verify-stage3-baseline-metadata.test.mjs
          node ../../../scripts/auth-migration/generate-stage3-function-acl-restore.test.mjs
          node ../../../scripts/auth-migration/create-organizer-ambiguity-fix.test.mjs
          node ../../../scripts/auth-migration/stage3-production-schema-regression.contract.test.mjs
          bash -n ../../../scripts/auth-migration/export-live-auth-users-fk-plan.sh
          node ../../../scripts/auth-migration/export-live-auth-users-fk-plan.contract.test.mjs

      - name: Verify Better Auth Edge JWT adapter and webhook boundaries
        run: node ../../../scripts/auth-migration/edge-auth-claims.test.mjs

      - name: Verify Cloudinary asset ownership boundaries
        run: node ../../../scripts/auth-migration/cloudinary-ownership.test.mjs

      - name: Verify frontend Supabase Auth dependency inventory
        run: node ../../../scripts/auth-migration/frontend-auth-inventory.test.mjs

      - name: Verify disabled Better Auth frontend transport boundary
        run: node ../../../scripts/auth-migration/better-auth-frontend-client.test.mjs

      - name: Set up pinned Deno for Edge Function type-check
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.9.8"
          cache: false

      - name: Type-check Supabase Edge JWT and Cloudinary endpoints
        run: |
          deno check --node-modules-dir=auto --lock "$RUNNER_TEMP/auth-edge-deno.lock" \
            ../../../supabase/functions/_shared/better-auth-user.ts
          deno check --node-modules-dir=auto --lock "$RUNNER_TEMP/auth-edge-deno.lock" \
            ../../../supabase/functions/get-cloudinary-signature/index.ts
          deno check --node-modules-dir=auto --lock "$RUNNER_TEMP/auth-edge-deno.lock" \
            ../../../supabase/functions/cloudinary-delete-asset/index.ts
          deno check --node-modules-dir=auto --lock "$RUNNER_TEMP/auth-edge-deno.lock" \
            ../../../supabase/functions/cloudinary-profile-upload/index.ts
          deno check --node-modules-dir=auto --lock "$RUNNER_TEMP/auth-edge-deno.lock" \
            ../../../supabase/functions/cloudinary-delete-profile/index.ts
          deno check --node-modules-dir=auto --lock "$RUNNER_TEMP/auth-edge-deno.lock" \
            ../../../supabase/functions/payment-gateway-admin/index.ts
          deno check --node-modules-dir=auto --lock "$RUNNER_TEMP/auth-edge-deno.lock" \
            ../../../supabase/functions/payment-gateway-create/index.ts
          deno check --node-modules-dir=auto --lock "$RUNNER_TEMP/auth-edge-deno.lock" \
            ../../../supabase/functions/payment-gateway-reconcile/index.ts
          deno check --node-modules-dir=auto --lock "$RUNNER_TEMP/auth-edge-deno.lock" \
            supabase/functions/better-auth-oidc-acceptance/index.ts

      - name: Verify deployed staging OIDC Edge probe rejects anonymous requests
        env:
          STAGING_SUPABASE_URL: https://ydamszdfsxqisanazdkb.supabase.co
          STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4GjRAXld9GnxYf2pJBPrTQ_Pqh_QI4v
        run: |
          set -euo pipefail
          test "$STAGING_SUPABASE_URL" = "https://ydamszdfsxqisanazdkb.supabase.co" || {
            echo "Blocked: this check may only call the isolated Free staging project." >&2
            exit 1
          }
          test "$STAGING_SUPABASE_PUBLISHABLE_KEY" = "sb_publishable_4GjRAXld9GnxYf2pJBPrTQ_Pqh_QI4v" || {
            echo "Blocked: unexpected staging publishable key." >&2
            exit 1
          }
          response_body="$RUNNER_TEMP/staging-oidc-probe-anonymous.json"
          status="$(curl --silent --show-error --max-time 15 --output "$response_body" --write-out '%{http_code}' \
            --request POST "$STAGING_SUPABASE_URL/functions/v1/better-auth-oidc-acceptance" \
            --header "apikey: $STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}')"
          if [ "$status" != "401" ]; then
            echo "Staging OIDC Edge probe must reject missing user credentials (expected HTTP 401, received $status)." >&2
            cat "$response_body"
            exit 1
          fi
          jq -e '.error == "AUTH_REQUIRED"' "$response_body" >/dev/null
          echo "Hosted staging Edge probe rejects anonymous requests with AUTH_REQUIRED."

      - name: Validate live identity FK snapshot and dry-run plan generator
        run: |
          node ../../../scripts/auth-migration/generate-app-users-fk-plan.test.mjs
          PLAN_DIR="$(mktemp -d)"
          trap 'rm -rf "$PLAN_DIR"' EXIT
          node ../../../scripts/auth-migration/generate-app-users-fk-plan.mjs \
            --catalog ../../../scripts/auth-migration/live-auth-users-fk-catalog.json \
            --out-dir "$PLAN_DIR"
          test -s "$PLAN_DIR/01-preflight-expand.sql"
          test -s "$PLAN_DIR/02-validate.sql"
          test -s "$PLAN_DIR/03-cutover.sql"

      - name: Setup Supabase CLI
        id: setup_supabase_cli
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Start isolated local Supabase
        run: supabase start

      - name: Verify JWT sub and ownership RLS
        run: supabase test db --local

      - name: Stop local Supabase
        if: always() && steps.setup_supabase_cli.outcome == 'success'
        run: supabase stop
