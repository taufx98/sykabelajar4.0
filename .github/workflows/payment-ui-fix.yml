name: Payment UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch checkout UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()

          state = "  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(selectedMethod.payment_type).toUpperCase());\n"
          if state not in s:
              raise SystemExit('selectedMethodNeedsProof target missing')
          if 'const showProofUpload' not in s:
              s = s.replace(state, state + "  const hasManualPaymentMethod = paymentMethods.some((method) => !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(method.payment_type).toUpperCase()));\n  const showProofUpload = selectedTotal > 0 && (selectedMethodNeedsProof || (!selectedMethod && hasManualPaymentMethod));\n", 1)

          if 'max-w-2xl max-h-[92vh]' not in s:
              raise SystemExit('modal sizing target missing')
          s = s.replace('max-w-2xl max-h-[92vh]', 'max-w-xl max-h-[84vh]', 1)
          s = s.replace('bg-black/75 p-4"><div className="flex w-full', 'bg-black/75 p-3 sm:p-4"><div className="flex w-full', 1)

          render_pos = s.find('return <div')
          if render_pos < 0:
              raise SystemExit('render root missing')
          tail = s[render_pos:]
          old_condition = 'selectedTotal > 0 && selectedMethodNeedsProof &&'
          if old_condition not in tail:
              raise SystemExit('upload render condition target missing')
          tail = tail.replace(old_condition, 'showProofUpload &&', 1)
          tail = tail.replace('font-mono text-sm font-bold tracking-wide text-fg', 'font-mono text-lg font-black tracking-wider text-fg sm:text-xl', 1)
          tail = tail.replace('text-xs text-fg-muted">a.n. {accountName}', 'text-sm font-semibold text-fg-muted sm:text-base">a.n. {accountName}', 1)
          s = s[:render_pos] + tail

          p.write_text(s)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OrganizerPlanPageV2.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(payment): make proof upload visible"
          git push
