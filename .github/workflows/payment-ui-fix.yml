name: Payment UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch proof upload and account size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()

          if 'const showProofUpload' not in s:
              raise SystemExit('showProofUpload state is missing')

          marker = '{selectedTotal > 0 && selectedMethodNeedsProof && <div'
          if marker not in s:
              raise SystemExit('proof upload JSX condition missing')
          s = s.replace(marker, '{showProofUpload && <div', 1)

          old_num = 'font-mono text-sm font-bold tracking-wide text-fg'
          if old_num in s:
              s = s.replace(old_num, 'font-mono text-lg font-black tracking-wider text-fg sm:text-xl', 1)

          p.write_text(s)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OrganizerPlanPageV2.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(payment): show proof upload and enlarge account details"
          git push
