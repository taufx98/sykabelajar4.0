name: Payment UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch checkout UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()

          old = "  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(selectedMethod.payment_type).toUpperCase());\n"
          if old not in s:
              raise SystemExit('state target missing')
          if 'const showProofUpload' not in s:
              s = s.replace(old, old + "  const hasManualPaymentMethod = paymentMethods.some((method) => !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(method.payment_type).toUpperCase()));\n  const showProofUpload = selectedTotal > 0 && (selectedMethodNeedsProof || (!selectedMethod && hasManualPaymentMethod));\n", 1)

          old_modal = "max-w-2xl max-h-[92vh] flex-col overflow-auto rounded-3xl border border-surface-border bg-surface p-5 shadow-2xl md:p-6"
          new_modal = "max-w-xl max-h-[84vh] flex-col overflow-auto rounded-3xl border border-surface-border bg-surface p-4 shadow-2xl sm:p-5"
          if old_modal not in s:
              raise SystemExit('modal target missing')
          s = s.replace(old_modal, new_modal, 1)
          s = s.replace('bg-black/75 p-4"><div className="flex w-full', 'bg-black/75 p-3 sm:p-4"><div className="flex w-full', 1)

          old_condition = '{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4'
          if old_condition not in s:
              raise SystemExit('upload condition target missing')
          s = s.replace(old_condition, '{showProofUpload && <div className="order-4', 1)

          old_num = 'font-mono text-sm tracking-wide text-fg'
          if old_num in s:
              s = s.replace(old_num, 'font-mono text-lg font-black tracking-wider text-fg sm:text-xl', 1)
          old_name = 'text-xs text-fg-muted">a.n. {accountName}'
          if old_name in s:
              s = s.replace(old_name, 'text-sm font-semibold text-fg-muted sm:text-base">a.n. {accountName}', 1)

          p.write_text(s)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OrganizerPlanPageV2.tsx
          git commit -m "fix(payment): tighten organizer checkout UI" || exit 0
          git push
