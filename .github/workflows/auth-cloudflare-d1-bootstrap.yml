name: Auth Cloudflare D1 Staging Bootstrap

on:
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - ".github/workflows/auth-cloudflare-d1-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-cloudflare-d1-bootstrap
  cancel-in-progress: false

jobs:
  provision:
    if: ${{ github.ref_name == 'security/auth-poc-stage-1' }}
    name: Create or verify isolated Better Auth D1 database
    runs-on: ubuntu-latest
    steps:
      - name: Provision only the dedicated staging D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret." >&2; exit 1; }

          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const databaseName = "sykabelajar-auth-poc";
          const base = "https://api.cloudflare.com/client/v4/accounts/" + encodeURIComponent(accountId);
          const headers = {
            Authorization: "Bearer " + token,
            Accept: "application/json",
            "Content-Type": "application/json",
          };

          async function call(path, method = "GET", body) {
            const response = await fetch(base + path, {
              method,
              headers,
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            const payload = await response.json().catch(() => ({}));
            return { ok: response.ok && payload.success === true, status: response.status, payload };
          }

          const listed = await call("/d1/database?per_page=100");
          if (!listed.ok || !Array.isArray(listed.payload.result)) {
            const errors = (listed.payload.errors ?? []).map((item) => ({
              code: item.code,
              message: String(item.message ?? "").slice(0, 180),
            }));
            console.error(JSON.stringify({ step: "list-d1", status: listed.status, errors }));
            process.exit(1);
          }

          const databases = listed.payload.result;
          const existing = databases.find((item) => item.name === databaseName);
          if (existing) {
            if (!existing.uuid) {
              console.error("The dedicated D1 database exists but its UUID was not returned.");
              process.exit(1);
            }
            console.log(JSON.stringify({
              status: "already_exists",
              name: databaseName,
              uuid: existing.uuid,
              totalD1Databases: databases.length,
            }, null, 2));
            process.exit(0);
          }

          // Keep the account within the documented Workers Free database cap.
          if (databases.length >= 10) {
            console.error(JSON.stringify({
              status: "blocked_free_limit",
              totalD1Databases: databases.length,
              message: "No database was created. The account already has 10 or more D1 databases; review usage/plan before proceeding.",
            }, null, 2));
            process.exit(1);
          }

          // D1 Write permission is required by Cloudflare's create-database API.
          // The new database is isolated, empty, and placed near the Asia-Pacific region.
          const created = await call("/d1/database", "POST", {
            name: databaseName,
            primary_location_hint: "apac",
            read_replication: { mode: "disabled" },
          });
          const row = created.payload.result;
          if (!created.ok || !row?.uuid) {
            const errors = (created.payload.errors ?? []).map((item) => ({
              code: item.code,
              message: String(item.message ?? "").slice(0, 180),
            }));
            console.error(JSON.stringify({
              step: "create-d1",
              status: created.status,
              errors,
              message: "No deploy or production change was attempted. Verify the API token has Account D1 Write permission.",
            }, null, 2));
            process.exit(1);
          }

          console.log(JSON.stringify({
            status: "created",
            name: row.name ?? databaseName,
            uuid: row.uuid,
            primaryLocationHint: "apac",
            readReplication: "disabled",
            totalD1DatabasesAfterCreate: databases.length + 1,
          }, null, 2));
          NODE
