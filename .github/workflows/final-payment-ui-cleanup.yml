name: Final payment UI cleanup
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clean payment UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------- User checkout ----------
          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()
          # Avoid invalid nested interactive elements: copy control is a button-like span inside the selectable card.
          s = s.replace('<button type="button" className="rounded-lg border border-surface-border p-1.5 text-fg-muted hover:text-fg" onClick={(event) => { event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); }} aria-label="Salin nomor rekening"><Copy size={14}/></button>', '<span role="button" tabIndex={0} className="cursor-pointer rounded-lg border border-surface-border p-1.5 text-fg-muted hover:text-fg" onClick={(event) => { event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); }} onKeyDown={(event) => { if (event.key === \'Enter\' || event.key === \' \') { event.preventDefault(); event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); } }} aria-label="Salin nomor rekening"><Copy size={14}/></span>', 1)
          p.write_text(s)

          # ---------- Admin payment methods ----------
          p = Path('src/pages/AdminPlanUsagePageV2.tsx')
          s = p.read_text()
          s = s.replace("type NewPaymentMethod = { name: string; paymentType: string; bankName: string; accountNumber: string; accountName: string; instructions: string; randomCodeEnabled: boolean };", "type NewPaymentMethod = { name: string; paymentType: string; bankName: string; accountNumber: string; accountName: string; instructions: string; randomCodeEnabled: boolean };")
          # Replace addMethod so bank fields are required only for manual bank transfer.
          start = s.find('  const addMethod = async () =>')
          end = s.find('  const deleteMethod = async', start)
          if start < 0 or end < 0: raise SystemExit('admin addMethod block missing')
          add = """  const addMethod = async () => { const type = newMethod.paymentType.trim().toUpperCase(); if (!type) { toast('Jenis pembayaran wajib dipilih.', 'error'); return; } if (type === 'BANK_TRANSFER' && (!newMethod.bankName.trim() || !newMethod.accountNumber.trim() || !newMethod.accountName.trim())) { toast('Nama bank, nomor rekening, dan atas nama rekening wajib diisi untuk transfer bank.', 'error'); return; } setBusy(true); try { const details = { bank_name: newMethod.bankName.trim() || null, account_number: newMethod.accountNumber.trim() || null, account_name: newMethod.accountName.trim() || null, random_code_enabled: type === 'BANK_TRANSFER' && newMethod.randomCodeEnabled }; const created = await adminCreateOrganizerPaymentMethod({ name: paymentTypeLabel(type), paymentType: type, details, sortOrder: paymentMethods.length + 1 }); setPaymentMethods((current) => [...current, created]); setNewMethod(emptyMethod); setShowMethodForm(false); toast('Metode pembayaran ditambahkan.', 'success'); } catch (e: any) { toast(e?.message || 'Gagal menambah metode pembayaran.', 'error'); } finally { setBusy(false); } };
"""
          s = s[:start] + add + s[end:]
          # Remove visible legacy fields/messages that conflict with the agreed admin form.
          s = re.sub(r'<label className="block text-xs font-medium text-fg-muted">Nama metode.*?</label>', '', s, count=1, flags=re.S)
          s = re.sub(r'<div className="rounded-xl border border-surface-border bg-surface-elevated/30 p-3 text-xs leading-5 text-fg-muted">Detail khusus metode ini.*?</div>', '', s, count=1, flags=re.S)
          # Make the form labels exactly match the agreed terminology.
          s = s.replace('Atas nama<input', 'Atas nama rekening<input', 1)
          # Random code is meaningful only for BANK_TRANSFER.
          s = s.replace('checked={newMethod.randomCodeEnabled} onChange={(e) => setNewMethod((v) => ({ ...v, randomCodeEnabled: e.target.checked }))}', 'checked={newMethod.randomCodeEnabled} disabled={newMethod.paymentType !== \'BANK_TRANSFER\'} onChange={(e) => setNewMethod((v) => ({ ...v, randomCodeEnabled: e.target.checked }))}', 1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OrganizerPlanPageV2.tsx src/pages/AdminPlanUsagePageV2.tsx
          git commit -m "fix(payment): align checkout and admin payment UI"
          git rm .github/workflows/final-payment-ui-cleanup.yml .github/workflows/debug-payment-ui.yml
          git commit -m "chore(ci): remove payment debug workflows"
          git push
