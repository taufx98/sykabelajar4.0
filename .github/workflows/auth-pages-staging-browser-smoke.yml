name: Better Auth staging browser smoke

on:
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - ".github/workflows/auth-pages-staging-browser-smoke.yml"
      - ".github/auth-ops/RUN-AUTH-STAGING-BROWSER-SMOKE-0001"
      - "e2e/staging/login-smoke.spec.ts"
      - "playwright.staging.config.ts"
      - "src/components/admin/BetterAuthAcceptancePanel.tsx"
      - "src/pages/LoginPage.tsx"
  pull_request:
    branches:
      - security/auth-migration-phase-0
    paths:
      - ".github/workflows/auth-pages-staging-browser-smoke.yml"
      - ".github/auth-ops/RUN-AUTH-STAGING-BROWSER-SMOKE-0001"
      - "e2e/staging/login-smoke.spec.ts"
      - "playwright.staging.config.ts"
      - "src/components/admin/BetterAuthAcceptancePanel.tsx"
      - "src/pages/LoginPage.tsx"
  workflow_dispatch: {}

permissions:
  contents: read
  checks: read

concurrency:
  group: auth-staging-browser-smoke
  cancel-in-progress: false

jobs:
  browser-smoke:
    if: ${{ github.ref == 'refs/heads/security/auth-poc-stage-1' || github.event.pull_request.head.ref == 'security/auth-poc-stage-1' }}
    name: Verify the deployed staging login page renders
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@v4
        with:
          ref: security/auth-poc-stage-1
          fetch-depth: 2

      - name: Read staging Pages auth configuration without exposing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error("Cloudflare read-only Pages credentials are unavailable.");
          const base = "https://api.cloudflare.com/client/v4";
          const headers = { Authorization: "Bearer " + token, Accept: "application/json" };
          async function get(path) {
            const response = await fetch(base + path, { headers });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success !== true) {
              throw new Error("Cloudflare Pages read-only inspection failed (HTTP " + response.status + ").");
            }
            return payload.result;
          }
          const projects = await get("/accounts/" + encodeURIComponent(accountId) + "/pages/projects");
          const matches = Array.isArray(projects) ? projects.filter((item) =>
            item?.subdomain === "sykabelajar4.pages.dev" &&
            item?.source?.config?.owner === "taufx98" &&
            item?.source?.config?.repo_name === "sykabelajar4.0"
          ) : [];
          if (matches.length !== 1) throw new Error("Expected exactly one reviewed SYKABELAJAR Pages project.");
          const project = await get("/accounts/" + encodeURIComponent(accountId) + "/pages/projects/" + encodeURIComponent(matches[0].name));
          const envVars = project?.deployment_configs?.preview?.env_vars ?? {};
          function value(name) {
            const item = envVars[name];
            return typeof item === "string" ? item : typeof item?.value === "string" ? item.value : "";
          }
          function hostOf(input) {
            try { const url = new URL(input); return url.protocol === "https:" ? url.hostname.toLowerCase() : ""; }
            catch { return ""; }
          }
          const checks = {
            frontendFlagEnabled: value("VITE_BETTER_AUTH_FRONTEND_ENABLED").trim().toLowerCase() === "true",
            workerIssuerCorrect: hostOf(value("VITE_AUTH_WORKER_URL")) === "auth.sykabelajar.my.id",
            isolatedStagingSupabaseCorrect: hostOf(value("VITE_BETTER_AUTH_SUPABASE_URL")) === "ydamszdfsxqisanazdkb.supabase.co",
            stagingPublishableKeyConfigured: value("VITE_BETTER_AUTH_SUPABASE_PUBLISHABLE_KEY").startsWith("sb_publishable_"),
            stagingDomainAttached: Array.isArray(project.domains) && project.domains.includes("staging.sykabelajar.my.id"),
          };
          console.log("Staging Pages Better Auth readiness (values and credentials withheld): " + JSON.stringify(checks));
          console.log("betterAuthFrontendReady=" + Object.values(checks).every(Boolean));
          NODE

      - name: Detect whether the latest commit changes frontend browser-smoke inputs
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if printf '%s\n' "$changed_files" | grep -Eq '^(src/|e2e/staging/login-smoke\.spec\.ts$|playwright\.staging\.config\.ts$)'; then
            echo "run_browser=true" >> "$GITHUB_OUTPUT"
            echo "Frontend files changed; browser smoke will run."
          else
            echo "run_browser=false" >> "$GITHUB_OUTPUT"
            echo "No frontend browser-smoke inputs changed in this commit; deployment wait and browser smoke are skipped."
          fi

      - name: Wait for the matching Cloudflare Pages deployment
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: "Bearer " + process.env.GH_TOKEN,
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const endpoint = `https://api.github.com/repos/${process.env.REPOSITORY}/commits/${process.env.COMMIT_SHA}/check-runs?per_page=100`;
          for (let attempt = 0; attempt < 36; attempt += 1) {
            const response = await fetch(endpoint, { headers });
            if (!response.ok) {
              throw new Error(`Cannot verify Pages deployment check (HTTP ${response.status}).`);
            }
            const payload = await response.json();
            const check = (payload.check_runs ?? []).find((item) => item.name === "Cloudflare Pages");
            if (check?.status === "completed") {
              if (check.conclusion !== "success") {
                throw new Error("Cloudflare Pages did not successfully deploy this exact staging commit.");
              }
              console.log("Cloudflare Pages deployment completed successfully for the exact tested commit.");
              process.exit(0);
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          throw new Error("Timed out waiting for the matching Cloudflare Pages deployment check.");
          NODE

      - name: Set up Node.js
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser-test dependencies without changing the lockfile
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: Verify staging login route in a real browser
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        env:
          AUTH_STAGING_BASE_URL: https://staging.sykabelajar.my.id
        run: npx playwright test --config=playwright.staging.config.ts

      - name: Upload browser diagnostics only on failure
        if: ${{ steps.scope.outputs.run_browser == 'true' && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: auth-staging-browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
