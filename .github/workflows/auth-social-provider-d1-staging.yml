name: Auth GitHub Social Provider D1 Staging

on:
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - ".github/auth-ops/APPLY-STAGING-D1-0011"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY-GITHUB-SOCIAL-PROVIDER-sykabelajar-auth-poc to extend only the staging provider allowlist"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auth-staging-social-provider-d1
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/security/auth-poc-stage-1' && github.actor == 'taufx98' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/auth-worker
    steps:
      - name: Checkout reviewed staging migration
        uses: actions/checkout@v7
        with:
          ref: security/auth-poc-stage-1

      - name: Verify owner, exact staging target and one-time authorization
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "taufx98"
          test "$GITHUB_REF" = "refs/heads/security/auth-poc-stage-1"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "APPLY-GITHUB-SOCIAL-PROVIDER-sykabelajar-auth-poc"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            marker="../../.github/auth-ops/APPLY-STAGING-D1-0011"
            test -f "$marker"
            test "$(cat "$marker")" = "APPLY-GITHUB-SOCIAL-PROVIDER-sykabelajar-auth-poc"
          else
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync } from "node:fs";
          const migration = readFileSync("migrations/0011_add_github_social_provider.sql");
          const expectedHash = "fc51689b68c4750d1f2e0592c27e4a15e6c3acaab0e89e40e51e63e6890d2d71";
          if (createHash("sha256").update(migration).digest("hex") !== expectedHash) {
            throw new Error("Reviewed GitHub-provider migration hash mismatch.");
          }
          const expected = [
            "0000_auth_worker_internal_config.sql",
            "0001_better_auth.sql",
            "0002_seed_first_party_oauth_client.sql",
            "0003_zeptomail_agent_settings.sql",
            "0004_better_auth_registration_attributes.sql",
            "0005_telegram_phone_verification.sql",
            "0006_transactional_email_provider.sql",
            "0007_managed_social_login_providers.sql",
            "0008_add_staging_oauth_callback.sql",
            "0009_auth_runtime_settings.sql",
            "0010_multi_provider_email_routing.sql",
            "0011_add_github_social_provider.sql",
          ].sort();
          const actual = readdirSync("migrations").filter((name) => name.endsWith(".sql")).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error("The reviewed staging D1 migration set changed.");
          }
          const config = readFileSync("wrangler.toml", "utf8");
          for (const pattern of [
            /^name = "sykabelajar-auth-poc"$/m,
            /^database_name = "sykabelajar-auth-poc"$/m,
            /^database_id = "7a4f9008-a1c6-42b6-8a04-abde12699248"$/m,
            /^migrations_dir = "migrations"$/m,
          ]) if (!pattern.test(config)) throw new Error("Wrong D1 target.");
          console.log("PASS: exact reviewed GitHub migration and staging-only D1 target.");
          NODE

      - name: Install locked dependencies and run Worker contracts
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/auth-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test

      - name: Verify Cloudflare fixed staging D1 UUID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const id = "7a4f9008-a1c6-42b6-8a04-abde12699248";
          const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" +
            encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID) + "/d1/database/" + id, {
              headers: { Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN, Accept: "application/json" },
            });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success !== true || payload.result?.uuid !== id ||
              payload.result?.name !== "sykabelajar-auth-poc") {
            throw new Error("Cloudflare did not confirm the exact isolated staging D1.");
          }
          console.log("PASS: exact staging D1 UUID confirmed.");
          NODE

      - name: Verify migration ledger and preserve existing provider inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT name FROM d1_migrations ORDER BY name;" > "$RUNNER_TEMP/social-migrations-before.json"
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT COUNT(*) AS provider_rows FROM auth_social_provider_settings;" > "$RUNNER_TEMP/social-provider-count-before.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const read = (file) => JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/" + file, "utf8"));
          const names = new Set();
          const visit = (value, cb) => {
            if (Array.isArray(value)) return value.forEach((item) => visit(item, cb));
            if (!value || typeof value !== "object") return;
            cb(value);
            Object.values(value).forEach((item) => { if (item && typeof item === "object") visit(item, cb); });
          };
          visit(read("social-migrations-before.json"), (row) => { if (typeof row.name === "string") names.add(row.name); });
          const expected = [
            "0000_auth_worker_internal_config.sql","0001_better_auth.sql",
            "0002_seed_first_party_oauth_client.sql","0003_zeptomail_agent_settings.sql",
            "0004_better_auth_registration_attributes.sql","0005_telegram_phone_verification.sql",
            "0006_transactional_email_provider.sql","0007_managed_social_login_providers.sql",
            "0008_add_staging_oauth_callback.sql","0009_auth_runtime_settings.sql",
            "0010_multi_provider_email_routing.sql",
          ];
          for (const name of expected) if (!names.has(name)) throw new Error("Required migration missing: " + name);
          if (names.has("0011_add_github_social_provider.sql")) throw new Error("GitHub migration already applied; refusing repeat.");
          if (names.size !== expected.length) throw new Error("Unexpected migration history; refusing remote D1 mutation.");
          let row;
          visit(read("social-provider-count-before.json"), (item) => { if (Object.hasOwn(item,"provider_rows")) row = item; });
          if (!row || !Number.isSafeInteger(Number(row.provider_rows))) throw new Error("Could not safely record existing provider row count.");
          console.log("PASS: migrations 0000–0010 present, 0011 pending, provider rows preserved-count baseline=" + Number(row.provider_rows) + ".");
          NODE

      - name: Apply only reviewed additive migration 0011
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler --config wrangler.toml d1 migrations apply sykabelajar-auth-poc --remote

      - name: Verify GitHub provider allowlist and unchanged provider row count
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT name FROM d1_migrations WHERE name='0011_add_github_social_provider.sql';" > "$RUNNER_TEMP/social-migrations-after.json"
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='auth_social_provider_settings';" > "$RUNNER_TEMP/social-provider-schema.json"
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT COUNT(*) AS provider_rows FROM auth_social_provider_settings;" > "$RUNNER_TEMP/social-provider-count-after.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const read = (file) => JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/" + file, "utf8"));
          const collect = (value, key, rows=[]) => {
            if (Array.isArray(value)) value.forEach((item) => collect(item,key,rows));
            else if (value && typeof value === "object") {
              if (Object.hasOwn(value,key)) rows.push(value[key]);
              Object.values(value).forEach((item) => { if (item && typeof item === "object") collect(item,key,rows); });
            }
            return rows;
          };
          if (collect(read("social-migrations-after.json"),"name").length !== 1) throw new Error("D1 ledger did not record migration 0011.");
          const sql = String(collect(read("social-provider-schema.json"),"sql")[0] ?? "").toLowerCase();
          if (!sql.includes("'github'")) throw new Error("D1 social-provider constraint does not allow GitHub.");
          const before = Number(collect(read("social-provider-count-before.json"),"provider_rows")[0]);
          const after = Number(collect(read("social-provider-count-after.json"),"provider_rows")[0]);
          if (!Number.isSafeInteger(before) || before !== after) throw new Error("Existing provider settings row count changed.");
          console.log("PASS: GitHub is allowed and existing provider settings row count is unchanged (" + after + ").");
          NODE

      - name: Remove temporary verification output
        if: always()
        run: rm -f "$RUNNER_TEMP/social-migrations-before.json" "$RUNNER_TEMP/social-provider-count-before.json" "$RUNNER_TEMP/social-migrations-after.json" "$RUNNER_TEMP/social-provider-schema.json" "$RUNNER_TEMP/social-provider-count-after.json"
