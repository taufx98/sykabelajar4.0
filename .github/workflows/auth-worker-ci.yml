name: Auth Worker CI

on:
  pull_request:
    branches:
      - main
      - security/auth-migration-phase-0
    paths:
      - "services/auth-worker/**"
      - ".github/workflows/auth-worker-ci.yml"
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - "services/auth-worker/**"
      - ".github/workflows/auth-worker-ci.yml"

permissions:
  contents: read

concurrency:
  group: auth-worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, audit, and Worker dry run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/auth-worker/package.json

      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund

      - name: Check dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Security contract tests
        run: npm test

      - name: Bundle Worker without deploying
        run: npm run build
