name: Apply checkout session isolation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ci): apply checkout session isolation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch organizer checkout state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()

          marker = "  const proofInputRef = useRef<HTMLInputElement | null>(null);"
          if 'checkoutSessionRef' not in s:
              assert marker in s
              s = s.replace(marker, marker + "\n  const checkoutSessionRef = useRef(0);\n  const voucherValidationSeqRef = useRef(0);", 1)

          old = "  const selectedMethod = paymentMethods.find((method) => method.id === selectedPaymentMethodId) ?? null;\n  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(selectedMethod.payment_type).toUpperCase());\n  const showProofUpload = selectedTotal > 0 && selectedMethodNeedsProof;"
          new = "  const selectedMethod = paymentMethods.find((method) => method.id === selectedPaymentMethodId) ?? null;\n  const selectedMethodType = String(selectedMethod?.payment_type ?? '').trim().toUpperCase();\n  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(selectedMethodType);\n  const hasManualPaymentMethod = paymentMethods.some((method) => !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(method.payment_type ?? '').trim().toUpperCase()));\n  const showProofUpload = selectedTotal > 0 && (selectedMethodNeedsProof || (!selectedMethod && hasManualPaymentMethod));"
          assert old in s
          s = s.replace(old, new, 1)

          old = "  function openPayment(row: OrganizerPlanCatalogRow) { if (row.plan_code === 'FREE') { toast.info('Paket Gratis tidak memerlukan checkout.'); return; } const initial: Record<string, string> = {};"
          new = "  function openPayment(row: OrganizerPlanCatalogRow) { if (row.plan_code === 'FREE') { toast.info('Paket Gratis tidak memerlukan checkout.'); return; } checkoutSessionRef.current += 1; voucherValidationSeqRef.current += 1; const initial: Record<string, string> = {};"
          assert old in s
          s = s.replace(old, new, 1)

          old = "  function closePayment() { if (sending) return; setPaymentOpen(false); setPaymentPlan(null);"
          new = "  function closePayment() { if (sending) return; checkoutSessionRef.current += 1; voucherValidationSeqRef.current += 1; setPaymentOpen(false); setPaymentPlan(null);"
          assert old in s
          s = s.replace(old, new, 1)

          old = "  async function checkVoucher() { const code = voucherCode.trim().toUpperCase(); if (!code) { setVoucherApplied(null); setVoucherMessage('Masukkan kode voucher terlebih dahulu.'); return; } if (!paymentPlan) return; setVoucherChecking(true); setVoucherApplied(null); setVoucherMessage('Memeriksa voucher…'); try { let result = await validateOrganizerVoucher(code, paymentPlan.plan_code, billing);"
          new = "  async function checkVoucher() { const code = voucherCode.trim().toUpperCase(); if (!code) { voucherValidationSeqRef.current += 1; setVoucherApplied(null); setVoucherMessage('Masukkan kode voucher terlebih dahulu.'); return; } if (!paymentPlan) return; const requestSeq = ++voucherValidationSeqRef.current; const checkoutSession = checkoutSessionRef.current; setVoucherChecking(true); setVoucherApplied(null); setVoucherMessage('Memeriksa voucher…'); try { let result = await validateOrganizerVoucher(code, paymentPlan.plan_code, billing);"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    if (!result.isValid) { setVoucherMessage(result.message || 'Voucher tidak dapat digunakan.'); return; }"
          new = "    if (requestSeq != voucherValidationSeqRef.current or checkoutSession != checkoutSessionRef.current) return;\n    if (!result.isValid) { setVoucherMessage(result.message || 'Voucher tidak dapat digunakan.'); return; }"
          # JS requires !==, use a separate literal to keep the shell/Python layer simple.
          new = new.replace('requestSeq != voucherValidationSeqRef.current', 'requestSeq !== voucherValidationSeqRef.current').replace('checkoutSession != checkoutSessionRef.current', 'checkoutSession !== checkoutSessionRef.current')
          assert old in s
          s = s.replace(old, new, 1)

          old = "onChange={(e) => { setVoucherCode(e.target.value.toUpperCase()); setVoucherApplied(null); setVoucherMessage(''); }}"
          new = "onChange={(e) => { voucherValidationSeqRef.current += 1; setVoucherCode(e.target.value.toUpperCase()); setVoucherApplied(null); setVoucherMessage(''); }}"
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/OrganizerPlanPageV2.tsx
          git diff --cached --quiet || git commit -m 'fix(payment): isolate organizer checkout sessions'
          git push
