name: Payment flow v3 patch
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect and patch payment flow
        shell: bash
        run: |
          MSG="$(git log -1 --pretty=%B)"
          if [[ "$MSG" == "feat(payment): v3 final flow"* || "$MSG" == "chore: remove payment flow v3 patch"* ]]; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          import re

          # -------- Admin: exact form/handler --------
          p=Path('src/pages/AdminPlanUsagePageV2.tsx'); s=p.read_text()
          # Ensure model has toggle; retain compatibility fields for existing state only.
          if 'randomCodeEnabled: boolean' not in s:
              s=s.replace("type NewPaymentMethod = { name: string; paymentType: string; bankName: string; accountNumber: string; accountName: string; instructions: string };", "type NewPaymentMethod = { name: string; paymentType: string; bankName: string; accountNumber: string; accountName: string; instructions: string; randomCodeEnabled: boolean };")
          if "randomCodeEnabled: false" not in s:
              s=s.replace("const emptyMethod: NewPaymentMethod = { name: '', paymentType: 'BANK_TRANSFER', bankName: '', accountNumber: '', accountName: '', instructions: '' };", "const emptyMethod: NewPaymentMethod = { name: '', paymentType: 'BANK_TRANSFER', bankName: '', accountNumber: '', accountName: '', instructions: '', randomCodeEnabled: false };")
          if 'function paymentTypeLabel(value: string)' not in s:
              anchor='function methodMeta(method: OrganizerPaymentMethod) {'
              if anchor not in s: raise SystemExit('admin helper anchor missing')
              helper="function paymentTypeLabel(value: string) { const type=value.toUpperCase(); if(type==='BANK_TRANSFER') return 'Transfer Bank'; if(type==='QRIS') return 'QRIS'; if(type==='VIRTUAL_ACCOUNT') return 'Virtual Account'; if(type==='EWALLET') return 'E-Wallet'; if(type==='MIDTRANS') return 'Pembayaran Otomatis'; if(type==='SNAP') return 'Payment Gateway'; return 'Metode Pembayaran'; }\n"
              s=s.replace(anchor,helper+anchor,1)
          start=s.find('  const addMethod = async () =>'); end=s.find('  const deleteMethod = async',start)
          if start<0 or end<0: raise SystemExit('admin addMethod block missing')
          new_add="  const addMethod = async () => { const type = newMethod.paymentType.trim().toUpperCase(); if (!type) { toast('Jenis pembayaran wajib dipilih.', 'error'); return; } if (!newMethod.bankName.trim()) { toast('Nama bank wajib diisi.', 'error'); return; } if (!newMethod.accountNumber.trim()) { toast('Nomor rekening wajib diisi.', 'error'); return; } if (!newMethod.accountName.trim()) { toast('Atas nama rekening wajib diisi.', 'error'); return; } setBusy(true); try { const details = { bank_name: newMethod.bankName.trim(), account_number: newMethod.accountNumber.trim(), account_name: newMethod.accountName.trim(), random_code_enabled: type === 'BANK_TRANSFER' && newMethod.randomCodeEnabled }; const created = await adminCreateOrganizerPaymentMethod({ name: paymentTypeLabel(type), paymentType: type, details, sortOrder: paymentMethods.length + 1 }); setPaymentMethods((current) => [...current, created]); setNewMethod(emptyMethod); setShowMethodForm(false); toast('Metode pembayaran ditambahkan.', 'success'); } catch (e: any) { toast(e?.message || 'Gagal menambah metode pembayaran.', 'error'); } finally { setBusy(false); } };\n"
          s=s[:start]+new_add+s[end:]
          # Remove exactly the old labels if present.
          s=re.sub(r'<label className="text-xs font-medium text-fg-muted">Nama metode.*?</label>', '', s, count=1, flags=re.S)
          s=re.sub(r'<label className="block text-xs font-medium text-fg-muted">Instruksi untuk organizer.*?</label>', '', s, count=1, flags=re.S)
          s=s.replace('<span className="rounded-full bg-surface-elevated px-2.5 py-1 text-[9px] font-bold uppercase tracking-wider text-fg-muted">{method.payment_type}</span>', '<span className="rounded-full bg-surface-elevated px-2.5 py-1 text-[9px] font-bold tracking-wider text-fg-muted">{paymentTypeLabel(method.payment_type)}</span>')
          s=s.replace('{paymentDetail(method) && <p className="mt-3 whitespace-pre-wrap rounded-xl border border-surface-border bg-surface-elevated/30 p-3 text-xs leading-5 text-fg-muted">{paymentDetail(method)}</p>}', '')
          p.write_text(s)

          # -------- User helpers/state --------
          p=Path('src/pages/OrganizerPlanPageV2.tsx'); s=p.read_text()
          s=s.replace("import { ArrowLeft, ArrowRight, Check, CheckCircle2, CreditCard, Eye, Gauge, MessageCircle, RefreshCw, ShieldCheck, Sparkles, Tag, UploadCloud, X } from 'lucide-react';", "import { ArrowLeft, ArrowRight, Check, CheckCircle2, Copy, CreditCard, Eye, Gauge, MessageCircle, RefreshCw, ShieldCheck, Sparkles, Tag, UploadCloud, X } from 'lucide-react';")
          if 'function paymentTypeLabel(value: string)' not in s:
              anchor='function paymentDetailText(method: OrganizerPaymentMethod)'
              if anchor not in s: raise SystemExit('user helper anchor missing')
              helper="function paymentTypeLabel(value: string) { const type=value.toUpperCase(); if(type==='BANK_TRANSFER') return 'Transfer Bank'; if(type==='QRIS') return 'QRIS'; if(type==='VIRTUAL_ACCOUNT') return 'Virtual Account'; if(type==='EWALLET') return 'E-Wallet'; if(type==='MIDTRANS') return 'Pembayaran Otomatis'; if(type==='SNAP') return 'Payment Gateway'; return 'Metode Pembayaran'; }\nfunction paymentBankName(method: OrganizerPaymentMethod | null) { return String(method?.details?.bank_name ?? '').trim(); }\nfunction paymentAccountNumber(method: OrganizerPaymentMethod | null) { return String(method?.details?.account_number ?? '').trim(); }\nfunction paymentAccountName(method: OrganizerPaymentMethod | null) { return String(method?.details?.account_name ?? '').trim(); }\n"
              s=s.replace(anchor,helper+anchor,1)
          s=re.sub(r'function paymentDetailText\(method: OrganizerPaymentMethod\) \{.*?\}\n', "function paymentDetailText(method: OrganizerPaymentMethod) { return ''; }\n", s, count=1, flags=re.S)
          marker="  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP'].includes(String(selectedMethod.payment_type).toUpperCase());"
          if marker not in s: raise SystemExit('user proof marker missing')
          s=s.replace(marker,"  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(selectedMethod.payment_type).toUpperCase());\n  const selectedRandomEnabled = !!selectedMethod && String(selectedMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(selectedMethod.details?.random_code_enabled) && selectedTotal > 0;\n  const paymentRandomCode = selectedRandomEnabled ? Number(contactFields.__payment_random_code || 0) : 0;\n  const paymentTransferTotal = selectedTotal + paymentRandomCode;",1)
          open_marker="const initial: Record<string, string> = {}; paymentFields.forEach((field) => { initial[field.field_key] = ''; });"
          if open_marker not in s: raise SystemExit('openPayment init marker missing')
          if 'initial.__payment_random_code' not in s:
              s=s.replace(open_marker,open_marker+" const firstMethod = paymentMethods[0] ?? null; if (firstMethod && String(firstMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(firstMethod.details?.random_code_enabled)) initial.__payment_random_code = String(Math.floor(Math.random() * 900) + 100);",1)
          # Make selected random code follow the method when clicking its card.
          click_old='onClick={() => setSelectedPaymentMethodId(method.id)}'
          click_new="onClick={() => { setSelectedPaymentMethodId(method.id); setContactFields((current) => ({ ...current, __payment_random_code: String(method.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(method.details?.random_code_enabled) && selectedTotal > 0 ? String(Math.floor(Math.random() * 900) + 100) : '' })); }}"
          s=s.replace(click_old,click_new,1)
          # Replace the known user payment block between Metode pembayaran and upload block.
          start=s.find('{paymentMethods.length > 0 && <div className="order-3 mt-5">')
          end=s.find('{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5',start)
          if start<0 or end<0: raise SystemExit('user payment block bounds missing')
          payment_block='''{paymentMethods.length > 0 && <div className="order-3 mt-5"><p className="text-xs font-semibold text-fg-muted">Metode pembayaran</p><div className="mt-2 space-y-2">{paymentMethods.map((method) => <button key={method.id} type="button" onClick={() => { setSelectedPaymentMethodId(method.id); setContactFields((current) => ({ ...current, __payment_random_code: String(method.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(method.details?.random_code_enabled) && selectedTotal > 0 ? String(Math.floor(Math.random() * 900) + 100) : '' })); }} className={`w-full rounded-2xl border p-4 text-left transition ${selectedPaymentMethodId === method.id ? 'border-accent bg-accent/5' : 'border-surface-border bg-surface-elevated/25 hover:bg-surface-elevated/50'}`}><div className="flex items-start justify-between gap-3"><div className="min-w-0 flex-1"><p className="text-sm font-bold text-fg">{paymentTypeLabel(method.payment_type)}{paymentBankName(method) ? ` · ${paymentBankName(method)}` : ''}</p>{paymentAccountNumber(method) && <div className="mt-3 rounded-xl border border-surface-border bg-surface-elevated/35 p-3"><div className="flex items-center justify-between gap-2"><span className="text-[10px] font-semibold uppercase tracking-wider text-fg-muted">Nomor Rekening</span><button type="button" onClick={(e) => { e.stopPropagation(); navigator.clipboard.writeText(paymentAccountNumber(method)).then(() => toast.success('Nomor rekening disalin.')).catch(() => toast.error('Nomor rekening tidak dapat disalin.')); }} className="inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs font-semibold text-accent hover:bg-accent/10"><Copy size={13}/> Salin</button></div><p className="mt-1 text-3xl font-black tracking-wider text-fg">{paymentAccountNumber(method)}</p>{paymentAccountName(method) && <p className="mt-1 text-xs text-fg-muted">a.n. {paymentAccountName(method)}</p>}</div>}</div>{selectedPaymentMethodId === method.id && <CheckCircle2 size={17} className="mt-1 shrink-0 text-accent"/>}</div></button>)}</div></div>}\n        '''
          s=s[:start]+payment_block+s[end:]
          # Replace upload block with prominent component; boundary ends at paymentFields.
          up_start=s.find('{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5')
          up_end=s.find('{paymentFields.filter',up_start)
          if up_start<0 or up_end<0: raise SystemExit('user upload bounds missing')
          upload='''{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5 overflow-hidden rounded-2xl border-2 border-accent/40 bg-accent/5"><div className="p-5"><div className="flex items-start gap-3"><div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-accent/10"><UploadCloud size={21} className="text-accent"/></div><div><p className="text-base font-bold text-fg">Upload Bukti Transfer</p><p className="mt-1 text-xs leading-5 text-fg-muted">Unggah bukti pembayaran setelah transfer.</p></div></div><Button className="mt-4 w-full" onClick={() => proofInputRef.current?.click()} icon={<UploadCloud size={15}/>}>{proofFile ? 'Ganti Bukti Transfer' : 'Pilih Bukti Transfer'}</Button><input ref={proofInputRef} className="hidden" type="file" accept="image/png,image/jpeg,image/webp" onChange={(e) => chooseProof(e.target.files?.[0])}/>{proofFile && <div className="mt-3 flex items-center gap-3 rounded-xl border border-surface-border bg-surface-elevated/35 p-3"><div className="min-w-0 flex-1"><p className="truncate text-xs font-semibold text-fg">{proofFile.name}</p></div><button type="button" onClick={removeProof} className="rounded-lg p-2 text-red-400 hover:bg-red-500/10"><X size={15}/></button></div>}{proofPreviewUrl && <div className="relative mt-3 overflow-hidden rounded-2xl border border-surface-border bg-black/20"><img src={proofPreviewUrl} alt="Preview bukti transfer" className="max-h-64 w-full object-contain"/></div>}</div></div>}\n        '''
          s=s[:up_start]+upload+s[up_end:]
          # Final payable display gets random amount; this does not alter package pricing.
          s=s.replace("{selectedTotal === 0 ? 'GRATIS' : money(selectedTotal, paymentPlan.currency)}", "{selectedTotal === 0 ? 'GRATIS' : money(paymentTransferTotal, paymentPlan.currency)}",1)
          p.write_text(s)
          PY
          npm ci --silent
          npm run lint
          npx tsc -p tsconfig.app.json --noEmit
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/AdminPlanUsagePageV2.tsx src/pages/OrganizerPlanPageV2.tsx
          git diff --cached --check
          git commit -m "feat(payment): v3 final flow"
          git rm .github/workflows/payment-flow-v3.yml
          git commit -m "chore: remove payment flow v3 patch"
          git push