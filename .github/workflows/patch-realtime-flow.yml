name: Patch realtime flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: patch realtime chat notification flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch realtime flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          replace('src/lib/realtimeBus.ts',
              "  | { type: 'notification-inserted'; notificationId: string }",
              "  | { type: 'notification-inserted'; notificationId: string; notification?: Record<string, unknown> }")

          replace('src/lib/realtimeHub.ts',
              "      if (notificationId) emitSykaEvent({ type: 'notification-inserted', notificationId });",
              "      if (notificationId) emitSykaEvent({ type: 'notification-inserted', notificationId, notification: (payload.new ?? {}) as Record<string, unknown> });")

          replace('src/lib/realtimeHub.ts',
              "  .on('postgres_changes', { event: '*', schema: 'public', table: 'follows', filter: `following_id=eq.${userId}` }, (payload) => {\n      const row = (payload.new ?? payload.old ?? {}) as Record<string, unknown>;\n      emitSykaEvent({ type: 'follow-updated', userId: String(row.follower_id ?? ''), status: String(row.status ?? 'none') });\n    });",
              "  .on('postgres_changes', { event: '*', schema: 'public', table: 'follows', filter: `following_id=eq.${userId}` }, (payload) => {\n      const row = (payload.new ?? payload.old ?? {}) as Record<string, unknown>;\n      emitSykaEvent({ type: 'follow-updated', userId: String(row.follower_id ?? ''), status: String(row.status ?? 'none') });\n    })\n    .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_threads', filter: `user_id=eq.${userId}` }, (payload) => {\n      emitSykaEvent({ type: 'chat-thread-updated', thread: (payload.new ?? payload.old ?? {}) as Record<string, unknown> });\n    })\n    .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_threads', filter: `participant_id=eq.${userId}` }, (payload) => {\n      emitSykaEvent({ type: 'chat-thread-updated', thread: (payload.new ?? payload.old ?? {}) as Record<string, unknown> });\n    });")

          replace('src/components/ui/ChatWidget.tsx',
              "import { subscribeSykaEvents } from '@/lib/realtimeBus';",
              "import { subscribeSykaEvents } from '@/lib/realtimeBus';\nimport { supabase } from '@/lib/supabase';")

          old = """  useEffect(() => {\n    if (!isOpen || view !== 'chat' || !thread || thread.status !== 'open') return;\n    void loadMessages();\n    const unsubscribe = subscribeSykaEvents((event) => {\n      if (event.type === 'chat-message') {\n        const message = event.message as unknown as ChatMessage;\n        if (message.thread_id !== thread.id) return;\n        setMessages((current) => current.some((item) => item.id === message.id) ? current : [...current, message]);\n      }\n      if (event.type === 'chat-thread-updated') {\n        const updated = event.thread as unknown as ChatThread;\n        if (updated.id !== thread.id) return;\n        setThread(updated);\n        if (updated.status === 'closed') setView('ended');\n      }\n    });\n    return unsubscribe;\n  }, [isOpen, view, thread, loadMessages]);"""
          new = """  useEffect(() => {\n    if (!isOpen || view !== 'chat' || !thread) return;\n    let alive = true;\n    void loadMessages();\n\n    const channel = supabase\n      .channel(`chat-widget-${thread.id}`)\n      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: `thread_id=eq.${thread.id}` }, (payload) => {\n        const message = payload.new as ChatMessage;\n        if (!message?.id || !alive) return;\n        setMessages((current) => current.some((item) => item.id === message.id) ? current : [...current, message]);\n      })\n      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chat_threads', filter: `id=eq.${thread.id}` }, (payload) => {\n        if (!alive) return;\n        const updated = payload.new as ChatThread;\n        setThread((current) => current ? { ...current, ...updated } : updated);\n        if (updated.status === 'closed') setView('ended');\n      })\n      .subscribe((status, error) => {\n        if (error) console.error('[SykaBelajar] chat widget realtime error', status, error);\n      });\n\n    const unsubscribe = subscribeSykaEvents((event) => {\n      if (event.type !== 'chat-thread-updated' || String(event.thread.id ?? '') !== thread.id) return;\n      const updated = event.thread as unknown as ChatThread;\n      setThread((current) => current ? { ...current, ...updated } : updated);\n      if (updated.status === 'closed') setView('ended');\n    });\n\n    return () => {\n      alive = false;\n      unsubscribe();\n      void supabase.removeChannel(channel);\n    };\n  }, [isOpen, view, thread?.id, loadMessages]);"""
          replace('src/components/ui/ChatWidget.tsx', old, new)

          replace('src/pages/MessagesPageV6.tsx',
              "const ch=supabase.channel('chat-stable-'+selected.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'thread_id=eq.'+selected.id},p=>{const m=p.new as ChatMessage;setMessages(v=>{if(v.some(x=>x.id===m.id))return v;const n=[...v,m];cacheSet(selected.id,n);return n});requestAnimationFrame(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight});void refresh()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_threads',filter:'id=eq.'+selected.id},p=>setSelected(p.new as ChatThread)).subscribe();",
              "const ch=supabase.channel('chat-stable-'+selected.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'thread_id=eq.'+selected.id},p=>{const m=p.new as ChatMessage;setMessages(v=>{if(v.some(x=>x.id===m.id))return v;const n=[...v,m];cacheSet(selected.id,n);return n});emitSykaEvent({type:'chat-message',message:m as unknown as Record<string,unknown>});requestAnimationFrame(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight})}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_threads',filter:'id=eq.'+selected.id},p=>setSelected(v=>v?{...v,...(p.new as ChatThread)}:p.new as ChatThread)).subscribe((status,error)=>{if(error)console.error('[SykaBelajar] chat realtime error',status,error)});")

          replace('src/pages/NotificationsPageV2.tsx',
              "import { showToast } from '@/lib/toast';",
              "import { showToast } from '@/lib/toast';\nimport { subscribeSykaEvents } from '@/lib/realtimeBus';")

          old = """ useEffect(()=>{if(!user)return;const channel=supabase.channel(`notifications-center-${user.id}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${user.id}`},payload=>{const n=mapNotification(payload.new as NotificationRow);setRows(prev=>[n,...prev.filter(x=>x.id!==n.id)]);emitSykaEvent({type:'notification-inserted',notificationId:n.id});}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'notifications',filter:`user_id=eq.${user.id}`},payload=>{const n=mapNotification(payload.new as NotificationRow);setRows(prev=>prev.map(x=>x.id===n.id?n:x));if(n.read)emitSykaEvent({type:'notification-read',notificationId:n.id});}).subscribe();return()=>{void supabase.removeChannel(channel);};},[user?.id]);"""
          new = """ useEffect(()=>{if(!user)return;const unsubscribe=subscribeSykaEvents((event)=>{if(event.type==='notification-inserted'&&event.notification){const n=mapNotification(event.notification as unknown as NotificationRow);setRows(prev=>prev.some(x=>x.id===n.id)?prev:[n,...prev]);}if(event.type==='notification-read'){setRows(prev=>prev.map(x=>x.id===event.notificationId?{...x,read:true}:x));}if(event.type==='notification-all-read'){setRows(prev=>prev.map(x=>x.data?.urgent?x:{...x,read:true}));}});return unsubscribe;},[user?.id]);"""
          replace('src/pages/NotificationsPageV2.tsx', old, new)

          replace('src/components/layout/AppLayout.tsx',
              "import { startPublicRealtime, startUserRealtime } from '@/lib/realtimeHub';",
              "import { startPublicRealtime } from '@/lib/realtimeHub';")

          replace('src/components/layout/AppLayout.tsx',
              "    const stopUser = startUserRealtime(user.id, isAdmin);\n    const unsubscribe = subscribeSykaEvents((event) => {",
              "    const unsubscribe = subscribeSykaEvents((event) => {")

          replace('src/components/layout/AppLayout.tsx',
              "      if (event.type === 'order-changed' && isAdmin) {",
              "      if (event.type === 'chat-thread-updated') {\n        void getUnreadChatCount(true).then((count) => {\n          setUnreadMessages(count);\n          setPersistentCache(chatCacheKey, count, { ttlMs: CHAT_CACHE_TTL });\n        }).catch(() => {});\n        return;\n      }\n      if (event.type === 'order-changed' && isAdmin) {")

          replace('src/components/layout/AppLayout.tsx',
              "      unsubscribe();\n      stopUser();\n      stopPublic();",
              "      unsubscribe();\n      stopPublic();")

          old_admin = """  useEffect(() => { void refresh(); const timer = window.setInterval(() => void refresh(), 10000); return () => window.clearInterval(timer); }, [refresh]);"""
          new_admin = """  useEffect(() => {\n    void refresh();\n    const channel = supabase\n      .channel('admin-chat-threads-live')\n      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_threads' }, () => void refresh())\n      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chat_threads' }, payload => {\n        const updated = payload.new as ChatThread;\n        setThreads(current => current.map(item => item.id === updated.id ? { ...item, ...updated } : item));\n        void refresh();\n        if (tab === 'history') void refreshHistory();\n      })\n      .subscribe((status, error) => { if (error) console.error('[SykaBelajar] admin chat thread realtime error', status, error); });\n    return () => { void supabase.removeChannel(channel); };\n  }, [refresh, tab, refreshHistory]);"""
          replace('src/pages/AdminChatConsolePage.tsx', old_admin, new_admin)

          old_sel = """  useEffect(() => { if (!selected) { setMessages([]); return; } let live = true; void loadChatMessagesPage(selected.id).then(v => { if (live) setMessages(v); }).catch(e => live && toast(e?.message ?? 'Gagal memuat percakapan.', 'error')); void markThreadRead(selected.id).catch(() => {}); return () => { live = false; }; }, [selected?.id, toast]);"""
          new_sel = """  useEffect(() => { if (!selected) { setMessages([]); return; } let live = true; void loadChatMessagesPage(selected.id).then(v => { if (live) setMessages(v); }).catch(e => live && toast(e?.message ?? 'Gagal memuat percakapan.', 'error')); void markThreadRead(selected.id).catch(() => {}); const channel = supabase.channel(`admin-chat-thread-${selected.id}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:`thread_id=eq.${selected.id}`},payload=>{const m=payload.new as ChatMessage;if(!live)return;setMessages(v=>v.some(x=>x.id===m.id)?v:[...v,m]);}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_threads',filter:`id=eq.${selected.id}`},payload=>{if(!live)return;setSelected(v=>v?{...v,...(payload.new as ChatThread)}:v);}).subscribe((status,error)=>{if(error)console.error('[SykaBelajar] admin selected chat realtime error',status,error)}); return () => { live = false; void supabase.removeChannel(channel); }; }, [selected?.id, toast]);"""
          replace('src/pages/AdminChatConsolePage.tsx', old_sel, new_sel)
          PY

          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git rm .github/workflows/patch-realtime-flow.yml
          git commit -m 'fix(realtime): restore live chat notifications and lifecycle'
          git push
