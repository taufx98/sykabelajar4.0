name: Auth Custom HTTP Email Provider — Staging D1 Schema

on:
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - ".github/auth-ops/APPLY-CUSTOM-HTTP-EMAIL-0001"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY-CUSTOM-HTTP-EMAIL-sykabelajar-auth-poc to add custom HTTP provider support to staging D1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auth-staging-custom-email-d1
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/security/auth-poc-stage-1' && github.actor == 'taufx98' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/auth-worker
    steps:
      - name: Checkout guarded auth branch
        uses: actions/checkout@v7
        with:
          ref: security/auth-poc-stage-1

      - name: Verify exact owner confirmation, staging D1 and immutable migration
        env:
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "taufx98"
          test "$GITHUB_REF" = "refs/heads/security/auth-poc-stage-1"
          CONFIRMATION="$CONFIRMATION_INPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            CONFIRMATION="$(tr -d '\r\n' < ../../.github/auth-ops/APPLY-CUSTOM-HTTP-EMAIL-0001)"
          fi
          test "$CONFIRMATION" = "APPLY-CUSTOM-HTTP-EMAIL-sykabelajar-auth-poc" || {
            echo "Blocked: exact custom-email staging confirmation is missing." >&2
            exit 1
          }
          EXPECTED_BLOB="b1859cbded23446f5eb28ab6e2da23945801af74"
          ACTUAL_BLOB="$(git hash-object migrations/0012_custom_http_email_provider.sql)"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB" || {
            echo "Blocked: reviewed staging migration content changed." >&2
            exit 1
          }
          for pattern in \
            '^name = "sykabelajar-auth-poc"$' \
            '^database_name = "sykabelajar-auth-poc"$' \
            '^database_id = "7a4f9008-a1c6-42b6-8a04-abde12699248"$' \
            '^migrations_dir = "migrations"$'; do
            grep -Eq "$pattern" wrangler.toml || {
              echo "Blocked: Wrangler target is not the fixed staging D1." >&2
              exit 1
            }
          done
          ! grep -Eq 'sykabelajar-auth-prod|mvdczyitbkxkldjughor' wrangler.toml
          echo "Verified owner, staging-only target and exact migration hash."

      - name: Install locked toolchain and run all Worker tests
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/auth-worker/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test

      - name: Verify exact staging D1 resource
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error("Cloudflare Actions credentials are missing.");
          const id = "7a4f9008-a1c6-42b6-8a04-abde12699248";
          const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + encodeURIComponent(accountId) + "/d1/database/" + id, {
            headers: { Authorization: "Bearer " + token, Accept: "application/json" },
            redirect: "error",
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok || body.success !== true || body.result?.uuid !== id || body.result?.name !== "sykabelajar-auth-poc") {
            throw new Error("Cloudflare did not verify the exact staging D1 database.");
          }
          console.log("Verified the fixed non-production D1 resource.");
          NODE

      - name: Verify applied migrations and preserve existing Better Auth account counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT name FROM d1_migrations ORDER BY name;" > "$RUNNER_TEMP/custom-email-before-migrations.json"
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT (SELECT COUNT(*) FROM \"user\") AS users,(SELECT COUNT(*) FROM \"account\") AS accounts,(SELECT COUNT(*) FROM \"session\") AS sessions,(SELECT COUNT(*) FROM auth_email_provider_accounts) AS email_accounts;" > "$RUNNER_TEMP/custom-email-before-counts.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const root = process.env.RUNNER_TEMP;
          const read = (name) => JSON.parse(readFileSync(root + "/" + name, "utf8"));
          const rows = (value, out = []) => {
            if (Array.isArray(value)) value.forEach((x) => rows(x, out));
            else if (value && typeof value === "object") {
              out.push(value);
              Object.values(value).forEach((x) => { if (x && typeof x === "object") rows(x, out); });
            }
            return out;
          };
          const applied = new Set(rows(read("custom-email-before-migrations.json")).map((x) => x.name).filter(Boolean));
          const required = [
            "0000_auth_worker_internal_config.sql",
            "0001_better_auth.sql",
            "0002_seed_first_party_oauth_client.sql",
            "0003_zeptomail_agent_settings.sql",
            "0004_better_auth_registration_attributes.sql",
            "0005_telegram_phone_verification.sql",
            "0006_transactional_email_provider.sql",
            "0007_managed_social_login_providers.sql",
            "0008_add_staging_oauth_callback.sql",
            "0009_auth_runtime_settings.sql",
            "0010_multi_provider_email_routing.sql",
            "0011_add_github_social_provider.sql",
          ];
          for (const name of required) if (!applied.has(name)) throw new Error("Required staging migration missing: " + name);
          const unexpected = [...applied].filter((name) => ![...required, "0012_custom_http_email_provider.sql"].includes(name));
          if (unexpected.length) throw new Error("Unexpected staging D1 migration history: " + unexpected.join(", "));
          const before = rows(read("custom-email-before-counts.json")).find((x) => Object.hasOwn(x, "users"));
          if (!before) throw new Error("Could not capture current Better Auth account counts.");
          console.log(JSON.stringify({ migration0012AlreadyApplied: applied.has("0012_custom_http_email_provider.sql"), before }));
          NODE

      - name: Apply only the reviewed additive staging D1 migration when pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.toml d1 migrations apply sykabelajar-auth-poc --remote

      - name: Verify custom HTTP schema and prove no Better Auth account was moved or changed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT name FROM pragma_table_info('auth_email_provider_accounts') WHERE name IN ('endpoint_url','auth_mode') ORDER BY name;" > "$RUNNER_TEMP/custom-email-columns.json"
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT provider,COUNT(*) AS count FROM auth_email_provider_accounts GROUP BY provider ORDER BY provider;" > "$RUNNER_TEMP/custom-email-provider-counts.json"
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT (SELECT COUNT(*) FROM \"user\") AS users,(SELECT COUNT(*) FROM \"account\") AS accounts,(SELECT COUNT(*) FROM \"session\") AS sessions,(SELECT COUNT(*) FROM auth_email_provider_accounts) AS email_accounts;" > "$RUNNER_TEMP/custom-email-after-counts.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const root = process.env.RUNNER_TEMP;
          const read = (name) => JSON.parse(readFileSync(root + "/" + name, "utf8"));
          const rows = (value, out = []) => {
            if (Array.isArray(value)) value.forEach((x) => rows(x, out));
            else if (value && typeof value === "object") {
              out.push(value);
              Object.values(value).forEach((x) => { if (x && typeof x === "object") rows(x, out); });
            }
            return out;
          };
          const before = rows(read("custom-email-before-counts.json")).find((x) => Object.hasOwn(x, "users"));
          const after = rows(read("custom-email-after-counts.json")).find((x) => Object.hasOwn(x, "users"));
          if (!before || !after) throw new Error("Could not compare account counts.");
          for (const key of ["users", "accounts", "sessions", "email_accounts"]) {
            if (Number(before[key]) !== Number(after[key])) throw new Error("Staging data count changed unexpectedly: " + key);
          }
          const columns = rows(read("custom-email-columns.json")).map((x) => x.name).filter(Boolean);
          if (JSON.stringify(columns.sort()) !== JSON.stringify(["auth_mode", "endpoint_url"])) {
            throw new Error("Custom HTTP provider schema columns are incomplete.");
          }
          console.log("PASS: custom HTTP schema is present; Better Auth users/accounts/sessions and email-provider account counts are unchanged.");
          NODE

      - name: Remove temporary verification output
        if: always()
        run: rm -f "$RUNNER_TEMP"/custom-email-*.json
