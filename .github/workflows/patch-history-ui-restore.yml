name: Restore Customer Service History List UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore compact history row
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminChatConsolePage.tsx')
          text = p.read_text()
          old = '<Card key={row.thread_id} className="p-4"><div className="flex flex-col gap-3"><div className="flex items-center gap-3"><Avatar name={row.user_name} id={row.user_id} size={36}/><div className="flex-1 min-w-0"><p className="text-sm font-semibold text-fg truncate">{row.user_name}</p><p className="text-[11px] text-fg-muted">@{row.username??\'-\'} · {row.subject??\'Ticket Admin\'}</p><p className="text-[10px] text-fg-muted mt-1">{new Date(row.created_at).toLocaleString(\'id-ID\')} · {row.message_count} pesan · petugas: {row.handled_name??\'-\'}</p></div><StarRating value={row.rating}/><Badge color={row.status===\'closed\'?\'default\':\'moss\'}>{row.status===\'closed\'?\'Selesai\':\'Aktif\'}</Badge></div><div className="flex items-center justify-end gap-2 border-t surface-border pt-3">{row.status===\'open\'?<Button size="sm" onClick={()=>void finishHistory(row)} loading={closing} icon={<CheckCircle2 size={14}/>}>Selesaikan Chat</Button>:<span className="text-xs text-fg-muted mr-auto">Percakapan sudah selesai</span>}<Button size="sm" variant="outline" onClick={()=>setPreview(row)}>View Chat</Button></div></div></Card>'
          new = '<Card key={row.thread_id} className="p-4"><div className="flex items-center gap-3"><Avatar name={row.user_name} id={row.user_id} size={36}/><div className="flex-1 min-w-0"><p className="text-sm font-semibold text-fg truncate">{row.user_name}</p><p className="text-[11px] text-fg-muted">@{row.username??\'-\'} · {row.subject??\'Ticket Admin\'}</p><p className="text-[10px] text-fg-muted mt-1">{new Date(row.created_at).toLocaleString(\'id-ID\')} · {row.message_count} pesan · petugas: {row.handled_name??\'-\'}</p></div><StarRating value={row.rating}/><Badge color={row.status===\'closed\'?\'default\':\'moss\'}>{row.status===\'closed\'?\'Selesai\':\'Aktif\'}</Badge>{row.status===\'open\'&&<Button size="sm" variant="outline" onClick={()=>void finishHistory(row)} loading={closing} icon={<CheckCircle2 size={14}/>}>Selesaikan</Button>}<Button size="sm" variant="outline" onClick={()=>setPreview(row)}>View Chat</Button></div></Card>'
          if old not in text:
              raise SystemExit('new history card anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminChatConsolePage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(admin-cs): restore compact history list layout'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-history-ui-restore.yml
          git add .github/workflows/patch-history-ui-restore.yml
          git commit -m 'chore: remove temporary history restore workflow'
          git push
