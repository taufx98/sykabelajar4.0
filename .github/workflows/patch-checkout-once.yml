name: One-shot checkout UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/pages/OrganizerPlanPageV2.tsx')
          s=p.read_text()
          pattern=re.compile(r"  async function checkVoucher\(\) \{.*?\n  \}\n\n  async function sendOrder\(\)",re.S)
          replacement='''  async function checkVoucher() {
    const code = voucherCode.trim().toUpperCase();
    if (!code) { setVoucherApplied(null); setVoucherMessage('Masukkan kode voucher terlebih dahulu.'); return; }
    if (!paymentPlan) return;
    setVoucherChecking(true); setVoucherApplied(null); setVoucherMessage('Memeriksa voucher…');
    try {
      let result = await validateOrganizerVoucher(code, paymentPlan.plan_code, billing);
      if (!result.isValid && /^Voucher hanya bisa digunakan untuk periode/i.test(result.message || '')) {
        const alternateBilling: Billing = billing === 'MONTHLY' ? 'YEARLY' : 'MONTHLY';
        const alternateResult = await validateOrganizerVoucher(code, paymentPlan.plan_code, alternateBilling);
        if (alternateResult.isValid) {
          setBilling(alternateBilling);
          setView(alternateBilling);
          result = alternateResult;
        }
      }
      if (!result.isValid) { setVoucherMessage(result.message || 'Voucher tidak dapat digunakan.'); return; }
      setVoucherApplied(result); setVoucherMessage('Voucher bisa digunakan.'); toast.success('Voucher bisa digunakan.');
    } catch (error: any) { setVoucherMessage(error?.message || 'Gagal memeriksa voucher.'); }
    finally { setVoucherChecking(false); }
  }

  async function sendOrder()'''
          s,n=pattern.subn(replacement,s,count=1)
          if n!=1: raise SystemExit('voucher block not found')
          s=s.replace('max-w-xl max-h-[84vh]','max-w-lg max-h-[78vh]',1)
          s=s.replace('bg-surface p-5 shadow-2xl md:p-6','bg-surface p-4 shadow-2xl md:p-5',1)
          anchor='<p className="mt-1 text-xs text-fg-muted">Lengkapi data pemesan, pilih pembayaran, lihat total, lalu gunakan voucher bila ada.</p></div><button'
          insert='<p className="mt-1 text-xs text-fg-muted">Lengkapi data pemesan, pilih pembayaran, lihat total, lalu gunakan voucher bila ada.</p><div data-testid="checkout-period-selector" className="mt-3 inline-flex w-full rounded-xl border border-surface-border bg-surface-elevated/35 p-1"><button type="button" onClick={() => { setBilling(\'MONTHLY\'); setView(\'MONTHLY\'); setVoucherApplied(null); setVoucherMessage(\'\'); }} className={`flex-1 rounded-lg px-3 py-2 text-xs font-semibold ${billing === \'MONTHLY\' ? \'bg-accent text-white shadow\' : \'text-fg-muted\'}`}>Bulanan</button><button type="button" onClick={() => { setBilling(\'YEARLY\'); setView(\'YEARLY\'); setVoucherApplied(null); setVoucherMessage(\'\'); }} className={`flex-1 rounded-lg px-3 py-2 text-xs font-semibold ${billing === \'YEARLY\' ? \'bg-accent text-white shadow\' : \'text-fg-muted\'}`}>Tahunan</button></div></div><button'
          if 'data-testid="checkout-period-selector"' not in s:
            if anchor not in s: raise SystemExit('header anchor not found')
            s=s.replace(anchor,insert,1)
          s=s.replace('const showProofUpload = selectedTotal > 0 && (selectedMethodNeedsProof || (!selectedMethod && hasManualPaymentMethod));','const showProofUpload = selectedTotal > 0 && (selectedMethodNeedsProof || hasManualPaymentMethod);',1)
          s=s.replace('text-lg font-black tracking-wider text-fg sm:text-xl','text-xl font-black tracking-wider text-fg sm:text-2xl',1)
          s=s.replace('text-sm font-semibold text-fg-muted sm:text-base','text-base font-semibold text-fg-muted sm:text-lg',1)
          old_copy='<button type="button" className="rounded-lg border border-surface-border p-1.5 text-fg-muted hover:text-fg" onClick={(event) => { event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); }} aria-label="Salin nomor rekening"><Copy size={14}/></button>'
          new_copy='<span role="button" tabIndex={0} className="cursor-pointer rounded-lg border border-surface-border p-1.5 text-fg-muted hover:text-fg" onClick={(event) => { event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); }} onKeyDown={(event) => { if (event.key === \'Enter\' || event.key === \' \') { event.preventDefault(); event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); } }} aria-label="Salin nomor rekening"><Copy size={14}/></span>'
          if old_copy in s: s=s.replace(old_copy,new_copy,1)
          old_total='<div className="mt-4 flex items-end justify-between border-t border-surface-border pt-4"><span className="font-semibold text-fg">Total pembayaran</span><span className={`text-3xl font-black ${selectedTotal === 0 ? \'text-emerald-300\' : \'text-fg\'}`}>{selectedTotal === 0 ? \'GRATIS\' : money(selectedTotal, paymentPlan.currency)}</span></div>'
          new_total='<div className="mt-4 border-t border-surface-border pt-4">{selectedRandomEnabled && <div className="mb-2 flex items-center justify-between text-sm"><span className="text-fg-muted">Kode unik</span><span className="font-black tracking-wider text-emerald-300">{String(paymentRandomCode).padStart(3, \'0\')}</span></div>}<div className="flex items-end justify-between"><span className="font-semibold text-fg">Total pembayaran</span><span className={`text-3xl font-black ${selectedTotal === 0 ? \'text-emerald-300\' : \'text-fg\'}`}>{selectedTotal === 0 ? \'GRATIS\' : money(paymentTransferTotal, paymentPlan.currency)}</span></div></div>'
          if old_total in s: s=s.replace(old_total,new_total,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/OrganizerPlanPageV2.tsx
          git diff --cached --quiet || { git commit -m "fix: organizer checkout voucher period and payment total"; git push origin HEAD:main; }
          git rm -f .github/workflows/patch-checkout-once.yml || true
          git rm -f .github/workflows/deploy.yml || true
          git show HEAD^:.github/workflows/deploy.yml > .github/workflows/deploy.yml
          git add .github/workflows/deploy.yml
          git commit -m "chore: restore stable ci workflow" || true
          git push origin HEAD:main || true