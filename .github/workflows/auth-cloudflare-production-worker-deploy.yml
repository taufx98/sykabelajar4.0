name: Deploy Better Auth Production Worker (preserve secrets)

on:
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - ".github/auth-ops/DEPLOY-PRODUCTION-AUTH-WORKER-0011"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY-PRODUCTION-AUTH-WORKER-sykabelajar-auth-prod"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auth-production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/security/auth-poc-stage-1' && github.actor == 'taufx98' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    name: Update the existing Production Worker without rotating secrets or touching staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/auth-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout guarded auth migration branch
        uses: actions/checkout@v7
        with:
          ref: security/auth-poc-stage-1

      - name: Verify exact owner authorization and closed Production configuration
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "taufx98"
          test "$GITHUB_REF" = "refs/heads/security/auth-poc-stage-1"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "DEPLOY-PRODUCTION-AUTH-WORKER-sykabelajar-auth-prod"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            marker="../../.github/auth-ops/DEPLOY-PRODUCTION-AUTH-WORKER-0011"
            test -f "$marker"
            test "$(cat "$marker")" = "DEPLOY-PRODUCTION-AUTH-WORKER-sykabelajar-auth-prod"
          else
            exit 1
          fi
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const production = readFileSync("wrangler.production.toml", "utf8");
          const staging = readFileSync("wrangler.toml", "utf8");
          const required = [
            /^name = "sykabelajar-auth-prod"$/m,
            /^database_name = "sykabelajar-auth-prod"$/m,
            /^database_id = "6d4dc7b5-8e71-4fdc-9cda-3230e49951c7"$/m,
            /^pattern = "auth-prod\.sykabelajar\.my\.id"$/m,
            /^BETTER_AUTH_URL = "https:\/\/auth-prod\.sykabelajar\.my\.id"$/m,
            /^AUTH_SIGNUP_DISABLED = "true"$/m,
            /^SUPABASE_PROVISIONING_ENABLED = "false"$/m,
            /^SUPABASE_PROVISIONING_ENV = "production"$/m,
            /^SUPABASE_PROVISIONING_URL = "https:\/\/mvdczyitbkxkldjughor\.supabase\.co"$/m,
          ];
          if (!required.every((pattern) => pattern.test(production))) throw new Error("Production Wrangler config is not the reviewed closed-signup target.");
          if (/auth\.sykabelajar\.my\.id|staging\.sykabelajar\.my\.id|ydamszdfsxqisanazdkb/.test(production)) throw new Error("Production config contains a staging hostname/project.");
          if (!/^name = "sykabelajar-auth-poc"$/m.test(staging) ||
              !/^database_id = "7a4f9008-a1c6-42b6-8a04-abde12699248"$/m.test(staging) ||
              !/^pattern = "auth\.sykabelajar\.my\.id"$/m.test(staging)) {
            throw new Error("Accepted staging Worker/D1/hostname config changed unexpectedly.");
          }
          console.log("PASS: Production closed-signup config and separate staging config.");
          NODE

      - name: Install locked dependencies and run all Worker checks
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/auth-worker/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx wrangler --config wrangler.production.toml deploy --dry-run --outdir "$RUNNER_TEMP/production-worker-update-dry-run"

      - name: Verify exact existing Worker, D1 bindings, hostnames and secret names before deployment
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { writeFileSync } from "node:fs";
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const base = "https://api.cloudflare.com/client/v4";
          const headers = { Authorization: "Bearer " + token, Accept: "application/json" };
          const account = "/accounts/" + encodeURIComponent(accountId);
          async function read(path, label) {
            const response = await fetch(base + path,{headers,redirect:"error"});
            const body = await response.json().catch(()=>({}));
            if (!response.ok || body.success !== true) throw new Error(label + " failed with HTTP " + response.status);
            return body.result;
          }
          const [scripts, stageDomains, prodDomains, stageSettings, prodSettings, prodD1, prodSecrets] = await Promise.all([
            read(account + "/workers/scripts","Worker inventory"),
            read(account + "/workers/domains?hostname=auth.sykabelajar.my.id","Staging hostname"),
            read(account + "/workers/domains?hostname=auth-prod.sykabelajar.my.id","Production hostname"),
            read(account + "/workers/scripts/sykabelajar-auth-poc/settings","Staging binding"),
            read(account + "/workers/scripts/sykabelajar-auth-prod/settings","Production binding"),
            read(account + "/d1/database/6d4dc7b5-8e71-4fdc-9cda-3230e49951c7","Production D1"),
            read(account + "/workers/scripts/sykabelajar-auth-prod/secrets","Production secret-name inventory"),
          ]);
          if (!Array.isArray(scripts) || scripts.filter(x=>x?.id==="sykabelajar-auth-poc").length!==1 ||
              scripts.filter(x=>x?.id==="sykabelajar-auth-prod").length!==1) throw new Error("Both exact staging and Production Worker scripts must already exist.");
          if (!Array.isArray(stageDomains) || stageDomains.filter(x=>x?.hostname==="auth.sykabelajar.my.id"&&x?.service==="sykabelajar-auth-poc"&&x?.enabled===true).length!==1) {
            throw new Error("Staging hostname no longer points to its accepted staging Worker.");
          }
          if (!Array.isArray(prodDomains) || prodDomains.filter(x=>x?.hostname==="auth-prod.sykabelajar.my.id"&&x?.service==="sykabelajar-auth-prod"&&x?.enabled===true).length!==1) {
            throw new Error("Production hostname is not attached to its dedicated Worker.");
          }
          const stageDb=(stageSettings?.bindings??[]).filter(x=>x?.type==="d1"&&x?.name==="DB");
          const prodDb=(prodSettings?.bindings??[]).filter(x=>x?.type==="d1"&&x?.name==="DB");
          if(stageDb.length!==1||(stageDb[0].database_id??stageDb[0].id)!=="7a4f9008-a1c6-42b6-8a04-abde12699248") throw new Error("Staging D1 binding changed.");
          if(prodDb.length!==1||(prodDb[0].database_id??prodDb[0].id)!=="6d4dc7b5-8e71-4fdc-9cda-3230e49951c7") throw new Error("Production D1 binding changed.");
          if(prodD1?.name!=="sykabelajar-auth-prod"||prodD1?.uuid!=="6d4dc7b5-8e71-4fdc-9cda-3230e49951c7") throw new Error("Production D1 target mismatch.");
          if(!Array.isArray(prodSecrets)) throw new Error("Production secret-name inventory is unavailable.");
          const secretNames=prodSecrets.map(x=>x?.name).filter(Boolean).sort();
          for(const name of ["BETTER_AUTH_SECRET","AUTH_PROVIDER_ENCRYPTION_KEY","AUTH_EMAIL_ENCRYPTION_KEY"]) {
            if(secretNames.filter(x=>x===name).length!==1) throw new Error("Required Production Worker secret binding missing: "+name);
          }
          writeFileSync(process.env.RUNNER_TEMP+"/production-secret-names-before.txt",secretNames.join("\n"));
          writeFileSync(process.env.RUNNER_TEMP+"/production-secret-names-before.sha256",createHash("sha256").update(secretNames.join("\n")).digest("hex"));
          console.log(JSON.stringify({
            stagingWorkerAndD1:"verified unchanged",
            productionWorkerAndD1:"verified existing target",
            productionHostname:"verified existing attachment",
            requiredProductionSecretNames: ["BETTER_AUTH_SECRET","AUTH_PROVIDER_ENCRYPTION_KEY","AUTH_EMAIL_ENCRYPTION_KEY"],
            secretValuesRead:false,
            productionSecretNamesFingerprint: createHash("sha256").update(secretNames.join("\n")).digest("hex"),
          }));
          NODE

      - name: Require the reviewed Production D1 baseline and Custom HTTP email routing
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.production.toml d1 migrations list sykabelajar-auth-prod --remote
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT name FROM d1_migrations ORDER BY name;" > "$RUNNER_TEMP/production-worker-migrations.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='auth_email_provider_accounts';" > "$RUNNER_TEMP/production-worker-email-schema.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const root=process.env.RUNNER_TEMP;
          const walk=(v,out=[])=>{if(Array.isArray(v))v.forEach(x=>walk(x,out));else if(v&&typeof v==="object"){out.push(v);Object.values(v).forEach(x=>{if(x&&typeof x==="object")walk(x,out);});}return out;};
          const migrations=walk(JSON.parse(readFileSync(root+"/production-worker-migrations.json","utf8"))).map(x=>x.name).filter(Boolean).sort();
          const expected=[
            "0000_auth_worker_internal_config.sql","0001_better_auth.sql","0002_seed_first_party_oauth_client.sql",
            "0003_zeptomail_agent_settings.sql","0004_better_auth_registration_attributes.sql",
            "0005_telegram_phone_verification.sql","0006_transactional_email_provider.sql",
            "0007_managed_social_login_providers.sql","0008_auth_runtime_settings.sql",
            "0009_multi_provider_email_routing.sql","0010_custom_http_email_provider.sql",
          ].sort();
          if(JSON.stringify(migrations)!==JSON.stringify(expected)) throw new Error("Production D1 must have exactly migrations 0000–0010 before Worker update.");
          const schema=String(walk(JSON.parse(readFileSync(root+"/production-worker-email-schema.json","utf8"))).find(x=>typeof x.sql==="string")?.sql??"").toLowerCase();
          if(schema.includes("'zeptomail'")||!schema.includes("'custom_http'")||!schema.includes("'sendpulse'")) throw new Error("Production D1 email provider schema does not match the approved provider allowlist.");
          console.log("PASS: Production D1 schema 0000–0010 and approved email provider constraint verified.");
          NODE

      - name: Capture Better Auth identity and email-provider state before Worker-only deployment
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT (SELECT COUNT(*) FROM \"user\") AS users,(SELECT COUNT(*) FROM \"account\") AS accounts,(SELECT COUNT(*) FROM \"session\") AS sessions,(SELECT COUNT(*) FROM auth_email_provider_accounts) AS email_accounts;" > "$RUNNER_TEMP/production-worker-before-counts.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT 'user' AS entity,id AS entity_id,NULL AS user_id,NULL AS provider_id,NULL AS account_id FROM \"user\" UNION ALL SELECT 'account',id,\"userId\",\"providerId\",\"accountId\" FROM \"account\" UNION ALL SELECT 'session',id,\"userId\",NULL,NULL FROM \"session\" ORDER BY entity,entity_id;" > "$RUNNER_TEMP/production-worker-before-identity.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT id,label,provider,credentials_ciphertext,enabled,priority,quota_hour_limit,quota_day_limit,quota_month_limit,hour_bucket,hour_used,day_bucket,day_used,month_bucket,month_used,cooldown_until,last_error_code,last_error_at,last_success_at FROM auth_email_provider_accounts ORDER BY id;" > "$RUNNER_TEMP/production-worker-before-email.json"

      - name: Deploy the updated Production Worker without changing secret bindings
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.production.toml deploy --message "Update isolated Better Auth Production Worker $GITHUB_SHA"

      - name: Verify Production runtime, staging invariants, secret names and D1 rows after deployment
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const origin="https://auth-prod.sykabelajar.my.id";
          const appOrigin="https://sykabelajar.my.id";
          const base="https://api.cloudflare.com/client/v4";
          const account=encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID);
          const headers={Authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN,Accept:"application/json"};
          async function read(path){const r=await fetch(base+path,{headers,redirect:"error"});const b=await r.json().catch(()=>({}));if(!r.ok||b.success!==true)throw new Error("Cloudflare metadata read failed: "+r.status);return b.result;}
          const [scripts,stageDomains,prodDomains,stageSettings,prodSettings,secretRows]=await Promise.all([
            read("/accounts/"+account+"/workers/scripts"),
            read("/accounts/"+account+"/workers/domains?hostname=auth.sykabelajar.my.id"),
            read("/accounts/"+account+"/workers/domains?hostname=auth-prod.sykabelajar.my.id"),
            read("/accounts/"+account+"/workers/scripts/sykabelajar-auth-poc/settings"),
            read("/accounts/"+account+"/workers/scripts/sykabelajar-auth-prod/settings"),
            read("/accounts/"+account+"/workers/scripts/sykabelajar-auth-prod/secrets"),
          ]);
          assert.ok(scripts.some(x=>x?.id==="sykabelajar-auth-poc"));
          assert.ok(scripts.some(x=>x?.id==="sykabelajar-auth-prod"));
          assert.ok(stageDomains.some(x=>x?.hostname==="auth.sykabelajar.my.id"&&x?.service==="sykabelajar-auth-poc"&&x?.enabled===true));
          assert.ok(prodDomains.some(x=>x?.hostname==="auth-prod.sykabelajar.my.id"&&x?.service==="sykabelajar-auth-prod"&&x?.enabled===true));
          const stageDb=(stageSettings?.bindings??[]).filter(x=>x?.type==="d1"&&x?.name==="DB");
          const prodDb=(prodSettings?.bindings??[]).filter(x=>x?.type==="d1"&&x?.name==="DB");
          assert.equal(stageDb.length,1);
          assert.equal(stageDb[0].database_id??stageDb[0].id,"7a4f9008-a1c6-42b6-8a04-abde12699248");
          assert.equal(prodDb.length,1);
          assert.equal(prodDb[0].database_id??prodDb[0].id,"6d4dc7b5-8e71-4fdc-9cda-3230e49951c7");
          const secretNames=secretRows.map(x=>x?.name).filter(Boolean).sort();
          const prior=readFileSync(process.env.RUNNER_TEMP+"/production-secret-names-before.txt","utf8");
          const priorHash=readFileSync(process.env.RUNNER_TEMP+"/production-secret-names-before.sha256","utf8");
          assert.equal(secretNames.join("\n"),prior,"Production Worker secret names must remain unchanged");
          assert.equal(createHash("sha256").update(secretNames.join("\n")).digest("hex"),priorHash);

          async function get(path,requestOrigin){
            const r=await fetch(origin+path,{headers:requestOrigin?{Origin:requestOrigin}:{},redirect:"error"});
            const body=await r.json().catch(()=>null);
            assert.equal(r.status,200,path+" must respond HTTP 200");
            assert.ok(body&&typeof body==="object");
            return {response:r,body};
          }
          const health=(await get("/healthz")).body;
          assert.equal(health.ok,true);
          const discovery=(await get("/api/auth/.well-known/openid-configuration")).body;
          assert.equal(discovery.issuer,origin+"/api/auth");
          assert.ok(discovery.code_challenge_methods_supported?.includes("S256"));
          assert.equal(new URL(discovery.jwks_uri).origin,origin);
          const jwks=(await get(new URL(discovery.jwks_uri).pathname)).body;
          assert.ok(jwks.keys?.some(k=>k.kty==="EC"&&k.crv==="P-256"&&k.alg==="ES256"&&typeof k.kid==="string"&&!Object.hasOwn(k,"d")));
          const providers=await get("/api/auth/providers",appOrigin);
          assert.equal(providers.response.headers.get("Access-Control-Allow-Origin"),appOrigin);
          assert.equal(providers.body.emailVerificationRequired,true);
          const denied=await fetch(origin+"/api/auth/providers",{headers:{Origin:"https://attacker.example"},redirect:"error"});
          assert.equal(denied.headers.get("Access-Control-Allow-Origin"),null);
          const signup=await fetch(origin+"/api/auth/sign-up/email",{method:"POST",headers:{Origin:appOrigin,"Content-Type":"application/json"},body:JSON.stringify({name:"Blocked Worker Deploy Probe",email:"blocked-worker-deploy@example.invalid",password:"Never-Create-This-Account-1"}),redirect:"error"});
          assert.equal(signup.status,503,"Production signup must stay closed during this Worker code update");
          console.log(JSON.stringify({productionRuntime:"health/discovery/ES256 JWKS/PKCE verified",productionSignup:"closed",stagingWorkerAndD1:"unchanged",productionD1Binding:"unchanged",productionSecretNames:"unchanged",secretValuesRead:false}));
          NODE
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT (SELECT COUNT(*) FROM \"user\") AS users,(SELECT COUNT(*) FROM \"account\") AS accounts,(SELECT COUNT(*) FROM \"session\") AS sessions,(SELECT COUNT(*) FROM auth_email_provider_accounts) AS email_accounts;" > "$RUNNER_TEMP/production-worker-after-counts.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT 'user' AS entity,id AS entity_id,NULL AS user_id,NULL AS provider_id,NULL AS account_id FROM \"user\" UNION ALL SELECT 'account',id,\"userId\",\"providerId\",\"accountId\" FROM \"account\" UNION ALL SELECT 'session',id,\"userId\",NULL,NULL FROM \"session\" ORDER BY entity,entity_id;" > "$RUNNER_TEMP/production-worker-after-identity.json"
          npx wrangler --config wrangler.production.toml d1 execute sykabelajar-auth-prod --remote --json --command "SELECT id,label,provider,credentials_ciphertext,enabled,priority,quota_hour_limit,quota_day_limit,quota_month_limit,hour_bucket,hour_used,day_bucket,day_used,month_bucket,month_used,cooldown_until,last_error_code,last_error_at,last_success_at FROM auth_email_provider_accounts ORDER BY id;" > "$RUNNER_TEMP/production-worker-after-email.json"
          node --input-type=module <<'NODE'
          import {createHash} from "node:crypto";
          import {readFileSync} from "node:fs";
          const root=process.env.RUNNER_TEMP;
          const read=n=>JSON.parse(readFileSync(root+"/"+n,"utf8"));
          const rows=(v,out=[])=>{
            if(Array.isArray(v))v.forEach(x=>rows(x,out));
            else if(v&&typeof v==="object"){
              if(Array.isArray(v.results))v.results.forEach(x=>{if(x&&typeof x==="object")out.push(x);});
              else Object.values(v).forEach(x=>{if(x&&typeof x==="object")rows(x,out);});
            }
            return out;
          };
          const hash=v=>createHash("sha256").update(JSON.stringify(v)).digest("hex");
          const beforeCounts=rows(read("production-worker-before-counts.json")).find(x=>Object.hasOwn(x,"users"));
          const afterCounts=rows(read("production-worker-after-counts.json")).find(x=>Object.hasOwn(x,"users"));
          if(!beforeCounts||!afterCounts)throw new Error("Could not compare Production D1 counts.");
          for(const key of ["users","accounts","sessions","email_accounts"])if(Number(beforeCounts[key])!==Number(afterCounts[key]))throw new Error("Production D1 count changed during Worker deployment: "+key);
          for(const [beforeName,afterName] of [["production-worker-before-identity.json","production-worker-after-identity.json"],["production-worker-before-email.json","production-worker-after-email.json"]]){
            const before=rows(read(beforeName)),after=rows(read(afterName));
            if(hash(before)!==hash(after))throw new Error("Production identity/provider data changed during Worker-only deployment.");
          }
          console.log("PASS: Production D1 identities, sessions and provider configurations unchanged by Worker-only deployment.");
          NODE

      - name: Remove temporary verification output
        if: always()
        run: rm -rf -- "$RUNNER_TEMP"/production-worker-*
