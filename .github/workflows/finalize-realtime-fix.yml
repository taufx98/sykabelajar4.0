name: Finalize realtime lifecycle fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Patch AppLayout and migration source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/components/layout/AppLayout.tsx')
          s=p.read_text()
          s=s.replace("import { startPublicRealtime, startUserRealtime } from '@/lib/realtimeHub';", "import { startPublicRealtime } from '@/lib/realtimeHub';")
          s=s.replace("    const stopUser = startUserRealtime(user.id, isAdmin);\n", "")
          s=s.replace("      if (event.type === 'order-changed' && isAdmin) {", "      if (event.type === 'chat-thread-updated') {\n        void getUnreadChatCount(true).then((count) => {\n          setUnreadMessages(count);\n          setPersistentCache(chatCacheKey, count, { ttlMs: CHAT_CACHE_TTL });\n        }).catch(() => {});\n        return;\n      }\n      if (event.type === 'order-changed' && isAdmin) {")
          s=s.replace("      unsubscribe();\n      stopUser();\n      stopPublic();", "      unsubscribe();\n      stopPublic();")
          p.write_text(s)

          m=Path('supabase/migrations/20260902_realtime_chat_notifications.sql')
          if not m.exists():
              m.write_text("""do $$
begin
  if not exists (
    select 1 from pg_publication_rel pr
    join pg_publication p on p.oid = pr.prpubid
    join pg_class c on c.oid = pr.prrelid
    join pg_namespace n on n.oid = c.relnamespace
    where p.pubname = 'supabase_realtime' and n.nspname = 'public' and c.relname = 'chat_messages'
  ) then
    alter publication supabase_realtime add table public.chat_messages;
  end if;
  if not exists (
    select 1 from pg_publication_rel pr
    join pg_publication p on p.oid = pr.prpubid
    join pg_class c on c.oid = pr.prrelid
    join pg_namespace n on n.oid = c.relnamespace
    where p.pubname = 'supabase_realtime' and n.nspname = 'public' and c.relname = 'chat_threads'
  ) then
    alter publication supabase_realtime add table public.chat_threads;
  end if;
  if not exists (
    select 1 from pg_publication_rel pr
    join pg_publication p on p.oid = pr.prpubid
    join pg_class c on c.oid = pr.prrelid
    join pg_namespace n on n.oid = c.relnamespace
    where p.pubname = 'supabase_realtime' and n.nspname = 'public' and c.relname = 'notifications'
  ) then
    alter publication supabase_realtime add table public.notifications;
  end if;
end $$;
""")

          assert 'startUserRealtime' not in s, 'AppLayout still imports/uses startUserRealtime'
          assert 'setInterval' not in s, 'AppLayout still has polling'
          assert "event.type === 'chat-thread-updated'" in s, 'AppLayout missing chat-thread-updated handler'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/layout/AppLayout.tsx supabase/migrations/20260902_realtime_chat_notifications.sql
          git commit -m 'fix(realtime): finalize global chat badge lifecycle'
          git push
