name: tmp-chat-audit-push2
on:
  push:
    branches: [main]
    paths: ['.chat-audit-trigger2']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat realtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def req(path, pattern, repl):
              p=Path(path); s=p.read_text()
              s2,n=re.subn(pattern,repl,s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'pattern not found: {path}: {pattern[:120]}')
              p.write_text(s2)

          p=Path('src/components/layout/AppLayout.tsx'); s=p.read_text()
          s=s.replace("import { startPublicRealtime } from '@/lib/realtimeHub';","import { startPublicRealtime, startUserRealtime } from '@/lib/realtimeHub';",1)
          s=s.replace("    const chatCacheKey = `chat.unread.${user.id}`;","    const stopUser = startUserRealtime(user.id, isAdmin);\n\n    const chatCacheKey = `chat.unread.${user.id}`;",1)
          s=s.replace("      if (event.type === 'chat-message') {.*?      if (event.type === 'chat-read' || event.type === 'chat-hidden') {.*?      }\n", "", 1) if re.search(r"      if \(event\.type === 'chat-message'\).*?      if \(event\.type === 'chat-read' \|\| event\.type === 'chat-hidden'\).*?      }\n",s,re.S) else s
          s=s.replace("      if (event.type === 'chat-read' || event.type === 'chat-hidden') {\n", "      if (event.type === 'chat-read' || event.type === 'chat-hidden') {\n        void getUnreadChatCount(true).then((count) => { setUnreadMessages(count); setPersistentCache(chatCacheKey, count, { ttlMs: CHAT_CACHE_TTL }); }).catch(() => {});\n        return;\n      }\n      if (event.type === 'chat-thread-updated') {\n",1) if "if (event.type === 'chat-read' || event.type === 'chat-hidden')" in s else s
          # Ensure an exact thread-update handler exists if the previous block survived unexpectedly.
          if "if (event.type === 'chat-thread-updated')" not in s:
              marker="      if (event.type === 'order-changed' && isAdmin) {"
              s=s.replace(marker,"      if (event.type === 'chat-thread-updated') { void getUnreadChatCount(true).then((count) => { setUnreadMessages(count); setPersistentCache(chatCacheKey, count, { ttlMs: CHAT_CACHE_TTL }); }).catch(() => {}); return; }\n"+marker,1)
          s=s.replace("      stopPublic();\n    };","      stopUser();\n      stopPublic();\n    };",1)
          p.write_text(s)

          req('src/pages/MessagesPageV6.tsx',r"import \{ emitSykaEvent \} from '@/lib/realtimeBus';", "import { emitSykaEvent, subscribeSykaEvents } from '@/lib/realtimeBus';")
          req('src/pages/MessagesPageV6.tsx',r"setMessages\(rows\);cacheSet\(selected\.id,rows\);setHasOlder\(rows\.length>=PAGE\);", "setMessages(current => { const byId = new Map(rows.map(x => [x.id, x])); for (const item of current) if (!byId.has(item.id)) byId.set(item.id, item); const merged = [...byId.values()].sort((a,b) => a.created_at.localeCompare(b.created_at)); cacheSet(selected.id, merged); return merged; }); setHasOlder(rows.length>=PAGE);")
          req('src/pages/MessagesPageV6.tsx',r"const ch=supabase\.channel\('chat-stable-'\+selected\.id\)", "const unsubscribeBus = subscribeSykaEvents((event) => { if (event.type === 'chat-message') { const m = event.message as unknown as ChatMessage; if (m.thread_id === selected.id) setThreads(v => v.map(t => t.id === selected.id ? { ...t, last_message: m.body, last_message_at: m.created_at, unread_count: m.sender_id === me ? t.unread_count : 0 } : t)); } if (event.type === 'chat-thread-updated' && String(event.thread.id ?? '') === selected.id) setSelected(v => v ? { ...v, ...(event.thread as unknown as ChatThread) } : v); }); const ch=supabase.channel('chat-stable-'+selected.id)")
          req('src/pages/MessagesPageV6.tsx',r"return\(\)=>\{live=false;void supabase\.removeChannel\(ch\)\}\},\[selected\?\.id,me,refresh,toast\]\);", "return()=>{live=false;unsubscribeBus();void supabase.removeChannel(ch)}},[selected?.id,me,refresh,toast]);")
          req('src/pages/MessagesPageV6.tsx',r"const saved=await sendMessage\(selected\.id,text\);setMessages\(v=>v\.map\(x=>x\.id===optimistic\.id\?saved:x\)\);cacheSet\(selected\.id,\[\.\.\.messages,saved\]\)", "const saved=await sendMessage(selected.id,text);setMessages(v=>{const next=v.map(x=>x.id===optimistic.id?saved:x);cacheSet(selected.id,next);return next})")

          req('src/components/ui/ChatWidget.tsx',r"import \{ subscribeSykaEvents \} from '@/lib/realtimeBus';", "import { emitSykaEvent, subscribeSykaEvents } from '@/lib/realtimeBus';")
          req('src/components/ui/ChatWidget.tsx',r"const msgs = await loadChatMessagesPage\(thread\.id\);\s*setMessages\(msgs\);", "const msgs = await loadChatMessagesPage(thread.id); setMessages(current => { const byId = new Map(msgs.map(x => [x.id, x])); for (const item of current) if (!byId.has(item.id)) byId.set(item.id, item); return [...byId.values()].sort((a,b) => a.created_at.localeCompare(b.created_at)); });")
          req('src/components/ui/ChatWidget.tsx',r"if \(!alive \|\| !message\?\.id\) return;\s*setMessages\(\(current\) => current\.some\(\(item\) => item\.id === message\.id\) \? current : \[\.\.\.current, message\]\);", "if (!alive || !message?.id) return; setMessages((current) => { const next = current.some((item) => item.id === message.id) ? current : [...current, message]; return next.sort((a,b) => a.created_at.localeCompare(b.created_at)); }); emitSykaEvent({ type: 'chat-message', message: message as unknown as Record<string, unknown> });")
          req('src/components/ui/ChatWidget.tsx',r"setMessages\(\(prev\) => prev\.some\(\(item\) => item\.id === msg\.id\) \? prev : \[\.\.\.prev, msg\]\);\s*setInput\(''\);", "setMessages((prev) => { const next = prev.some((item) => item.id === msg.id) ? prev : [...prev, msg]; next.sort((a,b) => a.created_at.localeCompare(b.created_at)); return next; }); emitSykaEvent({ type: 'chat-message', message: msg as unknown as Record<string, unknown> }); setInput('');")

          req('src/pages/AdminChatConsolePage.tsx',r"import \{ supabase \} from '@/lib/supabase';", "import { supabase } from '@/lib/supabase';\nimport { emitSykaEvent, subscribeSykaEvents } from '@/lib/realtimeBus';")
          req('src/pages/AdminChatConsolePage.tsx',r"const refresh = useCallback\(async \(\) => \{ try \{ setThreads\(await loadMyThreads\(\)\); \}", "const refresh = useCallback(async () => { try { setThreads(await loadMyThreads(true)); }")
          req('src/pages/AdminChatConsolePage.tsx',r"useEffect\(\(\) => \{ void refresh\(\); const channel = supabase\.channel\('admin-chat-threads-live'\).*?\}, \[refresh\]\);", "useEffect(() => { void refresh(); const bus = subscribeSykaEvents((event) => { if (event.type !== 'chat-message') return; const m = event.message as unknown as ChatMessage; setThreads(current => current.map(item => item.id === m.thread_id ? { ...item, last_message: m.body, last_message_at: m.created_at, unread_count: m.sender_id === user?.id ? item.unread_count : 0 } : item)); }); const channel = supabase.channel('admin-chat-threads-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_threads'},()=>void refresh()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_threads'},payload=>{const updated=payload.new as ChatThread;setThreads(current=>current.map(item=>item.id===updated.id?{...item,...updated}:item));}).subscribe((status,error)=>{if(error)console.error('[SykaBelajar] admin chat thread realtime error',status,error)});return()=>{bus();void supabase.removeChannel(channel);}; }, [refresh,user?.id]);")
          req('src/pages/AdminChatConsolePage.tsx',r"if\(live\)setMessages\(v=>v\.some\(x=>x\.id===m\.id\)\?v:\[\.\.\.v,m\]\);\}\)\.on\('postgres_changes',\{event:'UPDATE',schema:'public',table:'chat_threads'", "if(live){setMessages(v=>v.some(x=>x.id===m.id)?v:[...v,m]);emitSykaEvent({type:'chat-message',message:m as unknown as Record<string,unknown>});}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_threads'")
          req('src/pages/AdminChatConsolePage.tsx',r"const msg = await sendMessage\(selected\.id, input\.trim\(\)\); setMessages\(v => v\.some\(x => x\.id === msg\.id\) \? v : \[\.\.\.v, msg\]\); setInput\(''\); await refresh\(\);", "const msg = await sendMessage(selected.id, input.trim()); setMessages(v => v.some(x => x.id === msg.id) ? v : [...v, msg]); emitSykaEvent({ type: 'chat-message', message: msg as unknown as Record<string, unknown> }); setInput('');")

          Path('.chat-audit-trigger2').unlink(missing_ok=True)
          Path('.github/workflows/tmp-fix-chat-audit.yml').unlink(missing_ok=True)
          Path('.github/workflows/tmp-chat-audit-push.yml').unlink(missing_ok=True)
          Path('.github/workflows/tmp-chat-audit-push2.yml').unlink(missing_ok=True)
          print('patched and cleaned')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(chat): complete realtime lifecycle cache and event propagation'
          git push
