name: Auth Runtime Settings D1 Staging Migration
on:
  push:
    branches: [security/auth-temporary-email-bypass]
    paths: [.github/auth-ops/APPLY-STAGING-D1-0009]
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY-TO-sykabelajar-auth-poc-runtime-settings"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: auth-runtime-settings-d1-staging
  cancel-in-progress: false
jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/security/auth-temporary-email-bypass' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/auth-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/auth-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Verify exact staging D1 target and migration marker
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "APPLY-TO-sykabelajar-auth-poc-runtime-settings"
          else
            test "$(cat ../../.github/auth-ops/APPLY-STAGING-D1-0009)" = "APPLY-TO-sykabelajar-auth-poc-runtime-settings"
          fi
          grep -q '^database_name = "sykabelajar-auth-poc"$' wrangler.toml
          grep -q '^database_id = "7a4f9008-a1c6-42b6-8a04-abde12699248"$' wrangler.toml
          grep -q 'email_verification_required INTEGER NOT NULL DEFAULT 1' migrations/0009_auth_runtime_settings.sql
          npx wrangler d1 execute sykabelajar-auth-poc --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='auth_runtime_settings';" > "$RUNNER_TEMP/runtime-settings-before.txt"
          if grep -q "auth_runtime_settings" "$RUNNER_TEMP/runtime-settings-before.txt"; then
            echo "Runtime settings table already exists; migration is idempotent. No change needed."
            exit 0
          fi
      - name: Apply only additive migration 0009 to dedicated staging D1
        run: npx wrangler d1 execute sykabelajar-auth-poc --remote --file migrations/0009_auth_runtime_settings.sql
      - name: Verify safe default is REQUIRED
        run: |
          set -euo pipefail
          npx wrangler d1 execute sykabelajar-auth-poc --remote --command "SELECT email_verification_required,updated_by FROM auth_runtime_settings WHERE id=1;" > "$RUNNER_TEMP/runtime-settings-after.txt"
          grep -q "1" "$RUNNER_TEMP/runtime-settings-after.txt"
          echo "Runtime setting exists and email verification defaults to REQUIRED."
