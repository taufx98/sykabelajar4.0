name: CI repair admin page
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          admin = Path('src/pages/AdminPlanUsagePageV2.tsx')
          s = admin.read_text()
          jsx_old = '})}</div></div></div></Card><Card className="p-5 md:p-6">'
          jsx_new = '})}</div></div></Card><Card className="p-5 md:p-6">'
          if jsx_old in s:
              s = s.replace(jsx_old, jsx_new, 1)
          elif jsx_new not in s:
              raise SystemExit('Admin JSX target not found')
          old_meta = "function methodMeta(method: OrganizerPaymentMethod) { return { bankName: String(method.details?.bank_name ?? ''), accountNumber: String(method.details?.account_number ?? ''), accountName: String(method.details?.account_name ?? ''), instructions: String(method.details?.instructions ?? method.details?.text ?? '') }; }"
          new_meta = "function methodMeta(method: OrganizerPaymentMethod) { return { bankName: String(method.details?.bank_name ?? ''), accountNumber: String(method.details?.account_number ?? ''), accountName: String(method.details?.account_name ?? ''), instructions: String(method.details?.instructions ?? method.details?.text ?? ''), randomCodeEnabled: Boolean(method.details?.random_code_enabled) }; }"
          if old_meta in s:
              s = s.replace(old_meta, new_meta, 1)
          admin.write_text(s)

          user = Path('src/pages/OrganizerPlanPageV2.tsx')
          u = user.read_text()
          old_payload = 'const payload = { ...contactFields, ...(selectedRandomEnabled ? { payment_random_code: String(paymentRandomCode) } : {}) };'
          new_payload = 'const payload: Record<string, string> = { ...contactFields, ...(selectedRandomEnabled ? { payment_random_code: String(paymentRandomCode) } : {}) };'
          if old_payload in u:
              u = u.replace(old_payload, new_payload, 1)
          elif new_payload not in u:
              raise SystemExit('Organizer payment payload target not found')
          user.write_text(u)
          print('FINAL_SOURCE_REPAIR_READY')
          PY
      - name: Install dependencies
        run: npm ci --silent
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Commit fix and remove repair workflow
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/AdminPlanUsagePageV2.tsx src/pages/OrganizerPlanPageV2.tsx
          git commit -m "fix(ci): finalize payment source repair"
          git rm .github/workflows/ci-repair-admin.yml
          git rm CI_TRIGGER.txt CI_TRIGGER_2.txt CI_TRIGGER_3.txt CI_TRIGGER_4.txt CI_TRIGGER_5.txt 2>/dev/null || true
          git commit -m "chore: remove temporary ci repair workflow"
          git push