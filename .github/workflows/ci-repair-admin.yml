name: CI repair admin page
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(ci): restore admin page') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore known-valid AdminPlanUsagePageV2
        run: |
          git checkout 33b64fa84462ef067609580ee75e0abe34e662e2 -- src/pages/AdminPlanUsagePageV2.tsx
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/AdminPlanUsagePageV2.tsx
          git commit -m "fix(ci): restore admin page" || true
          git rm .github/workflows/ci-repair-admin.yml
          git commit -m "chore: remove ci repair workflow"
          git push