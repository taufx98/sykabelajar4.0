name: CI repair admin page
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(ci): repair admin plan JSX') && !startsWith(github.event.head_commit.message, 'chore: remove ci repair workflow') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair JSX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminPlanUsagePageV2.tsx')
          s = p.read_text()
          old = '})}</div></div></div></Card><Card className="p-5 md:p-6">'
          new = '})}</div></div></Card><Card className="p-5 md:p-6">'
          if old not in s:
              raise SystemExit('target JSX sequence not found')
          p.write_text(s.replace(old, new, 1))
          print('ADMIN_PLAN_JSX_REPAIRED')
          PY
      - name: Install dependencies
        run: npm ci --silent
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build
        run: npm run build
      - name: Commit fix and remove repair workflow
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/AdminPlanUsagePageV2.tsx
          git commit -m "fix(ci): repair admin plan JSX"
          git rm .github/workflows/ci-repair-admin.yml
          git commit -m "chore: remove ci repair workflow"
          git push