name: Patch global chat badge realtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch global chat badge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/layout/AppLayout.tsx')
          s=p.read_text()
          s=s.replace("import { startPublicRealtime, startUserRealtime } from '@/lib/realtimeHub';", "import { startPublicRealtime } from '@/lib/realtimeHub';")
          s=s.replace("    const stopUser = startUserRealtime(user.id, isAdmin);\n", "")
          marker="""      if (event.type === 'order-changed' && isAdmin) {"""
          insert="""      if (event.type === 'chat-thread-updated') {\n        void getUnreadChatCount(true).then((count) => {\n          setUnreadMessages(count);\n          setPersistentCache(chatCacheKey, count, { ttlMs: CHAT_CACHE_TTL });\n        }).catch(() => {});\n        return;\n      }\n"""
          if "event.type === 'chat-thread-updated'" not in s:
              if marker not in s: raise SystemExit('order handler marker not found')
              s=s.replace(marker, insert+marker, 1)
          s=s.replace("      stopUser();\n", "")
          p.write_text(s)
          assert 'startUserRealtime' not in s
          assert "event.type === 'chat-thread-updated'" in s
          assert 'setInterval' not in s
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/layout/AppLayout.tsx
          git rm .github/workflows/patch-global-chat-badge.yml || true
          git commit -m 'fix(realtime): update global chat badge from thread events'
          git push
