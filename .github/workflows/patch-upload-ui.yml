name: Patch organizer payment upload visibility

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(payment): make proof upload persistently visible'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch checkout UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()
          old = "const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(selectedMethod.payment_type).toUpperCase());\n  const showProofUpload = selectedTotal > 0 && selectedMethodNeedsProof;"
          new = "const selectedMethodType = String(selectedMethod?.payment_type ?? '').trim().toUpperCase();\n  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(selectedMethodType);\n  const hasManualPaymentMethod = paymentMethods.some((method) => !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(method.payment_type ?? '').trim().toUpperCase()));\n  const showProofUpload = selectedTotal > 0 && (selectedMethodNeedsProof || (!selectedMethod && hasManualPaymentMethod));"
          if old not in s:
              raise SystemExit('payment proof condition target not found')
          s = s.replace(old, new, 1)
          old2 = "className=\"order-4 mt-5 overflow-hidden rounded-2xl border-2 border-accent/50 bg-accent/10 shadow-lg shadow-accent/5\""
          new2 = "className=\"order-4 sticky bottom-0 z-20 mt-5 overflow-hidden rounded-2xl border-2 border-accent/50 bg-surface shadow-2xl shadow-black/20 ring-1 ring-accent/20\""
          if old2 not in s:
              raise SystemExit('upload card class target not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/OrganizerPlanPageV2.tsx
          git diff --cached --quiet || git commit -m "fix(payment): make proof upload persistently visible"
          git push