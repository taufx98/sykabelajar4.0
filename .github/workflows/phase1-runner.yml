name: Phase 1 Canonical Consolidation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event.head_commit.message != 'refactor: canonicalize phase 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonicalize application files and callers
        shell: bash
        run: |
          set -euo pipefail

          # Promote the active implementations to stable canonical filenames.
          rm -f src/pages/AdminPlanUsagePage.tsx
          mv src/pages/AdminPlanUsagePageV2.tsx src/pages/AdminPlanUsagePage.tsx

          rm -f src/pages/OrganizerPlanPage.tsx
          mv src/pages/OrganizerPlanPageV2.tsx src/pages/OrganizerPlanPage.tsx

          mv src/pages/ProfilePageV4.tsx src/pages/ProfilePage.tsx
          rm -f src/pages/ProfilePageV3.tsx

          mv src/pages/NotificationsPageV2.tsx src/pages/NotificationsPage.tsx
          mv src/pages/MessagesPageV6.tsx src/pages/MessagesPage.tsx
          mv src/pages/AdminChatConsolePageV3.tsx src/pages/AdminChatConsolePage.tsx
          rm -f src/pages/AdminChatConsolePageV2.tsx

          rm -f src/pages/AdminPage.tsx.tmp src/pages/AdminUsernameMove.tmp

          # Canonicalize exported identifiers/callers and Supabase RPC names.
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/\bProfilePageV4\b/ProfilePage/g; s/\bProfilePageV3\b/ProfilePage/g; s/\bNotificationsPageV2\b/NotificationsPage/g; s/\bMessagesPageV6\b/MessagesPage/g; s/\bAdminChatConsolePageV3\b/AdminChatConsolePage/g; s/\bAdminPlanUsagePageV2\b/AdminPlanUsagePage/g; s/\bOrganizerPlanPageV2\b/OrganizerPlanPage/g; s/\bcreateOrganizerPlanOrderV3\b/createOrganizerPlanOrder/g; s/\bregister_for_competition_v4_8\b/register_for_competition/g; s/\bload_my_threads_v2\b/load_my_threads/g; s/\bcreate_organizer_plan_order_v3\b/create_organizer_plan_order/g'

          # Keep the repository migration history aligned with production.
          cat > supabase/migrations/20260906_phase_1_canonicalize_public_rpc.sql <<'SQL'
          -- Phase 1: canonical public RPC names. Production was migrated before this file
          -- was committed; migration history remains append-only.
          begin;
          drop function if exists public.create_organizer_plan_order_v2(uuid, text, text, text, text, text, integer, integer, text, text, text);
          drop function if exists public.get_public_competitions_v2(integer);
          drop function if exists public.get_public_feed_v2(integer, timestamptz);
          commit;
          SQL

          git rm -f .github/workflows/phase1-runner.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: canonicalize phase 1'
          git push