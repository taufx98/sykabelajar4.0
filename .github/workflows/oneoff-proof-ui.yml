name: Apply checkout proof UI patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/pages/OrganizerPlanPageV2.tsx"); s=p.read_text(); old="const selectedMethodNeedsProof = !!selectedMethod && ![\"MIDTRANS\", \"SNAP\", \"VIRTUAL_ACCOUNT\"].includes(String(selectedMethod.payment_type).toUpperCase());\n  const showProofUpload = selectedTotal > 0 && selectedMethodNeedsProof;"; new="const selectedMethodType = String(selectedMethod?.payment_type ?? \"\").trim().toUpperCase();\n  const selectedMethodNeedsProof = !!selectedMethod && ![\"MIDTRANS\", \"SNAP\", \"VIRTUAL_ACCOUNT\"].includes(selectedMethodType);\n  const hasManualPaymentMethod = paymentMethods.some((method) => ![\"MIDTRANS\", \"SNAP\", \"VIRTUAL_ACCOUNT\"].includes(String(method.payment_type ?? \"\").trim().toUpperCase()));\n  const showProofUpload = selectedTotal > 0 && (selectedMethodNeedsProof || (!selectedMethod && hasManualPaymentMethod));"; assert old in s, "proof condition target not found"; s=s.replace(old,new,1); old2="<div className=\"fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-3 sm:p-4\"><div className=\"flex w-full max-w-lg max-h-[78vh] flex-col overflow-auto rounded-3xl"; new2="<div className=\"fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-3 sm:p-4\"><div className=\"flex w-full max-w-lg max-h-[82vh] flex-col overflow-auto overscroll-contain rounded-3xl"; assert old2 in s, "modal target not found"; s=s.replace(old2,new2,1); old3="<div className=\"order-4 mt-5 overflow-hidden rounded-2xl border-2 border-accent/50 bg-accent/10 shadow-lg shadow-accent/5\">"; new3="<div data-testid=\"checkout-proof-upload\" className=\"order-4 sticky bottom-1 z-30 mt-5 overflow-hidden rounded-2xl border-2 border-accent/60 bg-surface shadow-2xl shadow-black/25 ring-1 ring-accent/20\">"; assert old3 in s, "upload target not found"; s=s.replace(old3,new3,1); p.write_text(s)' 
          git rm .github/workflows/oneoff-proof-ui.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/OrganizerPlanPageV2.tsx
          git commit -m 'fix(payment): keep organizer proof upload visible'
          git push