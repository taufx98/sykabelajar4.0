name: Payment checkout v4 patch
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch checkout UI
        shell: bash
        run: |
          MSG="$(git log -1 --pretty=%B)"
          if [[ "$MSG" == "feat(payment): v4 final checkout"* || "$MSG" == "chore: remove payment checkout v4 patch"* ]]; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/pages/OrganizerPlanPageV2.tsx'); s=p.read_text()
          # Current file already contains human-label helpers, selectedRandomEnabled and paymentTransferTotal from earlier patch.
          # Replace only the payment-method selector UI.
          start=s.find('{paymentMethods.length > 0 && <div className="order-3 mt-5">')
          end=s.find('{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5', start)
          if start<0 or end<0: raise SystemExit('payment selector bounds not found')
          selector='''{paymentMethods.length > 0 && <div className="order-3 mt-5"><p className="text-xs font-semibold text-fg-muted">Metode pembayaran</p><div className="mt-2 space-y-2">{paymentMethods.map((method) => <button key={method.id} type="button" onClick={() => { setSelectedPaymentMethodId(method.id); setContactFields((current) => ({ ...current, __payment_random_code: String(method.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(method.details?.random_code_enabled) && selectedTotal > 0 ? String(Math.floor(Math.random() * 900) + 100) : '' })); }} className={`w-full rounded-2xl border p-4 text-left transition ${selectedPaymentMethodId === method.id ? 'border-accent bg-accent/5' : 'border-surface-border bg-surface-elevated/25 hover:bg-surface-elevated/50'}`}><div className="flex items-start justify-between gap-3"><div className="min-w-0 flex-1"><p className="text-sm font-bold text-fg">{paymentTypeLabel(method.payment_type)}{paymentBankName(method) ? ` · ${paymentBankName(method)}` : ''}</p>{paymentAccountNumber(method) && <div className="mt-3 rounded-xl border border-surface-border bg-surface-elevated/35 p-3"><div className="flex items-center justify-between gap-2"><span className="text-[10px] font-semibold uppercase tracking-wider text-fg-muted">Nomor Rekening</span><button type="button" onClick={(e) => { e.stopPropagation(); navigator.clipboard.writeText(paymentAccountNumber(method)).then(() => toast.success('Nomor rekening disalin.')).catch(() => toast.error('Nomor rekening tidak dapat disalin.')); }} className="inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs font-semibold text-accent hover:bg-accent/10"><Copy size={13}/> Salin</button></div><p className="mt-1 text-3xl font-black tracking-wider text-fg">{paymentAccountNumber(method)}</p>{paymentAccountName(method) && <p className="mt-1 text-xs text-fg-muted">a.n. {paymentAccountName(method)}</p>}</div>}</div>{selectedPaymentMethodId === method.id && <CheckCircle2 size={17} className="mt-1 shrink-0 text-accent"/>}</div></button>)}</div></div>}
        '''
          s=s[:start]+selector+s[end:]

          # Replace uploader with a single prominent card. Existing proof state/handlers are retained.
          up_start=s.find('{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5')
          up_end=s.find('{paymentFields.filter', up_start)
          if up_start<0 or up_end<0: raise SystemExit('uploader bounds not found')
          uploader='''{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5 overflow-hidden rounded-2xl border-2 border-accent/40 bg-accent/5"><div className="p-5"><div className="flex items-start gap-3"><div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-accent/10"><UploadCloud size={21} className="text-accent"/></div><div><p className="text-base font-bold text-fg">Upload Bukti Transfer</p><p className="mt-1 text-xs leading-5 text-fg-muted">Unggah bukti pembayaran setelah transfer.</p></div></div><Button className="mt-4 w-full" onClick={() => proofInputRef.current?.click()} icon={<UploadCloud size={15}/>}>{proofFile ? 'Ganti Bukti Transfer' : 'Pilih Bukti Transfer'}</Button><input ref={proofInputRef} className="hidden" type="file" accept="image/png,image/jpeg,image/webp" onChange={(e) => chooseProof(e.target.files?.[0])}/>{proofFile && <div className="mt-3 flex items-center gap-3 rounded-xl border border-surface-border bg-surface-elevated/35 p-3"><div className="min-w-0 flex-1"><p className="truncate text-xs font-semibold text-fg">{proofFile.name}</p><p className="mt-1 text-[10px] text-fg-muted">Bukti pembayaran siap dikirim.</p></div><button type="button" onClick={removeProof} className="rounded-lg p-2 text-red-400 hover:bg-red-500/10" aria-label="Hapus bukti transfer"><X size={15}/></button></div>}{proofPreviewUrl && <div className="relative mt-3 overflow-hidden rounded-2xl border border-surface-border bg-black/20"><img src={proofPreviewUrl} alt="Preview bukti transfer" className="max-h-64 w-full object-contain"/></div>}</div></div>}
        '''
          s=s[:up_start]+uploader+s[up_end:]

          # Keep final payment display consistent with random code.
          if 'paymentTransferTotal' in s:
              s=s.replace("{selectedTotal === 0 ? 'GRATIS' : money(selectedTotal, paymentPlan.currency)}", "{selectedTotal === 0 ? 'GRATIS' : money(paymentTransferTotal, paymentPlan.currency)}", 1)

          # Admin: remove old visible backend enum/instructions from cards and ensure friendly form fields.
          q=Path('src/pages/AdminPlanUsagePageV2.tsx'); a=q.read_text()
          if 'function paymentTypeLabel(value: string)' not in a:
              a=a.replace('function methodMeta(method: OrganizerPaymentMethod) {', "function paymentTypeLabel(value: string) { const type=value.toUpperCase(); if(type==='BANK_TRANSFER') return 'Transfer Bank'; if(type==='QRIS') return 'QRIS'; if(type==='VIRTUAL_ACCOUNT') return 'Virtual Account'; if(type==='EWALLET') return 'E-Wallet'; if(type==='MIDTRANS') return 'Pembayaran Otomatis'; if(type==='SNAP') return 'Payment Gateway'; return 'Metode Pembayaran'; }\nfunction methodMeta(method: OrganizerPaymentMethod) {",1)
          a=re.sub(r'<label className="text-xs font-medium text-fg-muted">Nama metode.*?</label>', '', a, count=1, flags=re.S)
          a=re.sub(r'<label className="block text-xs font-medium text-fg-muted">Instruksi untuk organizer.*?</label>', '', a, count=1, flags=re.S)
          a=re.sub(r'function paymentDetail\(method: OrganizerPaymentMethod\) \{.*?\}\n', '', a, count=1, flags=re.S)
          a=a.replace('<span className="rounded-full bg-surface-elevated px-2.5 py-1 text-[9px] font-bold uppercase tracking-wider text-fg-muted">{method.payment_type}</span>', '<span className="rounded-full bg-surface-elevated px-2.5 py-1 text-[9px] font-bold tracking-wider text-fg-muted">{paymentTypeLabel(method.payment_type)}</span>')
          # Ensure random toggle and handler exist.
          if 'randomCodeEnabled' not in a:
              a=a.replace("type NewPaymentMethod = { name: string; paymentType: string; bankName: string; accountNumber: string; accountName: string; instructions: string };", "type NewPaymentMethod = { name: string; paymentType: string; bankName: string; accountNumber: string; accountName: string; instructions: string; randomCodeEnabled: boolean };")
              a=a.replace("const emptyMethod: NewPaymentMethod = { name: '', paymentType: 'BANK_TRANSFER', bankName: '', accountNumber: '', accountName: '', instructions: '' };", "const emptyMethod: NewPaymentMethod = { name: '', paymentType: 'BANK_TRANSFER', bankName: '', accountNumber: '', accountName: '', instructions: '', randomCodeEnabled: false };")
          q.write_text(a); p.write_text(s)
          PY
          npm ci --silent
          npm run lint
          npx tsc -p tsconfig.app.json --noEmit
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OrganizerPlanPageV2.tsx src/pages/AdminPlanUsagePageV2.tsx
          git diff --cached --check
          git commit -m "feat(payment): v4 final checkout"
          git rm .github/workflows/payment-flow-v4.yml
          git commit -m "chore: remove payment checkout v4 patch"
          git push