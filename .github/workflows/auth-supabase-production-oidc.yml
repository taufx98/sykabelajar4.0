name: Register Better Auth issuer in Production Supabase DB2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type REGISTER-PRODUCTION-OIDC-mvdczyitbkxkldjughor to register the Better Auth issuer in Production DB2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-better-auth-oidc
  cancel-in-progress: false

jobs:
  register:
    if: ${{ github.ref == 'refs/heads/security/auth-poc-stage-1' }}
    name: Register the exact Better Auth issuer in Production DB2 only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the guarded auth migration branch
        uses: actions/checkout@v7
        with:
          ref: security/auth-poc-stage-1

      - name: Verify exact manual confirmation and branch
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/security/auth-poc-stage-1" || {
            echo "Blocked: Production OIDC registration is permitted only from the auth migration branch." >&2
            exit 1
          }
          test "$CONFIRMATION" = "REGISTER-PRODUCTION-OIDC-mvdczyitbkxkldjughor" || {
            echo "Blocked: exact Production OIDC confirmation is missing." >&2
            exit 1
          }

      - name: Verify the promoted issuer and register Custom OIDC in exact Production DB2
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          if (!token) {
            throw new Error(
              "SUPABASE_ACCESS_TOKEN Actions secret is not configured. Add a Supabase Management API token with auth_config_write permission; never put the token in chat or source control."
            );
          }

          const projectRef = "mvdczyitbkxkldjughor";
          const expectedProjectName = "sykabelajar_db2";
          const expectedOrganizationId = "qdmwatwyyrdjbrvxtcfu";
          const issuer = "https://auth.sykabelajar.my.id/api/auth";
          const managementBase = "https://api.supabase.com/v1";
          const headers = {
            Authorization: "Bearer " + token,
            Accept: "application/json",
            "Content-Type": "application/json",
          };

          async function getJson(url, label) {
            const response = await fetch(url, { headers, redirect: "error" });
            if (!response.ok) {
              throw new Error(label + " failed with HTTP " + response.status +
                (response.status === 403 ? "; check the token auth_config_write permission." : ""));
            }
            return response.json();
          }

          // Run this workflow only after the existing Worker has been promoted
          // to Production D1. The issuer hostname remains unchanged.
          const discoveryResponse = await fetch(
            issuer + "/.well-known/openid-configuration",
            { redirect: "error" },
          );
          if (!discoveryResponse.ok) {
            throw new Error("Promoted Better Auth discovery failed with HTTP " + discoveryResponse.status);
          }
          const discovery = await discoveryResponse.json();
          if (discovery.issuer !== issuer) {
            throw new Error("Better Auth discovery issuer does not match the fixed Production issuer.");
          }
          if (!Array.isArray(discovery.code_challenge_methods_supported) ||
              !discovery.code_challenge_methods_supported.includes("S256")) {
            throw new Error("Better Auth discovery does not advertise PKCE S256.");
          }
          if (typeof discovery.jwks_uri !== "string" ||
              new URL(discovery.jwks_uri).origin !== "https://auth.sykabelajar.my.id") {
            throw new Error("Better Auth JWKS URI is not on the approved auth hostname.");
          }
          const jwksResponse = await fetch(discovery.jwks_uri, { redirect: "error" });
          if (!jwksResponse.ok) {
            throw new Error("Better Auth JWKS failed with HTTP " + jwksResponse.status);
          }
          const jwks = await jwksResponse.json();
          if (!Array.isArray(jwks.keys) || !jwks.keys.some((key) =>
            key.kty === "EC" && key.crv === "P-256" && key.alg === "ES256" &&
            typeof key.kid === "string" && key.kid.length > 0 && !Object.hasOwn(key, "d")
          )) {
            throw new Error("Better Auth JWKS has no acceptable public ES256 P-256 key.");
          }

          const projectUrl = managementBase + "/projects/" + projectRef;
          const projectResponse = await fetch(projectUrl, { headers, redirect: "error" });
          if (!projectResponse.ok) {
            throw new Error("Supabase Production DB2 lookup failed with HTTP " + projectResponse.status);
          }
          const project = await projectResponse.json();
          if (project.id !== projectRef ||
              project.name !== expectedProjectName ||
              project.organization_id !== expectedOrganizationId) {
            throw new Error("Supabase Production project identity guard failed; refusing OIDC registration.");
          }

          const integrationsUrl =
            managementBase + "/projects/" + projectRef + "/config/auth/third-party-auth";
          const integrations = await getJson(integrationsUrl, "Supabase Production Third-Party Auth inventory");
          if (!Array.isArray(integrations)) {
            throw new Error("Supabase Production Third-Party Auth inventory returned an unexpected shape.");
          }
          const matches = integrations.filter((item) => item.oidc_issuer_url === issuer);
          if (matches.length > 1) {
            throw new Error("Multiple duplicate Better Auth issuer integrations exist; manual review is required.");
          }

          let registrationAttempted = false;
          if (matches.length === 0) {
            registrationAttempted = true;
            const response = await fetch(integrationsUrl, {
              method: "POST",
              headers,
              body: JSON.stringify({ oidc_issuer_url: issuer }),
              redirect: "error",
            });
            if (response.status !== 201) {
              throw new Error("Supabase Production Custom OIDC registration failed with HTTP " + response.status +
                (response.status === 403 ? "; check the token auth_config_write permission." : ""));
            }
          }

          const verified = await getJson(integrationsUrl, "Supabase Production Third-Party Auth verification");
          const registered = verified.filter((item) => item.oidc_issuer_url === issuer);
          if (registered.length !== 1) {
            throw new Error("Post-registration verification did not find exactly one matching Production issuer.");
          }

          console.log(JSON.stringify({
            success: true,
            project: expectedProjectName,
            project_ref: projectRef,
            issuer,
            integration_id: registered[0].id,
            already_registered: matches.length === 1,
            registration_attempted: registrationAttempted,
            pkce: "S256 verified",
            signing_key: "public ES256 P-256 verified",
            staging_project_touched: false,
            application_data_touched: false,
          }));
          NODE

      - name: Remove temporary runner material
        if: always()
        run: rm -f "$RUNNER_TEMP"/*supabase-production-oidc* 2>/dev/null || true
