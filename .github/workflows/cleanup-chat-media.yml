name: Cleanup expired chat media

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete expired Cloudinary chat media
        run: |
          curl --fail-with-body -sS -X POST \
            'https://mvdczyitbkxkldjughor.supabase.co/functions/v1/cleanup-expired-chat-media' \
            -H 'Content-Type: application/json' \
            -d '{}'
