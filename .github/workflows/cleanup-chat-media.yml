name: Payment source repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix JSX parse error
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminPlanUsagePageV2.tsx')
          s = p.read_text()
          bad = "{newMethod.paymentType !== 'BANK_TRANSFER' && }"
          if bad not in s:
              raise SystemExit('expected malformed JSX not found')
          p.write_text(s.replace(bad, '', 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/AdminPlanUsagePageV2.tsx
          git commit -m "fix(payment): repair admin payment JSX"
          git push
