name: Payment source finalizer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply final source patch
        shell: bash
        run: |
          echo '' | base64 -d >/tmp/fix1.py
          python /tmp/fix1.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OrganizerPlanPageV2.tsx
          git commit -m "fix(payment): remove nested copy control" || true
          git push
