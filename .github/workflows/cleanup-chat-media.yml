name: Payment source finalizer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply final source patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/fix.py
          python /tmp/fix.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OrganizerPlanPageV2.tsx src/pages/AdminPlanUsagePageV2.tsx .github/workflows/cleanup-chat-media.yml .github/workflows/debug-payment-ui.yml .github/workflows/payment-source-fix.yml .github/workflows/final-payment-ui-cleanup.yml
          git commit -m "fix(payment): finalize checkout upload and admin payment UI"
          git push
