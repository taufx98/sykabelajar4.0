name: Payment flow cleanup
on: push
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'feat(payment): finalize checkout payment flow') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply deterministic payment patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------- Admin payment methods ----------
          p=Path('src/pages/AdminPlanUsagePageV2.tsx'); s=p.read_text()
          s=s.replace("type NewPaymentMethod = { name: string; paymentType: string; bankName: string; accountNumber: string; accountName: string; instructions: string };", "type NewPaymentMethod = { name: string; paymentType: string; bankName: string; accountNumber: string; accountName: string; instructions: string; randomCodeEnabled: boolean };")
          s=s.replace("const emptyMethod: NewPaymentMethod = { name: '', paymentType: 'BANK_TRANSFER', bankName: '', accountNumber: '', accountName: '', instructions: '' };", "const emptyMethod: NewPaymentMethod = { name: '', paymentType: 'BANK_TRANSFER', bankName: '', accountNumber: '', accountName: '', instructions: '', randomCodeEnabled: false };")
          if 'function paymentTypeLabel(value: string)' not in s:
              s=s.replace('function methodMeta(method: OrganizerPaymentMethod) {', "function paymentTypeLabel(value: string) { const type=value.toUpperCase(); if(type==='BANK_TRANSFER') return 'Transfer Bank'; if(type==='QRIS') return 'QRIS'; if(type==='VIRTUAL_ACCOUNT') return 'Virtual Account'; if(type==='EWALLET') return 'E-Wallet'; if(type==='MIDTRANS') return 'Pembayaran Otomatis'; if(type==='SNAP') return 'Payment Gateway'; return 'Metode Pembayaran'; }\nfunction methodMeta(method: OrganizerPaymentMethod) {",1)
          s=re.sub(r'function paymentDetail\(method: OrganizerPaymentMethod\) \{.*?\}\n', '', s, count=1, flags=re.S)
          s=s.replace("function methodMeta(method: OrganizerPaymentMethod) { return { bankName: String(method.details?.bank_name ?? ''), accountNumber: String(method.details?.account_number ?? ''), accountName: String(method.details?.account_name ?? ''), instructions: String(method.details?.instructions ?? method.details?.text ?? '') }; }", "function methodMeta(method: OrganizerPaymentMethod) { return { bankName: String(method.details?.bank_name ?? ''), accountNumber: String(method.details?.account_number ?? ''), accountName: String(method.details?.account_name ?? ''), randomCodeEnabled: Boolean(method.details?.random_code_enabled) }; }")
          start=s.find('  const addMethod = async () =>'); end=s.find('  const deleteMethod = async', start)
          if start<0 or end<0: raise SystemExit('admin addMethod missing')
          new_add="  const addMethod = async () => { const type = newMethod.paymentType.trim().toUpperCase(); if (!type) { toast('Jenis pembayaran wajib dipilih.', 'error'); return; } if (!newMethod.bankName.trim()) { toast('Nama bank wajib diisi.', 'error'); return; } if (!newMethod.accountNumber.trim()) { toast('Nomor rekening wajib diisi.', 'error'); return; } if (!newMethod.accountName.trim()) { toast('Atas nama rekening wajib diisi.', 'error'); return; } setBusy(true); try { const details = { bank_name: newMethod.bankName.trim(), account_number: newMethod.accountNumber.trim(), account_name: newMethod.accountName.trim(), random_code_enabled: type === 'BANK_TRANSFER' && newMethod.randomCodeEnabled }; const created = await adminCreateOrganizerPaymentMethod({ name: paymentTypeLabel(type), paymentType: type, details, sortOrder: paymentMethods.length + 1 }); setPaymentMethods((current) => [...current, created]); setNewMethod(emptyMethod); setShowMethodForm(false); toast('Metode pembayaran ditambahkan.', 'success'); } catch (e: any) { toast(e?.message || 'Gagal menambah metode pembayaran.', 'error'); } finally { setBusy(false); } };\n"
          s=s[:start]+new_add+s[end:]
          # Remove old payment-form name/instructions labels.
          s=re.sub(r'<label className="text-xs font-medium text-fg-muted">Nama metode.*?</label>', '', s, count=1, flags=re.S)
          s=re.sub(r'<label className="block text-xs font-medium text-fg-muted">Instruksi untuk organizer.*?</label>', '', s, count=1, flags=re.S)
          # Replace raw enum display.
          s=s.replace('<span className="rounded-full bg-surface-elevated px-2.5 py-1 text-[9px] font-bold uppercase tracking-wider text-fg-muted">{method.payment_type}</span>', '<span className="rounded-full bg-surface-elevated px-2.5 py-1 text-[9px] font-bold tracking-wider text-fg-muted">{paymentTypeLabel(method.payment_type)}</span>')
          old_card='{meta.accountName && <p className="mt-1 text-xs text-fg-muted">a.n. {meta.accountName}</p>}{paymentDetail(method) && <p className="mt-3 whitespace-pre-wrap rounded-xl border border-surface-border bg-surface-elevated/30 p-3 text-xs leading-5 text-fg-muted">{paymentDetail(method)}</p>}'
          s=s.replace(old_card, '{meta.accountName && <p className="mt-1 text-xs text-fg-muted">a.n. {meta.accountName}</p>}{meta.randomCodeEnabled && <p className="mt-3 text-xs font-semibold text-accent">Random 3 digit: aktif</p>}')
          save='<Button fullWidth disabled={busy} onClick={() => void addMethod()} icon={<Plus size={15}/>}>Simpan Metode Pembayaran</Button>'
          if 'checked={newMethod.randomCodeEnabled}' not in s:
              toggle='<label className="flex items-start gap-3 rounded-xl border border-accent/20 bg-accent/5 p-3 text-sm text-fg"><input type="checkbox" className="mt-0.5" checked={newMethod.randomCodeEnabled} onChange={(e) => setNewMethod((v) => ({ ...v, randomCodeEnabled: e.target.checked }))}/><span><strong className="block">Random 3 digit</strong><span className="text-xs text-fg-muted">Tambahkan kode unik 3 digit pada nominal transfer.</span></span></label>'
              s=s.replace(save,toggle+save,1)
          p.write_text(s)

          # ---------- User checkout ----------
          p=Path('src/pages/OrganizerPlanPageV2.tsx'); s=p.read_text()
          s=s.replace("import { ArrowLeft, ArrowRight, Check, CheckCircle2, CreditCard, Eye, Gauge, MessageCircle, RefreshCw, ShieldCheck, Sparkles, Tag, UploadCloud, X } from 'lucide-react';", "import { ArrowLeft, ArrowRight, Check, CheckCircle2, Copy, CreditCard, Eye, Gauge, MessageCircle, RefreshCw, ShieldCheck, Sparkles, Tag, UploadCloud, X } from 'lucide-react';")
          if 'function paymentTypeLabel(value: string)' not in s:
              s=s.replace('function paymentDetailText(method: OrganizerPaymentMethod)', "function paymentTypeLabel(value: string) { const type=value.toUpperCase(); if(type==='BANK_TRANSFER') return 'Transfer Bank'; if(type==='QRIS') return 'QRIS'; if(type==='VIRTUAL_ACCOUNT') return 'Virtual Account'; if(type==='EWALLET') return 'E-Wallet'; if(type==='MIDTRANS') return 'Pembayaran Otomatis'; if(type==='SNAP') return 'Payment Gateway'; return 'Metode Pembayaran'; }\nfunction paymentAccountNumber(method: OrganizerPaymentMethod | null) { return String(method?.details?.account_number ?? '').trim(); }\nfunction paymentBankName(method: OrganizerPaymentMethod | null) { return String(method?.details?.bank_name ?? '').trim(); }\nfunction paymentAccountName(method: OrganizerPaymentMethod | null) { return String(method?.details?.account_name ?? '').trim(); }\nfunction paymentDetailText(method: OrganizerPaymentMethod)",1)
          marker="  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP'].includes(String(selectedMethod.payment_type).toUpperCase());"
          if marker not in s: raise SystemExit('user proof marker missing')
          s=s.replace(marker, "  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(selectedMethod.payment_type).toUpperCase());\n  const selectedRandomEnabled = !!selectedMethod && String(selectedMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(selectedMethod.details?.random_code_enabled) && selectedTotal > 0;\n  const paymentRandomCode = selectedRandomEnabled ? Number(contactFields.__payment_random_code || 0) : 0;\n  const paymentTransferTotal = selectedTotal + paymentRandomCode;",1)
          open_marker="const initial: Record<string, string> = {}; paymentFields.forEach((field) => { initial[field.field_key] = ''; });"
          if open_marker not in s: raise SystemExit('openPayment marker missing')
          s=s.replace(open_marker, open_marker+" const firstMethod = paymentMethods[0] ?? null; if (firstMethod && String(firstMethod.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(firstMethod.details?.random_code_enabled)) initial.__payment_random_code = String(Math.floor(Math.random() * 900) + 100);",1)
          s=s.replace("const payload = { ...contactFields };", "const payload = { ...contactFields, ...(selectedRandomEnabled ? { payment_random_code: String(paymentRandomCode) } : {}) };",1)
          # Replace payment method block exactly as stored in the current page.
          old_method='{paymentMethods.length > 0 && <div className="order-3 mt-5"><p className="text-xs font-semibold text-fg-muted">Metode pembayaran</p><div className="mt-2 space-y-2">{paymentMethods.map((method) => <button key={method.id} type="button" onClick={() => setSelectedPaymentMethodId(method.id)} className={`w-full rounded-2xl border p-4 text-left transition ${selectedPaymentMethodId === method.id ? \'border-accent bg-accent/5\' : \'border-surface-border bg-surface-elevated/25 hover:bg-surface-elevated/50\'}`}><div className="flex items-start justify-between gap-3"><div><p className="text-sm font-bold text-fg">{method.name}</p><p className="mt-0.5 text-[10px] uppercase tracking-wider text-fg-muted">{method.payment_type}</p></div>{selectedPaymentMethodId === method.id && <CheckCircle2 size={17} className="text-accent"/>}</div>{paymentDetailText(method) && <p className="mt-3 whitespace-pre-wrap text-xs leading-5 text-fg-muted">{paymentDetailText(method)}</p>}</button>)}</div></div>}'
          new_method='''{paymentMethods.length > 0 && <div className="order-3 mt-5"><p className="text-xs font-semibold text-fg-muted">Metode pembayaran</p><div className="mt-2 space-y-2">{paymentMethods.map((method) => <button key={method.id} type="button" onClick={() => { setSelectedPaymentMethodId(method.id); setContactFields((current) => ({ ...current, __payment_random_code: String(method.payment_type).toUpperCase() === 'BANK_TRANSFER' && Boolean(method.details?.random_code_enabled) && selectedTotal > 0 ? String(Math.floor(Math.random() * 900) + 100) : '' })); }} className={`w-full rounded-2xl border p-4 text-left transition ${selectedPaymentMethodId === method.id ? 'border-accent bg-accent/5' : 'border-surface-border bg-surface-elevated/25 hover:bg-surface-elevated/50'}`}><div className="flex items-start justify-between gap-3"><div><p className="text-sm font-bold text-fg">{paymentTypeLabel(method.payment_type)}{paymentBankName(method) ? ` · ${paymentBankName(method)}` : ''}</p>{paymentAccountNumber(method) && <div className="mt-3 rounded-xl border border-surface-border bg-surface-elevated/35 p-3"><div className="flex items-center justify-between gap-2"><span className="text-[10px] font-semibold uppercase tracking-wider text-fg-muted">Nomor Rekening</span><button type="button" onClick={(e) => { e.stopPropagation(); navigator.clipboard.writeText(paymentAccountNumber(method)).then(() => toast.success('Nomor rekening disalin.')).catch(() => toast.error('Nomor rekening tidak dapat disalin.')); }} className="inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs font-semibold text-accent hover:bg-accent/10"><Copy size={13}/> Salin</button></div><p className="mt-1 text-2xl font-black tracking-wider text-fg">{paymentAccountNumber(method)}</p>{paymentAccountName(method) && <p className="mt-1 text-xs text-fg-muted">a.n. {paymentAccountName(method)}</p>}</div>}</div>{selectedPaymentMethodId === method.id && <CheckCircle2 size={17} className="shrink-0 text-accent"/>}</div></button>)}</div></div>}'''
          if old_method not in s: raise SystemExit('user payment method block missing')
          s=s.replace(old_method,new_method,1)
          # Replace the old uploader block. This exact prefix/suffix isolates the whole order-4 block.
          start=s.find('{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5')
          end=s.find('{paymentFields.filter', start)
          if start<0 or end<0: raise SystemExit('user upload block boundaries missing')
          upload='''{selectedMethodNeedsProof && selectedTotal > 0 && <div className="order-4 mt-5 overflow-hidden rounded-2xl border-2 border-accent/40 bg-accent/5"><div className="p-5"><div className="flex items-start gap-3"><div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-accent/10"><UploadCloud size={21} className="text-accent"/></div><div className="min-w-0 flex-1"><p className="text-base font-bold text-fg">Upload Bukti Transfer</p><p className="mt-1 text-xs leading-5 text-fg-muted">Setelah transfer, unggah bukti pembayaran di sini.</p></div></div><Button className="mt-4 w-full" onClick={() => proofInputRef.current?.click()} icon={<UploadCloud size={15}/>}>{proofFile ? 'Ganti Bukti Transfer' : 'Pilih Bukti Transfer'}</Button><input ref={proofInputRef} className="hidden" type="file" accept="image/png,image/jpeg,image/webp" onChange={(e) => chooseProof(e.target.files?.[0])}/>{proofFile && <div className="mt-3 flex items-center gap-3 rounded-xl border border-surface-border bg-surface-elevated/35 p-3"><div className="min-w-0 flex-1"><p className="truncate text-xs font-semibold text-fg">{proofFile.name}</p><p className="mt-1 text-[10px] text-fg-muted">{(proofFile.size / 1024 / 1024).toFixed(2)} MB</p></div><button type="button" onClick={removeProof} className="rounded-lg p-2 text-red-400 hover:bg-red-500/10" aria-label="Hapus bukti transfer"><X size={15}/></button></div>}{proofPreviewUrl && <div className="relative mt-3 overflow-hidden rounded-2xl border border-surface-border bg-black/20"><img src={proofPreviewUrl} alt="Preview bukti transfer" className="max-h-64 w-full object-contain"/></div>}</div></div>}
        '''
          s=s[:start]+upload+s[end:]
          s=s.replace("{selectedTotal === 0 ? 'GRATIS' : money(selectedTotal, paymentPlan.currency)}", "{selectedTotal === 0 ? 'GRATIS' : money(paymentTransferTotal, paymentPlan.currency)}",1)
          p.write_text(s)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/AdminPlanUsagePageV2.tsx src/pages/OrganizerPlanPageV2.tsx
          git diff --cached --check
          git commit -m "feat(payment): finalize checkout payment flow"
          git push