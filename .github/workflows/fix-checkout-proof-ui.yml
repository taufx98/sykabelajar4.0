name: One-off checkout proof UI patch

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ci): patch checkout proof visibility'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch organizer checkout proof visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()

          old = "const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(selectedMethod.payment_type).toUpperCase());\n  const showProofUpload = selectedTotal > 0 && selectedMethodNeedsProof;"
          new = "const selectedMethodType = String(selectedMethod?.payment_type ?? '').trim().toUpperCase();\n  const selectedMethodNeedsProof = !!selectedMethod && !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(selectedMethodType);\n  const hasManualPaymentMethod = paymentMethods.some((method) => !['MIDTRANS', 'SNAP', 'VIRTUAL_ACCOUNT'].includes(String(method.payment_type ?? '').trim().toUpperCase()));\n  const showProofUpload = selectedTotal > 0 && (selectedMethodNeedsProof || (!selectedMethod && hasManualPaymentMethod));"
          if old not in s:
              raise SystemExit('proof condition target not found')
          s = s.replace(old, new, 1)

          old_modal = 'max-w-lg max-h-[78vh] flex-col overflow-auto'
          new_modal = 'max-w-lg max-h-[82vh] flex-col overflow-auto overscroll-contain'
          if old_modal not in s:
              raise SystemExit('modal target not found')
          s = s.replace(old_modal, new_modal, 1)

          old_upload = 'className="order-4 mt-5 overflow-hidden rounded-2xl border-2 border-accent/50 bg-accent/10 shadow-lg shadow-accent/5"'
          new_upload = 'data-testid="checkout-proof-upload" className="order-4 sticky bottom-1 z-30 mt-5 overflow-hidden rounded-2xl border-2 border-accent/60 bg-surface shadow-2xl shadow-black/25 ring-1 ring-accent/20"'
          if old_upload not in s:
              raise SystemExit('upload card target not found')
          s = s.replace(old_upload, new_upload, 1)

          wf = Path('.github/workflows/fix-checkout-proof-ui.yml')
          s_commit = s
          p.write_text(s_commit)
          wf.unlink(missing_ok=True)
          PY
      - name: Commit source fix and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/OrganizerPlanPageV2.tsx .github/workflows/fix-checkout-proof-ui.yml
          git commit -m 'fix(payment): make organizer proof upload visible'
          git push