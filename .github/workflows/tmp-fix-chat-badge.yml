name: tmp-fix-chat-badge
on:
  push:
    branches: [main]
    paths: ['.chat-badge-fix-trigger']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix unread badge truth source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/layout/AppLayout.tsx')
          s=p.read_text()
          old="""      if (String(event.type) === 'chat-thread-updated') {
        setUnreadMessages((value) => {
          const next = Math.max(0, value - 1);
          setPersistentCache(chatCacheKey, next, { ttlMs: CHAT_CACHE_TTL });
          return next;
        });
        return;
      }"""
          new="""      if (String(event.type) === 'chat-thread-updated') {
        void getUnreadChatCount(true).then((count) => {
          setUnreadMessages(count);
          setPersistentCache(chatCacheKey, count, { ttlMs: CHAT_CACHE_TTL });
        }).catch(() => {});
        return;
      }"""
          if old not in s: raise SystemExit('badge handler pattern not found')
          p.write_text(s.replace(old,new,1))
          Path('.chat-badge-fix-trigger').unlink(missing_ok=True)
          Path('.github/workflows/tmp-fix-chat-badge.yml').unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(chat): refresh unread badge from server truth'
          git push
