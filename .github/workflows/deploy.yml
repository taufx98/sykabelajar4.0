name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply one-time Phase 2 optimization
        if: github.event_name == 'push' && github.event.head_commit.message == 'chore: phase2 ci executor'
        shell: python
        run: |
          from pathlib import Path

          # 1. Eliminate 30s MessagesPageV6 polling; initial load remains manual/on-navigation,
          #    and existing Supabase Realtime remains responsible for live updates.
          p = Path('src/pages/MessagesPageV6.tsx')
          s = p.read_text()
          old = "useEffect(()=>{void refresh();const t=window.setInterval(()=>void refresh(),30000);return()=>window.clearInterval(t)},[refresh]);"
          s = s.replace(old, "useEffect(()=>{void refresh()},[refresh]);", 1)
          p.write_text(s)

          # 2. Centralized Cloudinary delivery optimization.
          p = Path('src/services/cloudinary.service.ts')
          s = p.read_text()
          start_marker = '/**\n * Append a cache-busting version query to a Cloudinary URL.\n */'
          start = s.index(start_marker)
          end = s.index('\n\n/**\n * Delete an image from Cloudinary via Edge Function.', start)
          helper = '''/**
 * Build an optimized Cloudinary delivery URL.
 * Only Cloudinary image delivery URLs are transformed. Other URLs are returned unchanged.
 */
export function optimizedCloudinaryUrl(
  url?: string | null,
  options: { width?: number; version?: string | number | null } = {},
): string | undefined {
  if (!url) return undefined;
  const value = String(url);
  let parsed: URL;
  try {
    parsed = new URL(value);
  } catch {
    return value;
  }
  if (!parsed.hostname.toLowerCase().endsWith('.cloudinary.com')) return value;

  const marker = '/image/upload/';
  const index = parsed.pathname.indexOf(marker);
  if (index < 0) return value;

  const width = Number.isFinite(options.width) && Number(options.width) > 0
    ? Math.round(Number(options.width))
    : undefined;
  const transforms = ['f_auto', 'q_auto', ...(width ? [`w_${width}`] : [])];
  const before = parsed.pathname.slice(0, index + marker.length);
  const after = parsed.pathname.slice(index + marker.length);
  parsed.pathname = `${before}${transforms.join(',')}/${after}`;

  if (options.version != null && String(options.version)) {
    parsed.searchParams.set('v', String(options.version));
  }
  return parsed.toString();
}

/**
 * Append a cache-busting version query to a Cloudinary URL.
 */
export function versionedCloudinaryUrl(
  url?: string | null,
  version?: string | number | null,
): string | undefined {
  return optimizedCloudinaryUrl(url, { version });
}
'''
          p.write_text(s[:start] + helper + s[end:])

          # 3. Apply optimizer to avatars.
          p = Path('src/components/ui/Avatar.tsx')
          s = p.read_text()
          if "from '@/services/cloudinary.service'" not in s:
              s = s.replace("import { initials, avatarGradient } from '@/lib/utils';", "import { initials, avatarGradient } from '@/lib/utils';\nimport { optimizedCloudinaryUrl } from '@/services/cloudinary.service';")
          s = s.replace("if(src) return <img src={src}", "if(src) return <img src={optimizedCloudinaryUrl(src,{width:size<=80?150:300})}", 1)
          p.write_text(s)

          # 4. Apply optimizer to banner delivery.
          p = Path('src/components/ui/BannerCarousel.tsx')
          s = p.read_text()
          if "from '@/services/cloudinary.service'" not in s:
              s = s.replace("import { useApp } from '@/store/AppContext';", "import { useApp } from '@/store/AppContext';\nimport { optimizedCloudinaryUrl } from '@/services/cloudinary.service';")
          s = s.replace("return <img src={banner.image_url}", "return <img src={optimizedCloudinaryUrl(banner.image_url,{width:800})}", 1)
          p.write_text(s)

          # 5. Apply optimizer and eliminate unnecessary competition refetches on Home.
          p = Path('src/pages/HomePage.tsx')
          s = p.read_text()
          if "from '@/services/cloudinary.service'" not in s:
              s = s.replace("import { supabase } from '@/lib/supabase';", "import { supabase } from '@/lib/supabase';\nimport { optimizedCloudinaryUrl } from '@/services/cloudinary.service';")
          s = s.replace('src={comp.poster_url}', 'src={optimizedCloudinaryUrl(comp.poster_url,{width:800})}')
          s = s.replace('src={post.cover_url}', 'src={optimizedCloudinaryUrl(post.cover_url,{width:800})}')

          old_load_first = "const loadFirst=useCallback(async()=>{setLoading(true);try{const home=await getHomeSnapshot(15);const feedRows=home.feed;const initialPosts=feedRows.slice(0,15).map(normalizeHomeFeedRow);setPosts(initialPosts);setCursor(feedRows.length>15?String(feedRows[14]?.created_at??''):null);setCompetitions(home.competitions.map(normalizeCompetition));setLeaders(home.leaderboard);setCoinLeaders(home.coin_leaderboard);}catch(error:unknown){toast(errorMessage(error,'Beranda gagal dimuat.'),'error')}finally{setLoading(false)}},[toast]);"
          new_load_first = "const loadFirst=useCallback(async()=>{setLoading(true);try{const home=await getHomeSnapshot(15);const feedRows=home.feed;const initialPosts=feedRows.slice(0,15).map(normalizeHomeFeedRow);const snapshotCompetitions=home.competitions.map(normalizeCompetition);setPosts(initialPosts);setCursor(feedRows.length>15?String(feedRows[14]?.created_at??''):null);setCompetitions(snapshotCompetitions);setSearchAllComps(snapshotCompetitions);setLeaders(home.leaderboard);setCoinLeaders(home.coin_leaderboard);}catch(error:unknown){toast(errorMessage(error,'Beranda gagal dimuat.'),'error')}finally{setLoading(false)}},[toast]);"
          if old_load_first not in s:
              raise SystemExit('HomePage loadFirst target not found')
          s = s.replace(old_load_first, new_load_first, 1)

          old_search = "const loadSearchData=useCallback(async()=>{if(!searchQuery.trim()||searchAllComps.length>0)return;try{const compRes=await getPublicCompetitions(100);setSearchAllComps(compRes.map(normalizeCompetition))}catch{}},[searchQuery,searchAllComps.length]);"
          new_search = "const loadSearchData=useCallback(async()=>{const q=searchQuery.trim().normalize('NFD').replace(/\\u0300-\\u036f/g,'').toLowerCase();if(!q)return;const hasSnapshotMatch=searchAllComps.some((c)=>[c.title,c.slug,c.category,c.organizer_name].some((value)=>String(value).normalize('NFD').replace(/\\u0300-\\u036f/g,'').toLowerCase().includes(q)));if(hasSnapshotMatch||searchAllComps.length>=20)return;try{const compRes=await getPublicCompetitions(20);const merged=new Map<string,HomeCompetition>();for(const c of [...searchAllComps,...compRes.map(normalizeCompetition)])merged.set(c.id,c);setSearchAllComps(Array.from(merged.values()).slice(0,20))}catch{}},[searchQuery,searchAllComps]);"
          if old_search not in s:
              raise SystemExit('HomePage loadSearchData target not found')
          s = s.replace(old_search, new_search, 1)
          p.write_text(s)

          # Hard assertions: no 30s poll; optimizer is present in all requested UI targets.
          assert 'setInterval(()=>void refresh(),30000)' not in Path('src/pages/MessagesPageV6.tsx').read_text()
          assert 'optimizedCloudinaryUrl' in Path('src/components/ui/Avatar.tsx').read_text()
          assert 'optimizedCloudinaryUrl' in Path('src/components/ui/BannerCarousel.tsx').read_text()
          assert 'optimizedCloudinaryUrl' in Path('src/pages/HomePage.tsx').read_text()
          assert 'export function optimizedCloudinaryUrl' in Path('src/services/cloudinary.service.ts').read_text()
          print('Phase 2 optimization patch applied.')

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_CLOUDINARY_PROFILE_PRESET: ${{ secrets.VITE_CLOUDINARY_PROFILE_PRESET }}
          VITE_EDGE_FUNCTION_URL: ${{ secrets.VITE_EDGE_FUNCTION_URL }}

      - name: Production smoke test
        run: node scripts/rpd-smoke.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Commit one-time Phase 2 changes
        if: github.event_name == 'push' && github.event.head_commit.message == 'chore: phase2 ci executor'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/MessagesPageV6.tsx src/services/cloudinary.service.ts src/components/ui/Avatar.tsx src/components/ui/BannerCarousel.tsx src/pages/HomePage.tsx
          git commit -m 'perf(phase2): optimize chat requests and Cloudinary delivery'
          git push origin HEAD:main
