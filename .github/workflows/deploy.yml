name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_SUPABASE_URL: https://mvdczyitbkxkldjughor.supabase.co
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Supabase production target
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL GitHub Actions secret." >&2; exit 1; }
          test "$VITE_SUPABASE_URL" = "$TARGET_SUPABASE_URL" || {
            echo "ERROR: VITE_SUPABASE_URL points to the wrong Supabase project." >&2
            echo "Expected: $TARGET_SUPABASE_URL" >&2
            echo "Actual:   $VITE_SUPABASE_URL" >&2
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Canonical source report
        run: node scripts/check-canonical-architecture.mjs

      - name: Persistent cache TTL tests
        run: npm run test:cache

      - name: Referral attribution contract tests
        run: npm run test:referral-attribution

      - name: Competition results contract tests
        run: npm run test:results-contract

      - name: Public competition participant detail contract tests
        run: npm run test:competition-public-detail-contract

      - name: Organizer competition quota feedback tests
        run: node --test scripts/competition-create-quota-contract.test.mjs

      - name: Monthly competition publication quota contract tests
        run: node --test scripts/competition-publish-quota-contract.test.mjs

      - name: Organizer registration contract tests
        run: npm run test:organizer-registration-contract

      - name: Teacher achievement contract tests
        run: npm run test:teacher-achievement-contract

      - name: Admin monitoring contract tests
        run: npm run test:admin-monitoring-contract

      - name: Lomba Saya dashboard UI contract tests
        run: npm run test:my-competitions-ui-contract

      - name: Shop wishlist and verified review contract tests
        run: npm run test:shop-engagement-contract

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_CLOUDINARY_PROFILE_PRESET: ${{ secrets.VITE_CLOUDINARY_PROFILE_PRESET }}
          VITE_EDGE_FUNCTION_URL: ${{ secrets.VITE_EDGE_FUNCTION_URL }}

      - name: Performance asset budget
        run: |
          npm run test:performance-budget
          npm run check:performance

      - name: Browser E2E access-control test
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.63.0
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Production smoke test
        run: node scripts/rpd-smoke.mjs

      # CI trigger marker: keep pull_request validation active on branch updates.

  auth-worker-poc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/auth
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Worker dependencies and create lockfile
        run: npm install --no-audit --no-fund
      - name: Worker security contract tests
        run: npm test
      - name: Generate Better Auth schema
        run: npm run generate:auth-schema
      - name: Generate D1 migrations
        run: npm run generate:d1-migration
      - name: Generated schema contract tests
        run: node --test test/generated-schema.test.mjs
      - name: Apply schema migrations to local D1 emulator
        run: npx wrangler d1 migrations apply sykabelajar-auth-local --local
      - name: Verify core and OAuth tables exist in local D1
        run: |
          npx wrangler d1 execute sykabelajar-auth-local --local --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('user','session','account','verification','jwks','oauth_client','oauth_resource','oauth_client_resource','oauth_access_token','oauth_refresh_token','oauth_consent','rate_limit') ORDER BY name;"
      - name: Dry-run Worker bundle (no deployment)
        run: npm run build:worker
      - name: Upload generated schema, migrations and lockfile
        uses: actions/upload-artifact@v6
        with:
          name: auth-worker-generated
          path: |
            workers/auth/package-lock.json
            workers/auth/src/auth-schema.ts
            workers/auth/migrations/**
          if-no-files-found: error
          retention-days: 7
