name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_SUPABASE_URL: https://mvdczyitbkxkldjughor.supabase.co
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Supabase production target
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL GitHub Actions secret." >&2; exit 1; }
          test "$VITE_SUPABASE_URL" = "$TARGET_SUPABASE_URL" || {
            echo "ERROR: VITE_SUPABASE_URL points to the wrong Supabase project." >&2
            echo "Expected: $TARGET_SUPABASE_URL" >&2
            echo "Actual:   $VITE_SUPABASE_URL" >&2
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_CLOUDINARY_PROFILE_PRESET: ${{ secrets.VITE_CLOUDINARY_PROFILE_PRESET }}
          VITE_EDGE_FUNCTION_URL: ${{ secrets.VITE_EDGE_FUNCTION_URL }}

      - name: Production smoke test
        run: node scripts/rpd-smoke.mjs

  repair:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[repair-checkout]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Organizer checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()

          # Voucher: if the package matches but the voucher is limited to the opposite billing period,
          # automatically move the checkout to that period and keep the voucher active.
          marker = 'const alternateBilling: Billing = billing === \'MONTHLY\' ? \'YEARLY\' : \'MONTHLY\';'
          if marker not in s:
              pattern = re.compile(r"  async function checkVoucher\(\) \{.*?\n  \}\n\n  async function sendOrder\(\)", re.S)
              replacement = '''  async function checkVoucher() {
    const code = voucherCode.trim().toUpperCase();
    if (!code) { setVoucherApplied(null); setVoucherMessage('Masukkan kode voucher terlebih dahulu.'); return; }
    if (!paymentPlan) return;
    setVoucherChecking(true); setVoucherApplied(null); setVoucherMessage('Memeriksa voucher…');
    try {
      let result = await validateOrganizerVoucher(code, paymentPlan.plan_code, billing);
      if (!result.isValid && /^Voucher hanya bisa digunakan untuk periode/i.test(result.message || '')) {
        const alternateBilling: Billing = billing === 'MONTHLY' ? 'YEARLY' : 'MONTHLY';
        const alternateResult = await validateOrganizerVoucher(code, paymentPlan.plan_code, alternateBilling);
        if (alternateResult.isValid) {
          setBilling(alternateBilling);
          setView(alternateBilling);
          result = alternateResult;
        }
      }
      if (!result.isValid) { setVoucherMessage(result.message || 'Voucher tidak dapat digunakan.'); return; }
      setVoucherApplied(result); setVoucherMessage('Voucher bisa digunakan.'); toast.success('Voucher bisa digunakan.');
    } catch (error: any) { setVoucherMessage(error?.message || 'Gagal memeriksa voucher.'); }
    finally { setVoucherChecking(false); }
  }

  async function sendOrder()'''
              s, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit('checkVoucher block not found')

          # Compact popup.
          s = s.replace('max-w-xl max-h-[84vh]', 'max-w-lg max-h-[78vh]', 1)
          s = s.replace('bg-surface p-5 shadow-2xl md:p-6', 'bg-surface p-4 shadow-2xl md:p-5', 1)

          # Period switch inside checkout popup.
          anchor = '<p className="mt-1 text-xs text-fg-muted">Lengkapi data pemesan, pilih pembayaran, lihat total, lalu gunakan voucher bila ada.</p></div><button'
          if 'checkout-period-selector' not in s and anchor in s:
              insert = '<p className="mt-1 text-xs text-fg-muted">Lengkapi data pemesan, pilih pembayaran, lihat total, lalu gunakan voucher bila ada.</p><div data-testid="checkout-period-selector" className="mt-3 inline-flex w-full rounded-xl border border-surface-border bg-surface-elevated/35 p-1"><button type="button" onClick={() => { setBilling(\'MONTHLY\'); setView(\'MONTHLY\'); setVoucherApplied(null); setVoucherMessage(\'\'); }} className={`flex-1 rounded-lg px-3 py-2 text-xs font-semibold transition ${billing === \'MONTHLY\' ? \'bg-accent text-white shadow\' : \'text-fg-muted hover:text-fg\'}`}>Bulanan</button><button type="button" onClick={() => { setBilling(\'YEARLY\'); setView(\'YEARLY\'); setVoucherApplied(null); setVoucherMessage(\'\'); }} className={`flex-1 rounded-lg px-3 py-2 text-xs font-semibold transition ${billing === \'YEARLY\' ? \'bg-accent text-white shadow\' : \'text-fg-muted hover:text-fg\'}`}>Tahunan</button></div></div><button'
              s = s.replace(anchor, insert, 1)

          # Larger account details.
          s = s.replace('text-lg font-black tracking-wider text-fg sm:text-xl', 'text-xl font-black tracking-wider text-fg sm:text-2xl', 1)
          s = s.replace('text-sm font-semibold text-fg-muted sm:text-base', 'text-base font-semibold text-fg sm:text-lg', 1)

          # Avoid nested button markup around Copy.
          old_copy = '<button type="button" className="rounded-lg border border-surface-border p-1.5 text-fg-muted hover:text-fg" onClick={(event) => { event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); }} aria-label="Salin nomor rekening"><Copy size={14}/></button>'
          new_copy = '<span role="button" tabIndex={0} className="cursor-pointer rounded-lg border border-surface-border p-1.5 text-fg-muted hover:text-fg" onClick={(event) => { event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); }} onKeyDown={(event) => { if (event.key === \'Enter\' || event.key === \' \') { event.preventDefault(); event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); } }} aria-label="Salin nomor rekening"><Copy size={14}/></span>'
          s = s.replace(old_copy, new_copy, 1)

          # Show unique code separately and display the final amount.
          old_total = '<div className="mt-4 flex items-end justify-between border-t border-surface-border pt-4"><span className="font-semibold text-fg">Total pembayaran</span><span className={`text-3xl font-black ${selectedTotal === 0 ? \'text-emerald-300\' : \'text-fg\'}`}>{selectedTotal === 0 ? \'GRATIS\' : money(selectedTotal, paymentPlan.currency)}</span></div>'
          new_total = '<div className="mt-4 border-t border-surface-border pt-4">{selectedRandomEnabled && <div className="mb-2 flex items-center justify-between text-sm"><span className="text-fg-muted">Kode unik</span><span className="font-black tracking-wider text-emerald-300">{String(paymentRandomCode).padStart(3, \'0\')}</span></div>}<div className="flex items-end justify-between"><span className="font-semibold text-fg">Total pembayaran</span><span className={`text-3xl font-black ${selectedTotal === 0 ? \'text-emerald-300\' : \'text-fg\'}`}>{selectedTotal === 0 ? \'GRATIS\' : money(paymentTransferTotal, paymentPlan.currency)}</span></div></div>'
          if old_total in s:
              s = s.replace(old_total, new_total, 1)

          p.write_text(s)
          PY

      - name: Validate patched source
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run lint
          npm run typecheck

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/OrganizerPlanPageV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: organizer checkout voucher period and payment total"
          git push origin HEAD:main

      - name: Dispatch CI for patched source
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          gh workflow run deploy.yml --ref main
          for i in $(seq 1 36); do
            RUN_ID="$(gh run list --workflow deploy.yml --branch main --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n 1)"
            if [ -n "$RUN_ID" ]; then
              gh run watch "$RUN_ID" --exit-status
              exit $?
            fi
            sleep 5
          done
          echo "CI run for $SHA was not found." >&2
          exit 1

      - name: Restore CI workflow and remove repair job
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          BASE_SHA="$(git rev-list --reverse HEAD | tail -n 3 | head -n 1)"
          git show "$BASE_SHA:.github/workflows/deploy.yml" > .github/workflows/deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy.yml
          git diff --cached --quiet || git commit -m "chore: restore ci workflow"
          git push origin HEAD:main || true