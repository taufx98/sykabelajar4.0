name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_SUPABASE_URL: https://mvdczyitbkxkldjughor.supabase.co
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply payment UI source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # User checkout: remove nested interactive button inside payment-method card.
          p = Path('src/pages/OrganizerPlanPageV2.tsx')
          s = p.read_text()
          old_copy = '<button type="button" className="rounded-lg border border-surface-border p-1.5 text-fg-muted hover:text-fg" onClick={(event) => { event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); }} aria-label="Salin nomor rekening"><Copy size={14}/></button>'
          new_copy = '<span role="button" tabIndex={0} className="cursor-pointer rounded-lg border border-surface-border p-1.5 text-fg-muted hover:text-fg" onClick={(event) => { event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); }} onKeyDown={(event) => { if (event.key === \'Enter\' || event.key === \' \') { event.preventDefault(); event.stopPropagation(); void navigator.clipboard?.writeText(accountNumber); toast.success(\'Nomor rekening disalin.\'); } }} aria-label="Salin nomor rekening"><Copy size={14}/></span>'
          if old_copy in s:
              s = s.replace(old_copy, new_copy, 1)
          p.write_text(s)

          # Admin payment form: only the agreed fields and no image/instruction field.
          p = Path('src/pages/AdminPlanUsagePageV2.tsx')
          s = p.read_text()
          start = s.find('  const addMethod = async () =>')
          end = s.find('  const deleteMethod = async', start)
          if start < 0 or end < 0:
              raise SystemExit('admin addMethod block missing')
          add = """  const addMethod = async () => { const type = newMethod.paymentType.trim().toUpperCase(); if (!type) { toast('Jenis pembayaran wajib dipilih.', 'error'); return; } if (type === 'BANK_TRANSFER' && (!newMethod.bankName.trim() || !newMethod.accountNumber.trim() || !newMethod.accountName.trim())) { toast('Nama bank, nomor rekening, dan atas nama rekening wajib diisi untuk transfer bank.', 'error'); return; } setBusy(true); try { const details = { bank_name: newMethod.bankName.trim() || null, account_number: newMethod.accountNumber.trim() || null, account_name: newMethod.accountName.trim() || null, random_code_enabled: type === 'BANK_TRANSFER' && newMethod.randomCodeEnabled }; const created = await adminCreateOrganizerPaymentMethod({ name: paymentTypeLabel(type), paymentType: type, details, sortOrder: paymentMethods.length + 1 }); setPaymentMethods((current) => [...current, created]); setNewMethod(emptyMethod); setShowMethodForm(false); toast('Metode pembayaran ditambahkan.', 'success'); } catch (e: any) { toast(e?.message || 'Gagal menambah metode pembayaran.', 'error'); } finally { setBusy(false); } };
"""
          s = s[:start] + add + s[end:]
          s, removed_name = re.subn(r'<label className="block text-xs font-medium text-fg-muted">Nama metode.*?</label>', '', s, count=1, flags=re.S)
          s, removed_info = re.subn(r'<div className="rounded-xl border border-surface-border bg-surface-elevated/30 p-3 text-xs leading-5 text-fg-muted">Detail khusus metode ini.*?</div>', '', s, count=1, flags=re.S)
          if removed_name != 1 or removed_info != 1:
              raise SystemExit(f'legacy admin payment UI not found: name={removed_name}, info={removed_info}')
          s = s.replace('Atas nama<input', 'Atas nama rekening<input', 1)
          s = s.replace('checked={newMethod.randomCodeEnabled} onChange={(e) => setNewMethod((v) => ({ ...v, randomCodeEnabled: e.target.checked }))}', 'checked={newMethod.randomCodeEnabled} disabled={newMethod.paymentType !== \'BANK_TRANSFER\'} onChange={(e) => setNewMethod((v) => ({ ...v, randomCodeEnabled: e.target.checked }))}', 1)
          p.write_text(s)
          PY

          # Remove temporary debug/fixer workflows from the repository in this same final patch.
          rm -f .github/workflows/debug-payment-ui.yml .github/workflows/payment-source-fix.yml .github/workflows/final-payment-ui-cleanup.yml

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OrganizerPlanPageV2.tsx src/pages/AdminPlanUsagePageV2.tsx .github/workflows/debug-payment-ui.yml .github/workflows/payment-source-fix.yml .github/workflows/final-payment-ui-cleanup.yml
          git commit -m "fix(payment): apply final checkout and admin UI source" || true
          git push

      - name: Verify Supabase production target
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL GitHub Actions secret." >&2; exit 1; }
          test "$VITE_SUPABASE_URL" = "$TARGET_SUPABASE_URL" || {
            echo "ERROR: VITE_SUPABASE_URL points to the wrong Supabase project." >&2
            echo "Expected: $TARGET_SUPABASE_URL" >&2
            echo "Actual:   $VITE_SUPABASE_URL" >&2
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_CLOUDINARY_PROFILE_PRESET: ${{ secrets.VITE_CLOUDINARY_PROFILE_PRESET }}
          VITE_EDGE_FUNCTION_URL: ${{ secrets.VITE_EDGE_FUNCTION_URL }}

      - name: Production smoke test
        run: node scripts/rpd-smoke.mjs
