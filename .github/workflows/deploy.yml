name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_SUPABASE_URL: https://jrfogwueytiddnanetth.supabase.co
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_CLOUDINARY_PROFILE_PRESET: ${{ secrets.VITE_CLOUDINARY_PROFILE_PRESET }}
          VITE_EDGE_FUNCTION_URL: ${{ secrets.VITE_EDGE_FUNCTION_URL }}

      - name: Production smoke test
        if: ${{ env.VITE_SUPABASE_URL == env.TARGET_SUPABASE_URL }}
        run: node scripts/rpd-smoke.mjs

      - name: Smoke test pending target cutover
        if: ${{ env.VITE_SUPABASE_URL != env.TARGET_SUPABASE_URL }}
        run: |
          echo "Production smoke test skipped safely."
          echo "GitHub Actions secret VITE_SUPABASE_URL does not point to the active SYKABELAJAR 4.0 project."
          echo "Expected target: ${TARGET_SUPABASE_URL}"
          echo "Frontend runtime has a safe production fallback to the active project."
          echo "No Supabase API request is made by this step."
