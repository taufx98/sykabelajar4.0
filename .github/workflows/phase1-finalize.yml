name: Phase 1 Finalize Canonical Names

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate canonical names
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" != "refactor: phase 1 canonical finalization" || exit 0

          find src scripts -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' \) -print0 | xargs -0 perl -pi -e 's/\bProfilePageV4\b/ProfilePage/g; s/\bProfilePageV3\b/ProfilePage/g; s/\bNotificationsPageV2\b/NotificationsPage/g; s/\bMessagesPageV6\b/MessagesPage/g; s/\bAdminChatConsolePageV3\b/AdminChatConsolePage/g; s/\bAdminPlanUsagePageV2\b/AdminPlanUsagePage/g; s/\bOrganizerPlanPageV2\b/OrganizerPlanPage/g; s/\bcreateOrganizerPlanOrderV3\b/createOrganizerPlanOrder/g; s/\bget_home_snapshot_v1\b/get_home_snapshot/g; s/\bget_public_leaderboard_v2\b/get_public_leaderboard/g; s/\bget_public_coin_leaderboard_v2\b/get_public_coin_leaderboard/g; s/\bget_public_competitions_v2\b/get_public_competitions/g; s/\bget_public_competitions_v3\b/get_public_competitions/g; s/\bget_public_feed_v2\b/get_public_feed/g; s/\bget_public_feed_v3\b/get_public_feed/g; s/\bregister_for_competition_v4_8\b/register_for_competition/g; s/\bload_my_threads_v2\b/load_my_threads/g; s/\bcreate_organizer_plan_order_v2\b/create_organizer_plan_order/g; s/\bcreate_organizer_plan_order_v3\b/create_organizer_plan_order/g'

          rm -f src/pages/AdminPlanUsagePage.tsx src/pages/OrganizerPlanPage.tsx
          if test -f src/pages/AdminPlanUsagePageV2.tsx; then mv src/pages/AdminPlanUsagePageV2.tsx src/pages/AdminPlanUsagePage.tsx; fi
          if test -f src/pages/OrganizerPlanPageV2.tsx; then mv src/pages/OrganizerPlanPageV2.tsx src/pages/OrganizerPlanPage.tsx; fi
          if test -f src/pages/ProfilePageV4.tsx; then mv src/pages/ProfilePageV4.tsx src/pages/ProfilePage.tsx; fi
          if test -f src/pages/NotificationsPageV2.tsx; then mv src/pages/NotificationsPageV2.tsx src/pages/NotificationsPage.tsx; fi
          if test -f src/pages/MessagesPageV6.tsx; then mv src/pages/MessagesPageV6.tsx src/pages/MessagesPage.tsx; fi
          if test -f src/pages/AdminChatConsolePageV3.tsx; then mv src/pages/AdminChatConsolePageV3.tsx src/pages/AdminChatConsolePage.tsx; fi
          rm -f src/pages/ProfilePageV3.tsx src/pages/AdminChatConsolePageV2.tsx src/pages/AdminPage.tsx.tmp src/pages/AdminUsernameMove.tmp

          cat > supabase/migrations/20260906_phase_1_canonical_names.sql <<'SQL'
          -- Phase 1 canonicalization record. Production changes were applied in the same
          -- phase before this repository record was committed. Migration history is append-only.
          begin;
          drop function if exists public.create_organizer_plan_order_v2(uuid, text, text, text, text, text, integer, integer, text, text, text);
          drop function if exists public.get_public_competitions_v2(integer);
          drop function if exists public.get_public_feed_v2(integer, timestamptz);
          alter function public.get_home_snapshot_v1(integer) rename to get_home_snapshot;
          commit;
          SQL

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/phase1-finalize.yml
          git add -A
          git commit -m 'refactor: phase 1 canonical finalization'
          git push