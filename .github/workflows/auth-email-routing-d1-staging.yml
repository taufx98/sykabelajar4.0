name: Auth Multi-provider Email Routing D1 Staging

on:
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - ".github/auth-ops/APPLY-STAGING-D1-0010"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY-MULTI-PROVIDER-EMAIL-sykabelajar-auth-poc to apply the reviewed email routing schema to staging D1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auth-staging-email-routing-d1
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/security/auth-poc-stage-1' && github.actor == 'taufx98' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/auth-worker
    steps:
      - name: Checkout reviewed staging migration
        uses: actions/checkout@v7
        with:
          ref: security/auth-poc-stage-1

      - name: Verify owner, exact staging target and one-time authorization
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "taufx98" || { echo "Only the repository owner may apply this staging migration." >&2; exit 1; }
          test "$GITHUB_REF" = "refs/heads/security/auth-poc-stage-1" || { echo "Wrong auth migration branch." >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "APPLY-MULTI-PROVIDER-EMAIL-sykabelajar-auth-poc" || {
              echo "Exact staging migration confirmation is missing." >&2
              exit 1
            }
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            marker="../../.github/auth-ops/APPLY-STAGING-D1-0010"
            test -f "$marker" || { echo "Staging migration marker is missing." >&2; exit 1; }
            test "$(cat "$marker")" = "APPLY-MULTI-PROVIDER-EMAIL-sykabelajar-auth-poc" || {
              echo "Staging migration marker does not match the exact target." >&2
              exit 1
            }
          else
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const file = readFileSync("migrations/0010_multi_provider_email_routing.sql");
          const expected = "dcc1d9a18aff172a04305f932a8c4066393343fe8feb274421203cafb342bbe2";
          if (createHash("sha256").update(file).digest("hex") !== expected) {
            throw new Error("Reviewed staging email-routing migration hash mismatch.");
          }
          const config = readFileSync("wrangler.toml", "utf8");
          for (const pattern of [
            /^name = "sykabelajar-auth-poc"$/m,
            /^database_name = "sykabelajar-auth-poc"$/m,
            /^database_id = "7a4f9008-a1c6-42b6-8a04-abde12699248"$/m,
            /^migrations_dir = "migrations"$/m,
          ]) if (!pattern.test(config)) throw new Error("Staging Wrangler config does not match the approved isolated target.");
          console.log("Verified reviewed additive migration and exact staging-only D1 config.");
          NODE

      - name: Install locked dependencies and run Worker tests
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/auth-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test

      - name: Verify Cloudflare confirms the exact staging D1 UUID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error("Cloudflare Actions secrets are not configured.");
          const id = "7a4f9008-a1c6-42b6-8a04-abde12699248";
          const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + encodeURIComponent(accountId) + "/d1/database/" + id, {
            headers: { Authorization: "Bearer " + token, Accept: "application/json" },
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success !== true || payload.result?.uuid !== id || payload.result?.name !== "sykabelajar-auth-poc") {
            throw new Error("Cloudflare did not verify the fixed staging D1 target.");
          }
          console.log("Verified the fixed non-production D1 database.");
          NODE

      - name: Apply the additive staging email-routing schema only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --file migrations/0010_multi_provider_email_routing.sql

      - name: Verify routing tables, secure defaults and empty provider inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('auth_email_provider_accounts','auth_email_provider_settings') ORDER BY name;" > "$RUNNER_TEMP/email-routing-tables.json"
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT auto_failover_enabled FROM auth_email_provider_settings WHERE id=1;" > "$RUNNER_TEMP/email-routing-default.json"
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT COUNT(*) AS accounts FROM auth_email_provider_accounts;" > "$RUNNER_TEMP/email-routing-count.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const read = (name) => JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/" + name, "utf8"));
          const visit = (value, output) => {
            if (Array.isArray(value)) return value.forEach((item) => visit(item, output));
            if (!value || typeof value !== "object") return;
            output.push(value);
            Object.values(value).forEach((item) => { if (item && typeof item === "object") visit(item, output); });
          };
          const tables=[]; visit(read("email-routing-tables.json"),tables);
          const names=tables.map((row)=>row.name).filter(Boolean);
          if (!names.includes("auth_email_provider_accounts") || !names.includes("auth_email_provider_settings")) throw new Error("Email routing tables were not created.");
          const settings=[]; visit(read("email-routing-default.json"),settings);
          const policy=settings.find((row)=>Object.hasOwn(row,"auto_failover_enabled"));
          if (!policy || Number(policy.auto_failover_enabled)!==1) throw new Error("Auto failover must default to enabled.");
          const counts=[]; visit(read("email-routing-count.json"),counts);
          const inventory=counts.find((row)=>Object.hasOwn(row,"accounts"));
          if (!inventory || Number(inventory.accounts)!==0) throw new Error("Migration must not seed provider credentials or accounts.");
          console.log("PASS: routing schema exists, failover defaults on, and provider account inventory remains empty.");
          NODE

      - name: Remove temporary verification output
        if: always()
        run: rm -f "$RUNNER_TEMP/email-routing-tables.json" "$RUNNER_TEMP/email-routing-default.json" "$RUNNER_TEMP/email-routing-count.json"
