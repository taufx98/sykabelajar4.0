name: Auth Multi-provider Email Routing D1 Staging

on:
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - ".github/auth-ops/APPLY-STAGING-D1-0010"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY-MULTI-PROVIDER-EMAIL-sykabelajar-auth-poc to apply the reviewed email routing schema to staging D1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auth-staging-email-routing-d1
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/security/auth-poc-stage-1' && github.actor == 'taufx98' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/auth-worker
    steps:
      - name: Checkout reviewed staging migration
        uses: actions/checkout@v7
        with:
          ref: security/auth-poc-stage-1

      - name: Verify owner, exact staging target and one-time authorization
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "taufx98" || { echo "Only the repository owner may apply this staging migration." >&2; exit 1; }
          test "$GITHUB_REF" = "refs/heads/security/auth-poc-stage-1" || { echo "Wrong auth migration branch." >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "APPLY-MULTI-PROVIDER-EMAIL-sykabelajar-auth-poc" || {
              echo "Exact staging migration confirmation is missing." >&2
              exit 1
            }
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            marker="../../.github/auth-ops/APPLY-STAGING-D1-0010"
            test -f "$marker" || { echo "Staging migration marker is missing." >&2; exit 1; }
            test "$(cat "$marker")" = "APPLY-MULTI-PROVIDER-EMAIL-sykabelajar-auth-poc" || {
              echo "Staging migration marker does not match the exact target." >&2
              exit 1
            }
          else
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const runtimeSettings = readFileSync("migrations/0009_auth_runtime_settings.sql");
          const runtimeSettingsSha256 = createHash("sha256").update(runtimeSettings).digest("hex");
          if (runtimeSettingsSha256 !== "f0bf29fcaebf416ddcdb3758000dc1fbecce7b7ee6be5bbd2e6e10e17755a158") {
            throw new Error("Reviewed staging runtime-settings migration hash mismatch.");
          }
          const file = readFileSync("migrations/0010_multi_provider_email_routing.sql");
          const expected = "dcc1d9a18aff172a04305f932a8c4066393343fe8feb274421203cafb342bbe2";
          if (createHash("sha256").update(file).digest("hex") !== expected) {
            throw new Error("Reviewed staging email-routing migration hash mismatch.");
          }
          const config = readFileSync("wrangler.toml", "utf8");
          for (const pattern of [
            /^name = "sykabelajar-auth-poc"$/m,
            /^database_name = "sykabelajar-auth-poc"$/m,
            /^database_id = "7a4f9008-a1c6-42b6-8a04-abde12699248"$/m,
            /^migrations_dir = "migrations"$/m,
          ]) if (!pattern.test(config)) throw new Error("Staging Wrangler config does not match the approved isolated target.");
          console.log("Verified reviewed additive migration and exact staging-only D1 config.");
          NODE

      - name: Install locked dependencies and run Worker tests
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/auth-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test

      - name: Verify Cloudflare confirms the exact staging D1 UUID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error("Cloudflare Actions secrets are not configured.");
          const id = "7a4f9008-a1c6-42b6-8a04-abde12699248";
          const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + encodeURIComponent(accountId) + "/d1/database/" + id, {
            headers: { Authorization: "Bearer " + token, Accept: "application/json" },
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success !== true || payload.result?.uuid !== id || payload.result?.name !== "sykabelajar-auth-poc") {
            throw new Error("Cloudflare did not verify the fixed staging D1 target.");
          }
          console.log("Verified the fixed non-production D1 database.");
          NODE

      - name: Verify only reviewed D1 migrations 0009–0010 are pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT name FROM d1_migrations ORDER BY name;" > "$RUNNER_TEMP/email-routing-migrations-before.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const payload = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/email-routing-migrations-before.json", "utf8"));
          const names = new Set();
          const visit = (value) => {
            if (Array.isArray(value)) return value.forEach(visit);
            if (!value || typeof value !== "object") return;
            if (typeof value.name === "string") names.add(value.name);
            Object.values(value).forEach(visit);
          };
          visit(payload);
          const base = [
            "0000_auth_worker_internal_config.sql",
            "0001_better_auth.sql",
            "0002_seed_first_party_oauth_client.sql",
            "0003_zeptomail_agent_settings.sql",
            "0004_better_auth_registration_attributes.sql",
            "0005_telegram_phone_verification.sql",
            "0006_transactional_email_provider.sql",
            "0007_managed_social_login_providers.sql",
            "0008_add_staging_oauth_callback.sql",
            "0011_add_github_social_provider.sql",
          ];
          for (const name of base) {
            if (!names.has(name)) throw new Error("Required staging migration is not recorded as applied: " + name);
          }
          const allowed = new Set([...base, "0009_auth_runtime_settings.sql", "0010_multi_provider_email_routing.sql"]);
          const unexpected = [...names].filter((name) => !allowed.has(name));
          if (unexpected.length) throw new Error("Unreviewed staging migration history found; refusing remote change: " + unexpected.join(", "));
          console.log("PASS: migrations 0000–0008 and separately authorized 0011 are recorded; only reviewed 0009/0010 may be pending.");
          NODE

      - name: Apply only reviewed staging migrations 0009–0010 through the D1 migration ledger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler --config wrangler.toml d1 migrations apply sykabelajar-auth-poc --remote

      - name: Verify runtime policy, routing tables, secure defaults and empty provider inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.toml d1 migrations list sykabelajar-auth-poc --remote
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT name FROM d1_migrations WHERE name IN ('0009_auth_runtime_settings.sql','0010_multi_provider_email_routing.sql') ORDER BY name;" > "$RUNNER_TEMP/email-routing-migrations-after.json"
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('auth_runtime_settings','auth_email_provider_accounts','auth_email_provider_settings') ORDER BY name;" > "$RUNNER_TEMP/email-routing-tables.json"
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT auto_failover_enabled FROM auth_email_provider_settings WHERE id=1;" > "$RUNNER_TEMP/email-routing-default.json"
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT COUNT(*) AS accounts FROM auth_email_provider_accounts;" > "$RUNNER_TEMP/email-routing-count.json"
          npx wrangler --config wrangler.toml d1 execute sykabelajar-auth-poc --remote --json --command "SELECT COUNT(*) AS settings_rows FROM auth_runtime_settings WHERE id=1;" > "$RUNNER_TEMP/email-routing-runtime-policy.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const read = (name) => JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/" + name, "utf8"));
          const visit = (value, output) => {
            if (Array.isArray(value)) return value.forEach((item) => visit(item, output));
            if (!value || typeof value !== "object") return;
            output.push(value);
            Object.values(value).forEach((item) => { if (item && typeof item === "object") visit(item, output); });
          };
          const migrations=[]; visit(read("email-routing-migrations-after.json"),migrations);
          const migrationNames=new Set(migrations.map((row)=>row.name).filter(Boolean));
          if (!migrationNames.has("0009_auth_runtime_settings.sql") || !migrationNames.has("0010_multi_provider_email_routing.sql")) throw new Error("Both staging migrations must be recorded in d1_migrations.");
          const tables=[]; visit(read("email-routing-tables.json"),tables);
          const names=tables.map((row)=>row.name).filter(Boolean);
          if (!names.includes("auth_runtime_settings") || !names.includes("auth_email_provider_accounts") || !names.includes("auth_email_provider_settings")) throw new Error("Runtime policy and email routing tables were not created.");
          const runtime=[]; visit(read("email-routing-runtime-policy.json"),runtime);
          const runtimeRow=runtime.find((row)=>Object.hasOwn(row,"settings_rows"));
          if (!runtimeRow || Number(runtimeRow.settings_rows)!==1) throw new Error("Expected exactly one existing staging runtime verification policy row.");
          const settings=[]; visit(read("email-routing-default.json"),settings);
          const policy=settings.find((row)=>Object.hasOwn(row,"auto_failover_enabled"));
          if (!policy || Number(policy.auto_failover_enabled)!==1) throw new Error("Auto failover must default to enabled.");
          const counts=[]; visit(read("email-routing-count.json"),counts);
          const inventory=counts.find((row)=>Object.hasOwn(row,"accounts"));
          if (!inventory || Number(inventory.accounts)!==0) throw new Error("Migration must not seed provider credentials or accounts.");
          console.log("PASS: D1 ledger records migrations 0009–0010; runtime policy remains present; routing schema exists, failover defaults on, and provider account inventory remains empty.");
          NODE

      - name: Remove temporary verification output
        if: always()
        run: rm -f "$RUNNER_TEMP/email-routing-migrations-before.json" "$RUNNER_TEMP/email-routing-migrations-after.json" "$RUNNER_TEMP/email-routing-tables.json" "$RUNNER_TEMP/email-routing-default.json" "$RUNNER_TEMP/email-routing-count.json" "$RUNNER_TEMP/email-routing-runtime-policy.json"
