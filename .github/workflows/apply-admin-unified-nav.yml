name: Apply unified admin navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply unified admin shell
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) AdminControlCenter: keep the dashboard/header only; shared nav now lives in AppLayout.
          p = Path('src/pages/AdminControlCenterPage.tsx')
          s = p.read_text()
          s = s.replace("import { Link } from 'react-router-dom';\nimport { ShieldCheck } from 'lucide-react';\nimport { Badge } from '@/components/ui/Badge';\nimport { AdminDashboard } from '@/components/admin/AdminDashboard';", "import { Link } from 'react-router-dom';\nimport { ShieldCheck } from 'lucide-react';\nimport { Badge } from '@/components/ui/Badge';\nimport { AdminDashboard } from '@/components/admin/AdminDashboard';")
          start = s.find('function AdminModuleNav() {')
          if start != -1:
              end = s.find('export function AdminControlCenterPage() {', start)
              s = s[:start] + s[end:]
          p.write_text(s)

          # 2) Core Admin: remove the legacy second header/tab/overflow implementation.
          p = Path('src/pages/AdminPage.tsx')
          s = p.read_text()
          s = s.replace("import { useEffect, useMemo, useRef, useState } from 'react';", "import { useEffect, useMemo, useState } from 'react';")
          s = s.replace("  const [visibleTabKeys, setVisibleTabKeys] = useState<CoreAdminTab[]>(tabs.map(t => t.key));\n  const [overflowOpen, setOverflowOpen] = useState(false);\n  const tabNavRef = useRef<HTMLDivElement | null>(null);\n", "")
          marker = "  useEffect(() => { if (requestedTab && tabs.some(t => t.key === requestedTab)) setTab(requestedTab); }, [requestedTab]);\n"
          first = s.find(marker)
          second = s.find("  const load = async () => {", first + len(marker)) if first != -1 else -1
          if first != -1 and second != -1:
              s = s[:first] + marker + "\n" + s[second:]
          header_start = s.find('    <div className=\"sticky top-0 z-30 glass border-b surface-border\">')
          section_start = s.find('    <section className=\"p-4 md:p-6 max-w-7xl mx-auto\">', header_start)
          if header_start != -1 and section_start != -1:
              s = s[:header_start] + '    <section className=\"p-4 md:p-6 max-w-7xl mx-auto\">' + s[section_start + len('    <section className=\"p-4 md:p-6 max-w-7xl mx-auto\">'):]
          p.write_text(s)

          # 3) AppLayout: mount the one shared AdminModuleNav above every admin module except
          #    modules already exposed directly in the sidebar.
          p = Path('src/components/layout/AppLayout.tsx')
          s = p.read_text()
          if "@/components/admin/AdminModuleNav" not in s:
              anchor = "import { ThemeToggle } from '@/components/ui/ThemeToggle';"
              s = s.replace(anchor, anchor + "\nimport { AdminModuleNav, shouldShowAdminModuleNav } from '@/components/admin/AdminModuleNav';")
          old = '<main className="flex-1 min-w-0 pt-14 md:pt-0 pb-16 md:pb-0 surface-bg"><Outlet/></main>'
          new = '<main className="flex-1 min-w-0 pt-14 md:pt-0 pb-16 md:pb-0 surface-bg">{isAdmin && shouldShowAdminModuleNav(location.pathname) && <AdminModuleNav />}<Outlet/></main>'
          if old not in s:
              raise SystemExit('Expected AppLayout main marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/admin/AdminModuleNav.tsx src/components/layout/AppLayout.tsx src/pages/AdminControlCenterPage.tsx src/pages/AdminPage.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0 || true
          git commit -m "fix(admin): unify module navigation shell"
          git push

      - name: Remove helper workflow
        run: |
          git rm .github/workflows/apply-admin-unified-nav.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(admin): remove navigation helper workflow"
          git push
