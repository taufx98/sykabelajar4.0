name: tmp-chat-audit-push
on:
  push:
    branches: [main]
    paths: ['.chat-audit-trigger']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat realtime
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path); s = p.read_text()
              if old not in s: raise SystemExit(f'missing pattern: {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once('src/components/layout/AppLayout.tsx', "import { startPublicRealtime } from '@/lib/realtimeHub';", "import { startPublicRealtime, startUserRealtime } from '@/lib/realtimeHub';")
          replace_once('src/components/layout/AppLayout.tsx', "    const chatCacheKey = `chat.unread.${user.id}`;", "    const stopUser = startUserRealtime(user.id, isAdmin);\n\n    const chatCacheKey = `chat.unread.${user.id}`;")
          old = "      if (event.type === 'chat-message') {\n        const senderId = String(event.message.sender_id ?? '');\n        if (senderId === user.id) return;\n        setUnreadMessages((value) => {\n          const next = value + 1;\n          setPersistentCache(chatCacheKey, next, { ttlMs: CHAT_CACHE_TTL });\n          return next;\n        });\n        return;\n      }\n      if (event.type === 'chat-read' || event.type === 'chat-hidden') {\n        setUnreadMessages((value) => {\n          const next = Math.max(0, value - 1);\n          setPersistentCache(chatCacheKey, next, { ttlMs: CHAT_CACHE_TTL });\n          return next;\n        });\n        return;\n      }"
          new = "      if (event.type === 'chat-read' || event.type === 'chat-hidden') {\n        void getUnreadChatCount(true).then((count) => {\n          setUnreadMessages(count);\n          setPersistentCache(chatCacheKey, count, { ttlMs: CHAT_CACHE_TTL });\n        }).catch(() => {});\n        return;\n      }"
          replace_once('src/components/layout/AppLayout.tsx', old, new)
          replace_once('src/components/layout/AppLayout.tsx', "    return () => {\n      unsubscribe();\n      stopPublic();\n    };", "    return () => {\n      unsubscribe();\n      stopUser();\n      stopPublic();\n    };")

          replace_once('src/pages/MessagesPageV6.tsx', "import { emitSykaEvent } from '@/lib/realtimeBus';", "import { emitSykaEvent, subscribeSykaEvents } from '@/lib/realtimeBus';")
          replace_once('src/pages/MessagesPageV6.tsx', "      setMessages(rows);cacheSet(selected.id,rows);setHasOlder(rows.length>=PAGE);", "      setMessages(current => { const byId = new Map(rows.map(x => [x.id, x])); for (const item of current) if (!byId.has(item.id)) byId.set(item.id, item); const merged = [...byId.values()].sort((a,b) => a.created_at.localeCompare(b.created_at)); cacheSet(selected.id, merged); return merged; }); setHasOlder(rows.length>=PAGE);")
          replace_once('src/pages/MessagesPageV6.tsx', "    const ch=supabase.channel('chat-stable-'+selected.id)", "    const unsubscribeBus = subscribeSykaEvents((event) => { if (event.type === 'chat-message') { const m = event.message as unknown as ChatMessage; if (m.thread_id === selected.id) setThreads(v => v.map(t => t.id === selected.id ? { ...t, last_message: m.body, last_message_at: m.created_at, unread_count: m.sender_id === me ? t.unread_count : 0 } : t)); } if (event.type === 'chat-thread-updated' && String(event.thread.id ?? '') === selected.id) setSelected(v => v ? { ...v, ...(event.thread as unknown as ChatThread) } : v); }); const ch=supabase.channel('chat-stable-'+selected.id)")
          replace_once('src/pages/MessagesPageV6.tsx', "return()=>{live=false;void supabase.removeChannel(ch)}},[selected?.id,me,refresh,toast]);", "return()=>{live=false;unsubscribeBus();void supabase.removeChannel(ch)}},[selected?.id,me,refresh,toast]);")
          replace_once('src/pages/MessagesPageV6.tsx', "const saved=await sendMessage(selected.id,text);setMessages(v=>v.map(x=>x.id===optimistic.id?saved:x));cacheSet(selected.id,[...messages,saved])", "const saved=await sendMessage(selected.id,text);setMessages(v=>{const next=v.map(x=>x.id===optimistic.id?saved:x);cacheSet(selected.id,next);return next})")

          replace_once('src/components/ui/ChatWidget.tsx', "import { subscribeSykaEvents } from '@/lib/realtimeBus';", "import { emitSykaEvent, subscribeSykaEvents } from '@/lib/realtimeBus';")
          replace_once('src/components/ui/ChatWidget.tsx', "      const msgs = await loadChatMessagesPage(thread.id);\n      setMessages(msgs);", "      const msgs = await loadChatMessagesPage(thread.id);\n      setMessages(current => { const byId = new Map(msgs.map(x => [x.id, x])); for (const item of current) if (!byId.has(item.id)) byId.set(item.id, item); return [...byId.values()].sort((a,b) => a.created_at.localeCompare(b.created_at)); });")
          replace_once('src/components/ui/ChatWidget.tsx', "        if (!alive || !message?.id) return;\n        setMessages((current) => current.some((item) => item.id === message.id) ? current : [...current, message]);", "        if (!alive || !message?.id) return;\n        setMessages((current) => { const next = current.some((item) => item.id === message.id) ? current : [...current, message]; return next.sort((a,b) => a.created_at.localeCompare(b.created_at)); });\n        emitSykaEvent({ type: 'chat-message', message: message as unknown as Record<string, unknown> });")
          replace_once('src/components/ui/ChatWidget.tsx', "      setMessages((prev) => prev.some((item) => item.id === msg.id) ? prev : [...prev, msg]);\n      setInput('');", "      setMessages((prev) => { const next = prev.some((item) => item.id === msg.id) ? prev : [...prev, msg]; next.sort((a,b) => a.created_at.localeCompare(b.created_at)); return next; });\n      emitSykaEvent({ type: 'chat-message', message: msg as unknown as Record<string, unknown> });\n      setInput('');")

          replace_once('src/pages/AdminChatConsolePage.tsx', "import { supabase } from '@/lib/supabase';", "import { supabase } from '@/lib/supabase';\nimport { emitSykaEvent, subscribeSykaEvents } from '@/lib/realtimeBus';")
          replace_once('src/pages/AdminChatConsolePage.tsx', "const refresh = useCallback(async () => { try { setThreads(await loadMyThreads()); }", "const refresh = useCallback(async () => { try { setThreads(await loadMyThreads(true)); }")
          old_admin = "useEffect(() => { void refresh(); const channel = supabase.channel('admin-chat-threads-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_threads'},()=>void refresh()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_threads'},payload=>{const updated=payload.new as ChatThread;setThreads(current=>current.map(item=>item.id===updated.id?{...item,...updated}:item));void refresh();}).subscribe((status,error)=>{if(error)console.error('[SykaBelajar] admin chat thread realtime error',status,error)});return()=>{void supabase.removeChannel(channel);}; }, [refresh]);"
          new_admin = "useEffect(() => { void refresh(); const bus = subscribeSykaEvents((event) => { if (event.type !== 'chat-message') return; const m = event.message as unknown as ChatMessage; setThreads(current => current.map(item => item.id === m.thread_id ? { ...item, last_message: m.body, last_message_at: m.created_at, unread_count: m.sender_id === user?.id ? item.unread_count : 0 } : item)); }); const channel = supabase.channel('admin-chat-threads-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_threads'},()=>void refresh()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_threads'},payload=>{const updated=payload.new as ChatThread;setThreads(current=>current.map(item=>item.id===updated.id?{...item,...updated}:item));}).subscribe((status,error)=>{if(error)console.error('[SykaBelajar] admin chat thread realtime error',status,error)});return()=>{bus();void supabase.removeChannel(channel);}; }, [refresh,user?.id]);"
          replace_once('src/pages/AdminChatConsolePage.tsx', old_admin, new_admin)
          replace_once('src/pages/AdminChatConsolePage.tsx', "if(live)setMessages(v=>v.some(x=>x.id===m.id)?v:[...v,m]);}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_threads'", "if(live){setMessages(v=>v.some(x=>x.id===m.id)?v:[...v,m]);emitSykaEvent({type:'chat-message',message:m as unknown as Record<string,unknown>});}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_threads'")
          replace_once('src/pages/AdminChatConsolePage.tsx', "const msg = await sendMessage(selected.id, input.trim()); setMessages(v => v.some(x => x.id === msg.id) ? v : [...v, msg]); setInput(''); await refresh();", "const msg = await sendMessage(selected.id, input.trim()); setMessages(v => v.some(x => x.id === msg.id) ? v : [...v, msg]); emitSykaEvent({ type: 'chat-message', message: msg as unknown as Record<string, unknown> }); setInput('');")

          Path('.chat-audit-trigger').unlink(missing_ok=True)
          Path('.github/workflows/tmp-fix-chat-audit.yml').unlink(missing_ok=True)
          Path('.github/workflows/tmp-chat-audit-push.yml').unlink(missing_ok=True)
          print('patched and cleaned')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(chat): complete realtime lifecycle and cache audit'
          git push
