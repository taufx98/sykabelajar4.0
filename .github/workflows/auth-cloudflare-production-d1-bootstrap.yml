name: Auth Cloudflare D1 Production Bootstrap

on:
  push:
    branches:
      - security/auth-poc-stage-1
    paths:
      - ".github/auth-ops/CREATE-PRODUCTION-D1-0001"

permissions:
  contents: read

concurrency:
  group: auth-production-d1-bootstrap
  cancel-in-progress: false

jobs:
  provision:
    if: ${{ github.ref == 'refs/heads/security/auth-poc-stage-1' }}
    name: Create or verify the empty Production D1 database only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact one-time Production database request
        run: |
          set -euo pipefail
          marker=".github/auth-ops/CREATE-PRODUCTION-D1-0001"
          test -f "$marker" || { echo "Blocked: exact Production D1 marker is missing." >&2; exit 1; }
          test "$(cat "$marker")" = "CREATE-EMPTY-PRODUCTION-D1-sykabelajar-auth-prod" || {
            echo "Blocked: the Production D1 marker does not match the exact database target." >&2
            exit 1
          }
          test "$GITHUB_REF" = "refs/heads/security/auth-poc-stage-1" || {
            echo "Blocked: this workflow runs only on the auth migration branch." >&2
            exit 1
          }

      - name: Create or verify the exact empty Production D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret." >&2; exit 1; }

          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const databaseName = "sykabelajar-auth-prod";
          const base = "https://api.cloudflare.com/client/v4/accounts/" + encodeURIComponent(accountId);
          const headers = {
            Authorization: "Bearer " + token,
            Accept: "application/json",
            "Content-Type": "application/json",
          };

          async function call(path, method = "GET", body) {
            const response = await fetch(base + path, {
              method,
              headers,
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            const payload = await response.json().catch(() => ({}));
            return { ok: response.ok && payload.success === true, status: response.status, payload };
          }

          const listed = await call("/d1/database?per_page=100");
          if (!listed.ok || !Array.isArray(listed.payload.result)) {
            const errors = (listed.payload.errors ?? []).map((item) => ({
              code: item.code,
              message: String(item.message ?? "").slice(0, 180),
            }));
            console.error(JSON.stringify({ step: "list-d1", status: listed.status, errors }));
            process.exit(1);
          }

          const databases = listed.payload.result;
          const matches = databases.filter((item) => item.name === databaseName);
          if (matches.length > 1) {
            console.error("Blocked: duplicate D1 names match the Production target.");
            process.exit(1);
          }

          let row = matches[0];
          let status = "already_exists";
          if (!row) {
            if (databases.length >= 10) {
              console.error(JSON.stringify({
                status: "blocked_free_limit",
                totalD1Databases: databases.length,
                message: "No database was created. The account already has 10 or more D1 databases.",
              }, null, 2));
              process.exit(1);
            }
            const created = await call("/d1/database", "POST", {
              name: databaseName,
              primary_location_hint: "apac",
              read_replication: { mode: "disabled" },
            });
            row = created.payload.result;
            if (!created.ok || row?.name !== databaseName || !row?.uuid) {
              const errors = (created.payload.errors ?? []).map((item) => ({
                code: item.code,
                message: String(item.message ?? "").slice(0, 180),
              }));
              console.error(JSON.stringify({ step: "create-d1", status: created.status, errors }, null, 2));
              process.exit(1);
            }
            status = "created";
          }

          if (!row?.uuid || row.name !== databaseName) {
            console.error("Blocked: the returned database name/UUID does not match the exact Production target.");
            process.exit(1);
          }

          const verified = await call("/d1/database/" + encodeURIComponent(row.uuid));
          if (!verified.ok || verified.payload.result?.name !== databaseName ||
              verified.payload.result?.uuid !== row.uuid) {
            console.error("Blocked: Cloudflare did not confirm the exact Production D1 database after creation.");
            process.exit(1);
          }

          const summary = {
            status,
            name: databaseName,
            uuid: row.uuid,
            primaryLocationHint: "apac",
            readReplication: "disabled",
            totalD1Databases: databases.length + (status === "created" ? 1 : 0),
            workerDeploymentAttempted: false,
            stagingDatabaseModified: false,
            dnsOrCustomDomainModified: false,
          };
          console.log(JSON.stringify(summary, null, 2));
          await import("node:fs/promises").then(({ appendFile }) =>
            appendFile(process.env.GITHUB_STEP_SUMMARY,
              "## Empty Production D1 verified\n\n" +
              "```json\n" + JSON.stringify(summary, null, 2) + "\n```\n"));
          NODE
