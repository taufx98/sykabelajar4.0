name: normalize legacy toast bridge

on:
  push:
    branches:
      - fix/unify-sykabelajar-notifications

permissions:
  contents: write

jobs:
  normalize:
    if: "!startsWith(github.event.head_commit.message, 'fix: route legacy app to global toast')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/unify-sykabelajar-notifications
          fetch-depth: 1

      - name: Route AppContext toast to the global toast system
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/store/AppContext.tsx')
          text = path.read_text()

          old_import = "import { getUnreadNotificationCount } from '@/services/notification.service';"
          new_import = old_import + "\nimport { toast as globalToast } from '@/lib/toast';"
          if "import { toast as globalToast } from '@/lib/toast';" not in text:
              text = text.replace(old_import, new_import, 1)

          old_toast = '''  const toast = useCallback((message: string, type: 'success' | 'error' | 'info' = 'success') => {\n    // The circuit breaker still returns the error to the frontend, but its internal duplicate-request\n    // message must remain silent. Only the original backend failure is shown to the user.\n    if (message.includes('Permintaan identik diblokir sampai halaman dimuat ulang atau payload berubah.')) return;\n\n    const id = crypto.randomUUID();\n    setToasts((items) => [...items, { id, message, type }]);\n    window.setTimeout(() => setToasts((items) => items.filter((x) => x.id !== id)), 3500);\n  }, []);'''
          new_toast = '''  const toast = useCallback((message: string, type: 'success' | 'error' | 'info' = 'success') => {\n    // Compatibility bridge: legacy callers keep using useApp().toast,\n    // but every message is rendered by the single global SYKABELAJAR ToastContainer.\n    if (message.includes('Permintaan identik diblokir sampai halaman dimuat ulang atau payload berubah.')) return;\n    globalToast[type](message);\n  }, []);'''
          if old_toast not in text:
              raise SystemExit('Expected AppContext toast implementation was not found')
          text = text.replace(old_toast, new_toast, 1)
          path.write_text(text)
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/AppContext.tsx
          git rm .github/workflows/_normalize-toast-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: route legacy app to global toast"
          git push origin HEAD:fix/unify-sykabelajar-notifications
