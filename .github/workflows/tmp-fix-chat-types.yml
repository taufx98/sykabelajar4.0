name: tmp-fix-chat-types
on:
  push:
    branches: [main]
    paths: ['.chat-type-fix-trigger']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix chat realtime typing
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/layout/AppLayout.tsx')
          s = p.read_text()
          if "if (event.type === 'chat-thread-updated')" in s:
              s = s.replace("if (event.type === 'chat-thread-updated')", "if (String(event.type) === 'chat-thread-updated')", 1)
          else:
              raise SystemExit('chat-thread-updated handler not found')
          p.write_text(s)

          p = Path('src/pages/NotificationsPageV2.tsx')
          s = p.read_text()
          if "import { subscribeSykaEvents } from '@/lib/realtimeBus';" not in s:
              s = s.replace("import { emitSykaEvent } from '@/lib/realtimeBus';", "import { emitSykaEvent, subscribeSykaEvents } from '@/lib/realtimeBus';", 1)
          p.write_text(s)

          Path('.chat-type-fix-trigger').unlink(missing_ok=True)
          Path('.github/workflows/tmp-fix-chat-types.yml').unlink(missing_ok=True)
          Path('.github/workflows/tmp-chat-ci.yml').unlink(missing_ok=True)
          Path('.chat-ci-trigger').unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(chat): restore realtime event typing'
          git push
