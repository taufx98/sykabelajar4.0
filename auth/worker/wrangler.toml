name = "sykabelajar-auth-poc"
main = "src/index.ts"
compatibility_date = "2026-11-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# Replace this value with the actual workers.dev URL or isolated PoC custom domain.
BETTER_AUTH_URL = "https://sykabelajar-auth-poc.<your-workers-subdomain>.workers.dev"
APP_ORIGINS = "https://sykabelajar.my.id"
SUPABASE_RESOURCE = "https://mvdczyitbkxkldjughor.supabase.co"
OAUTH_REDIRECT_URIS = "https://sykabelajar-auth-poc.<your-workers-subdomain>.workers.dev/__poc/callback"
POC_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "sykabelajar-auth-poc"
# Replace with a dddicated D1 database ID. Never point this binding at another app database.
database_id = "000000000000000000000000000000000"
migrations_dir = "migrations"
